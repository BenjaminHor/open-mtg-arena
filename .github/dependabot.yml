# Weekly dependency update pull requests. Each one must pass `pnpm check` in CI before merging.
version: 2
updates:
  - package-ecosystem: "npm"   # also covers pnpm workspaces
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
