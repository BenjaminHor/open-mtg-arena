# Runs `pnpm check` (typecheck, lint, all tests) on every push and pull request.
# A pull request merges into main only with this green (CLAUDE.md, "How to work").
name: CI

# Pull requests run it before merging; pushes to main run it again on the merged result.
# (Only main for pushes, so a pull request branch doesn't run CI twice per commit.)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version named in package.json's "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
