# Runs `pnpm check` (typecheck, lint, all tests) on every push and pull request.
# A pull request merges into main only with this green (CLAUDE.md, "How to work").
name: CI

# Pushes to every branch trigger it while there is no `main` yet (docs/status.md, Open questions).
# Once `main` exists, limit `push` to main so pull request branches don't run CI twice.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version named in package.json's "packageManager".
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
