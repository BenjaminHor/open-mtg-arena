name: The starting player declares first, even from the second seat
rules: [CR 103.1, CR 103.5]
setup:
  opening: standard
  first: p2
steps:
  - expect:
      pending: { player: p2, kind: mulligan }
  - p1 choose: keep
  - expect error: notYourDecision
  - p2 choose: keep
  - expect:
      pending: { player: p1, kind: mulligan }
