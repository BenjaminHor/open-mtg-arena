name: An "until end of turn" pump ends in the cleanup step
rules: [CR 514.2, CR 611.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Giant Growth]
    battlefield: [Forest, Grizzly Bears]
steps:
  - p1 cast: Giant Growth
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: until end
  - expect:
      p1:Grizzly Bears.power: 5
      p1:Grizzly Bears.toughness: 5
  - all pass: until upkeep
  - expect:
      events contains: [{ type: EFFECT_ENDED, effect: { change: { kind: modifyPT, power: 3, toughness: 3 } } }]
      p1:Grizzly Bears.power: 2
      p1:Grizzly Bears.toughness: 2
