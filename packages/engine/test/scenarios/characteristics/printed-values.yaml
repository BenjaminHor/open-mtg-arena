name: Characteristics start from the printed card, and a land has no power or toughness
rules: [CR 613.1, CR 302.4c, CR 302.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Grizzly Bears, Giant Spider]
steps:
  - expect:
      p1:Grizzly Bears.power: 2
      p1:Grizzly Bears.toughness: 2
      p1:Giant Spider.power: 2
      p1:Giant Spider.toughness: 4
      p1:Giant Spider.abilities contains: [reach]
      p1:Mountain.power: null
      p1:Mountain.toughness: null
