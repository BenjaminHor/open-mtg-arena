name: After playing a land, the player gets priority again
rules: [CR 116.3, CR 305.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Forest, Llanowar Elves]
steps:
  - p1 play: Forest
  - expect:
      p1.battlefield: [Forest]
      pending: { player: p1, kind: priority }
  # Still p1's priority: they can use the land right away.
  - p1 cast: Llanowar Elves
    pay: auto
  - expect:
      stack: [Llanowar Elves]
