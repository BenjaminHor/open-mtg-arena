name: A basic land taps for one mana of its color, without using the stack
rules: [CR 305.6, CR 605.3b, CR 106.4, CR 117.3c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Forest]
steps:
  - p1 activate: Mountain
  - expect:
      p1.manaPool: { R: 1 }
      p1:Mountain.tapped: true
      p1:Forest.tapped: false
      stack: []
      pending: { player: p1, kind: priority }
      events contains: [{ type: PERMANENT_TAPPED }, { type: MANA_ADDED, player: p1, mana: R, amount: 1 }]
  - p1 activate: Forest
  - expect:
      p1.manaPool: { R: 1, G: 1 }
