name: A creature that hasn't been controlled since the turn began can't use a {T} ability, but a new land can
rules: [CR 602.5a, CR 302.6, CR 107.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Llanowar Elves, sick: true }, { card: Mountain, sick: true }]
steps:
  - p1 activate: Llanowar Elves
  - expect error: illegalAction
  - p1 activate: Mountain
  - expect:
      p1.manaPool: { R: 1 }
