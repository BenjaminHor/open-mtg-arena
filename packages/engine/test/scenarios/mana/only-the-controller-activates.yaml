name: Only a permanent's controller can activate its abilities, and only with priority
rules: [CR 602.2, CR 605.3a]
setup:
  turn: { active: p1, step: main1 }
  p2:
    battlefield: [Mountain]
steps:
  - p1 activate: p2:Mountain
  - expect error: illegalAction
  - p2 activate: Mountain
  - expect error: notYourPriority
