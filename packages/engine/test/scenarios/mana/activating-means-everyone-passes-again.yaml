name: Activating a mana ability is an action, so everyone has to pass again before the step ends
rules: [CR 117.4, CR 117.3c]
setup:
  turn: { active: p1, step: main1 }
  p2:
    battlefield: [Mountain]
steps:
  - p1 pass: once
  - p2 activate: Mountain
  - expect:
      p2.manaPool: { R: 1 }
      pending: { player: p2, kind: priority }
  - p2 pass: once
  - expect:
      step: main1
      pending: { player: p1, kind: priority }
