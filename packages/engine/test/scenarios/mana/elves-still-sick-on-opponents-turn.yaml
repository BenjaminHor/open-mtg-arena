name: A creature that entered on its controller's last turn is still summoning sick during the opponent's turn
# "Since their most recent turn began" means the controller's own turn (CR 302.6): p2's Elves entered during p2's
# last turn, after it began, so they can't tap for mana on p1's turn; Elves p2 controlled before then can.
rules: [CR 302.6, CR 602.5a, CR 109.5]
setup:
  turn: { active: p1, step: main1 }
  p2:
    battlefield: [{ card: Llanowar Elves, sick: true }, Llanowar Elves]
steps:
  - p1 pass: once
  - p2 activate: p2:Llanowar Elves#1
  - expect error: illegalAction
  - p2 activate: p2:Llanowar Elves#2
  - expect:
      p2.manaPool: { G: 1 }
