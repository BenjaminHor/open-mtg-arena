name: Mana left unspent empties from the pool when the step ends
rules: [CR 500.5, CR 106.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain]
steps:
  - p1 activate: Mountain
  - p1 activate: Mountain
  - expect:
      p1.manaPool: { R: 2 }
  - all pass: once
  - expect:
      step: combat.beginning
      p1.manaPool: {}
      events contains: [{ type: MANA_EMPTIED, player: p1, lost: { W: 0, U: 0, B: 0, R: 2, G: 0, C: 0 } }]
