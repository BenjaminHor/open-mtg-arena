name: Cancelling an activation removes the ability and undoes the mana it tapped for
rules: [CR 734.1, CR 602.2b, CR 605.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Furnace Whelp]
steps:
  - p1 activate: Furnace Whelp
  - expect:
      pending: { player: p1, kind: payMana }
  - p1 activate: Furnace Whelp
  - expect error: illegalAction
  - p1 activate: Mountain
  - expect:
      p1.manaPool: { R: 1 }
      p1:Mountain.tapped: true
  - p1 choose: cancel
  - expect:
      stack: []
      p1.manaPool: {}
      p1:Mountain.tapped: false
      pending: { player: p1, kind: priority }
      events contains: [{ type: ACTIVATION_CANCELLED, player: p1 }]
