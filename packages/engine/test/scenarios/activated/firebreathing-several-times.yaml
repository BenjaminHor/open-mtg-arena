name: Firebreathing goes on the stack each time, and each resolution adds +1/+0
rules: [CR 602.1a, CR 602.2, CR 602.2a, CR 405.1, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Furnace Whelp]
steps:
  - p1 activate: Furnace Whelp
    pay: auto
  # The activation cost, {R}, is paid by the activating player (CR 602.1a): one Mountain each time.
  - expect:
      stack: [Furnace Whelp ability]
      pending: { player: p1, kind: priority }
      events contains: [{ type: ABILITY_ACTIVATED, player: p1 }]
      p1:Mountain.tapped: true
      p1:Mountain#2.tapped: false
  - p1 activate: Furnace Whelp
    pay: auto
  - p1 activate: Furnace Whelp
    pay: auto
  - expect:
      stack: [Furnace Whelp ability, Furnace Whelp ability, Furnace Whelp ability]
      p1:Furnace Whelp.power: 2
      p1:Mountain#3.tapped: true
  - all pass: once
  - all pass: once
  - all pass: once
  - expect:
      stack: []
      p1:Furnace Whelp.power: 5
      p1:Furnace Whelp.toughness: 2
