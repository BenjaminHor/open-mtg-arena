name: Firebreathing's bonus lasts until end of turn
rules: [CR 514.2, CR 611.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Furnace Whelp]
steps:
  - p1 activate: Furnace Whelp
    pay: auto
  - all pass: once
  - expect:
      p1:Furnace Whelp.power: 3
  - all pass: until upkeep
  - expect:
      p1:Furnace Whelp.power: 2
