name: Firebreathing after blockers are declared changes the combat damage
rules: [CR 509.2, CR 510.1a, CR 602.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Furnace Whelp]
  p2:
    battlefield: [Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Furnace Whelp]
  - all pass: until combat.declareBlockers
  - p2 block: { Giant Spider: Furnace Whelp }
  - p1 activate: Furnace Whelp
    pay: auto
  - p1 activate: Furnace Whelp
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1:Furnace Whelp.power: 4
      p1:Furnace Whelp.tapped: true
  - all pass: until combat.damage
  - expect:
      p2.graveyard: [Giant Spider]
      p1.graveyard: [Furnace Whelp]
