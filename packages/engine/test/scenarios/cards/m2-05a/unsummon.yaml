name: Unsummon returns a creature to its owner's hand
rules: [CR 400.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Unsummon]
    battlefield: [Island]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Unsummon
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.hand: [Grizzly Bears]
      p2.battlefield: []
