name: Divine Verdict destroys an attacking creature, which then deals no damage
rules: [CR 601.2c, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant]
  p2:
    hand: [Divine Verdict]
    battlefield: [Plains, Plains, Plains, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - p1 pass: once
  - p2 cast: Divine Verdict
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p1.graveyard: [Hill Giant]
      p2.life: 20
