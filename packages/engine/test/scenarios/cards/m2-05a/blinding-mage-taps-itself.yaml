name: Blinding Mage can target itself; by then it's tapped, so tapping it does nothing
rules: [CR 701.26a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Blinding Mage, Plains]
steps:
  - p1 activate: Blinding Mage
    targets: [p1:Blinding Mage]
    pay: auto
  - all pass: once
  - expect:
      p1:Blinding Mage.tapped: true
      events contains: [{ type: ABILITY_RESOLVED }]
      events lacks: [{ type: PERMANENT_TAPPED }]
