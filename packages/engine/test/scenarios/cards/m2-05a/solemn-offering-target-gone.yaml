name: When Solemn Offering's only target is gone, it doesn't resolve, and no life is gained
rules: [CR 608.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Solemn Offering]
    battlefield: [Plains, Plains, Plains]
  p2:
    hand: [Shatter]
    battlefield: [Rod of Ruin, Mountain, Mountain]
steps:
  - p1 cast: Solemn Offering
    targets: [p2:Rod of Ruin]
    pay: auto
  - p1 pass: once
  - p2 cast: Shatter
    targets: [p2:Rod of Ruin]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.life: 20
      p1.graveyard: [Solemn Offering]
      events contains: [{ type: SPELL_DID_NOT_RESOLVE }]
