name: "Cancel can only target a spell: an ability on the stack isn't one, and Cancel can't target itself"
rules: [CR 113.9, CR 115.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Royal Assassin]
  p2:
    hand: [Cancel]
    battlefield: [{ card: Grizzly Bears, tapped: true }, Island, Island, Island]
steps:
  - p1 activate: Royal Assassin
    targets: [p2:Grizzly Bears]
  - expect:
      stack: [Royal Assassin ability]
  - p1 pass: once
  - p2 cast: Cancel
  - expect error: illegalAction
