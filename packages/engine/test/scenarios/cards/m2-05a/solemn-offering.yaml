name: Solemn Offering destroys an artifact and its caster gains 4 life
rules: [CR 119.3, CR 701.8a, CR 115.10b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Solemn Offering]
    battlefield: [Plains, Plains, Plains]
  p2:
    battlefield: [Rod of Ruin]
steps:
  - p1 cast: Solemn Offering
    targets: [p2:Rod of Ruin]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Rod of Ruin]
      p1.life: 24
      events contains: [{ type: LIFE_GAINED, player: p1, amount: 4 }]
