name: Essence Scatter counters an artifact creature spell
rules: [CR 701.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ornithopter]
  p2:
    hand: [Essence Scatter]
    battlefield: [Island, Island]
steps:
  - p1 cast: Ornithopter
    pay: auto
  - p1 pass: once
  - p2 cast: Essence Scatter
    targets: [p1:Ornithopter]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Ornithopter]
