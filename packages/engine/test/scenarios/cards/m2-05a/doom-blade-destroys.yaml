name: Doom Blade destroys a nonblack creature
rules: [CR 701.8a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Doom Blade]
    battlefield: [Swamp, Swamp]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Doom Blade
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Grizzly Bears]
      events contains: [{ type: PERMANENT_DESTROYED }]
