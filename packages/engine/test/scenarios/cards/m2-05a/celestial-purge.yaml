name: Celestial Purge exiles a red permanent; a land is colorless and can't be targeted
rules: [CR 701.13a, CR 406.2, CR 105.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Celestial Purge, Celestial Purge]
    battlefield: [Plains, Plains, Plains, Plains]
  p2:
    battlefield: [Hill Giant, Swamp]
steps:
  - p1 cast: Celestial Purge
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      exile: [Hill Giant]
  - p1 cast: Celestial Purge
    targets: [p2:Swamp]
    pay: auto
  - expect error: illegalAction
