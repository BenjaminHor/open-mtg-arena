name: An attacking creature is still attacking in the end of combat step, so Divine Verdict can target it there
rules: [CR 508.1k, CR 511.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant]
  p2:
    hand: [Divine Verdict]
    battlefield: [Plains, Plains, Plains, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.end
  - p1 pass: once
  - p2 cast: Divine Verdict
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Hill Giant]
