name: Excommunicate puts a creature on top of its owner's library
rules: [CR 400.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Excommunicate]
    battlefield: [Plains, Plains, Plains]
  p2:
    battlefield: [Hill Giant]
    library: [Forest]
steps:
  - p1 cast: Excommunicate
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p2.library: [Hill Giant, Forest]
      p2.battlefield: []
