name: Royal Assassin's ability still destroys its target after the Assassin has left the battlefield
rules: [CR 113.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Royal Assassin]
  p2:
    hand: [Unsummon]
    battlefield: [{ card: Grizzly Bears, tapped: true }, Island]
steps:
  - p1 activate: Royal Assassin
    targets: [p2:Grizzly Bears]
  - p1 pass: once
  - p2 cast: Unsummon
    targets: [p1:Royal Assassin]
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Royal Assassin]
  - all pass: once
  - expect:
      p2.graveyard contains: [Grizzly Bears]
