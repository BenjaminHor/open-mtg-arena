name: Deathmark destroys a white creature, but can't target a blue one
rules: [CR 601.2c, CR 701.8a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Deathmark, Deathmark]
    battlefield: [Swamp, Swamp]
  p2:
    battlefield: [Elite Vanguard, Coral Merfolk]
steps:
  - p1 cast: Deathmark
    targets: [p2:Elite Vanguard]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Elite Vanguard]
  - p1 cast: Deathmark
    targets: [p2:Coral Merfolk]
    pay: auto
  - expect error: illegalAction
