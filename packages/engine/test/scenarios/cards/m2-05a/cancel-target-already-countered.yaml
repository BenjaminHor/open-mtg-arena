name: A Cancel whose target was countered first doesn't resolve
rules: [CR 608.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Grizzly Bears, Cancel]
    battlefield: [Forest, Forest, Island, Island, Island]
  p2:
    hand: [Cancel]
    battlefield: [Island, Island, Island]
steps:
  - p1 cast: Grizzly Bears
    pay: auto
  - p1 pass: once
  - p2 cast: Cancel
    targets: [p1:Grizzly Bears]
    pay: auto
  - p2 pass: once
  - p1 cast: Cancel
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Grizzly Bears, Cancel]
  - all pass: once
  - expect:
      p2.graveyard: [Cancel]
      events contains: [{ type: SPELL_DID_NOT_RESOLVE }]
