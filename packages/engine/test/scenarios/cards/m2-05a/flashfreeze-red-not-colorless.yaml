name: Flashfreeze counters a red spell, but can't target a colorless one
rules: [CR 601.2c, CR 105.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt, Ornithopter]
    battlefield: [Mountain]
  p2:
    hand: [Flashfreeze, Flashfreeze]
    battlefield: [Island, Island, Island, Island]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 pass: once
  - p2 cast: Flashfreeze
    targets: [p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - expect:
      p2.life: 20
      p1.graveyard: [Lightning Bolt]
      stack: []
  - p1 cast: Ornithopter
    pay: auto
  - p1 pass: once
  - p2 cast: Flashfreeze
    targets: [p1:Ornithopter]
    pay: auto
  - expect error: illegalAction
