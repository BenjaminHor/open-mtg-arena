name: Rod of Ruin's ability still deals its damage after the Rod is destroyed
rules: [CR 113.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Rod of Ruin, Mountain, Mountain, Mountain]
  p2:
    hand: [Shatter]
    battlefield: [Mountain, Mountain]
steps:
  - p1 activate: Rod of Ruin
    targets: [p2]
    pay: auto
  - p1 pass: once
  - p2 cast: Shatter
    targets: [p1:Rod of Ruin]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.graveyard: [Rod of Ruin]
      p2.life: 19
