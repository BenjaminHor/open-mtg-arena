name: Royal Assassin taps to destroy a tapped creature
rules: [CR 107.5, CR 601.2h, CR 701.8a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Royal Assassin]
  p2:
    battlefield: [{ card: Grizzly Bears, tapped: true }]
steps:
  - p1 activate: Royal Assassin
    targets: [p2:Grizzly Bears]
  - expect:
      p1:Royal Assassin.tapped: true
  - all pass: once
  - expect:
      p2.graveyard: [Grizzly Bears]
