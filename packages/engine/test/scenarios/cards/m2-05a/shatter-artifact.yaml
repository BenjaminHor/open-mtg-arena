name: Shatter destroys an artifact; a creature that isn't one isn't a legal target
rules: [CR 601.2c, CR 701.8a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Shatter, Shatter]
    battlefield: [Mountain, Mountain, Mountain, Mountain]
  p2:
    battlefield: [Ornithopter, Grizzly Bears]
steps:
  - p1 cast: Shatter
    targets: [p2:Ornithopter]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Ornithopter]
  - p1 cast: Shatter
    targets: [p2:Grizzly Bears]
    pay: auto
  - expect error: illegalAction
