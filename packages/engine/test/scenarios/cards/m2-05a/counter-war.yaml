name: A Cancel countered by another Cancel does nothing, and the spell it targeted resolves
rules: [CR 701.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Grizzly Bears, Cancel]
    battlefield: [Forest, Forest, Island, Island, Island]
  p2:
    hand: [Cancel]
    battlefield: [Island, Island, Island]
steps:
  - p1 cast: Grizzly Bears
    pay: auto
  - p1 pass: once
  - p2 cast: Cancel
    targets: [p1:Grizzly Bears]
    pay: auto
  - p2 pass: once
  - p1 cast: Cancel
    targets: [p2:Cancel]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p2.graveyard: [Cancel]
      p1.battlefield contains: [Grizzly Bears]
