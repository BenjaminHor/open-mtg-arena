name: A spell with another target still resolves for it after Illusionary Servant is sacrificed
rules: [CR 608.2b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Illusionary Servant, Grizzly Bears]
  p2:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Panic Attack]
steps:
  - p2 cast: Panic Attack
    targets: [[p1:Illusionary Servant, p1:Grizzly Bears]]
    pay: auto
  - expect:
      stack: [Panic Attack, Illusionary Servant ability]
  - all pass: once
  - expect:
      p1.graveyard: [Illusionary Servant]
  - all pass: once
  - expect:
      stack: []
      events contains: [{ type: SPELL_RESOLVED }]
      p2.graveyard: [Panic Attack]
