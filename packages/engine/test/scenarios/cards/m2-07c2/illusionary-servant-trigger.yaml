name: Illusionary Servant targeted by a triggered ability as it goes on the stack triggers as a new batch above it
rules: [CR 603.3d, CR 603.3b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Illusionary Servant]
  p2:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Sparkmage Apprentice]
steps:
  - p2 cast: Sparkmage Apprentice
    pay: auto
  - all pass: once
  - p2 choose: p1:Illusionary Servant
  - expect:
      stack: [Sparkmage Apprentice ability, Illusionary Servant ability]
  - all pass: once
  - expect:
      p1.graveyard: [Illusionary Servant]
