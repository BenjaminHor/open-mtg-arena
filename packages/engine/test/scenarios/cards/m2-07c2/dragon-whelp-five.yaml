name: Five activations in a turn make two delayed triggers; they go on the stack unasked, and the Whelp is sacrificed once
rules: [CR 603.7b, CR 603.3b, CR 701.21a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Dragon Whelp, Mountain, Mountain, Mountain, Mountain, Mountain]
steps:
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - all pass: until end
  - expect:
      stack: [Dragon Whelp ability, Dragon Whelp ability]
      pending: { player: p1, kind: priority }
  - all pass: once
  - all pass: once
  - expect:
      p1.graveyard: [Dragon Whelp]
      stack: []
