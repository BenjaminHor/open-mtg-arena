name: Four activations stacked before any resolves each count as activated, so each makes a delayed trigger (D-078)
rules: [CR 602.2b, CR 603.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Dragon Whelp, Mountain, Mountain, Mountain, Mountain]
steps:
  - p1 activate: Dragon Whelp
    pay: auto
  - p1 activate: Dragon Whelp
    pay: auto
  - p1 activate: Dragon Whelp
    pay: auto
  - p1 activate: Dragon Whelp
    pay: auto
  - expect:
      stack: [Dragon Whelp ability, Dragon Whelp ability, Dragon Whelp ability, Dragon Whelp ability]
  - all pass: once
  - all pass: once
  - all pass: once
  - all pass: once
  - all pass: until end
  - expect:
      stack: [Dragon Whelp ability, Dragon Whelp ability, Dragon Whelp ability, Dragon Whelp ability]
