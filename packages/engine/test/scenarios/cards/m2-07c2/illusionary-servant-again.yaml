name: Each spell targeting Illusionary Servant triggers it; bounced in response, it's still sacrificed by the second trigger first
rules: [CR 603.2, CR 608.2b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Illusionary Servant, Island]
    hand: [Unsummon]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1:Illusionary Servant]
    pay: auto
  - p2 pass: once
  - p1 cast: Unsummon
    targets: [p1:Illusionary Servant]
    pay: auto
  - expect:
      stack: [Lightning Bolt, Illusionary Servant ability, Unsummon, Illusionary Servant ability]
  - all pass: once
  - expect:
      p1.graveyard: [Illusionary Servant]
