name: Illusionary Servant as a spell isn't a permanent, so a spell targeting it doesn't trigger it
rules: [CR 113.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island]
    hand: [Illusionary Servant]
  p2:
    battlefield: [Island, Island]
    hand: [Essence Scatter]
steps:
  - p1 cast: Illusionary Servant
    pay: auto
  - p1 pass: once
  - p2 cast: Essence Scatter
    targets: [p1:Illusionary Servant]
    pay: auto
  - expect:
      stack: [Illusionary Servant, Essence Scatter]
  - all pass: once
  - expect:
      stack: []
      p1.graveyard: [Illusionary Servant]
