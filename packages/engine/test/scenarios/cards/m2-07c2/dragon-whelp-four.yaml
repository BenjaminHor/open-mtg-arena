name: The fourth resolving activation in a turn makes a delayed trigger that sacrifices Dragon Whelp at the beginning of the next end step
rules: [CR 603.7, CR 603.7e, CR 513.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Dragon Whelp, Mountain, Mountain, Mountain, Mountain]
steps:
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - expect:
      p1:Dragon Whelp.power: 6
  - all pass: until end
  - expect:
      stack: [Dragon Whelp ability]
  - all pass: once
  - expect:
      p1.graveyard: [Dragon Whelp]
