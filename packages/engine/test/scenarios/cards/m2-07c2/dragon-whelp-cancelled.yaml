name: An activation cancelled while paying is reversed and never counts; three more make three
rules: [CR 734.1, CR 602.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Dragon Whelp, Mountain, Mountain, Mountain]
steps:
  - p1 activate: Dragon Whelp
  - p1 choose: cancel
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - all pass: until end
  - expect:
      stack: []
