name: A cast targeting Illusionary Servant, then cancelled, is reversed whole; its trigger is dropped, and the Servant stays
rules: [CR 734.1, CR 601.2c]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Illusionary Servant]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1:Illusionary Servant]
  - p2 choose: cancel
  - expect:
      stack: []
      p2.hand: [Lightning Bolt]
      p1.battlefield contains: [Illusionary Servant]
      pending: { player: p2, kind: priority }
