name: Dragon Whelp's count starts again each turn; two Whelps are counted apart
rules: [CR 602.2b]
setup:
  turn: { active: p1, step: main2 }
  p1:
    battlefield: [Dragon Whelp, Dragon Whelp, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain]
steps:
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - p1 activate: p1:Dragon Whelp#2
    pay: auto
  - all pass: once
  - all pass: until end
  - expect:
      active: p1
      stack: []
  - all pass: until upkeep
  - p2 pass: once
  - p1 activate: Dragon Whelp
    pay: auto
  - all pass: once
  - all pass: until end
  - expect:
      active: p2
      stack: []
