name: An Aura on an Aura on a creature goes too when the creature dies, over successive checks
rules: [CR 704.5m, CR 704.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, { card: Oakenform, attachedTo: p1:Grizzly Bears }, { card: Indestructibility, attachedTo: p1:Oakenform }, Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - p1 cast: Doom Blade
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: [Swamp, Swamp]
      p1.graveyard: [Grizzly Bears, Doom Blade, Oakenform, Indestructibility]
