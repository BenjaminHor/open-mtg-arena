name: An Aura's bonus and Giant Growth's add up in layer 7c, and the Aura's stays when Giant Growth's ends
rules: [CR 613.4c, CR 514.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, { card: Unholy Strength, attachedTo: p1:Grizzly Bears }, Forest]
    hand: [Giant Growth]
steps:
  - p1 cast: Giant Growth
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.power: 7
      p1:Grizzly Bears.toughness: 6
  - all pass: until main1
  - expect:
      p1:Grizzly Bears.power: 4
      p1:Grizzly Bears.toughness: 3
