name: A pacified creature that "attacks each combat if able" isn't able, so needn't attack
rules: [CR 508.1d, CR 508.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Berserkers of Blood Ridge, { card: Pacifism, attachedTo: p1:Berserkers of Blood Ridge }, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p2.life: 18
