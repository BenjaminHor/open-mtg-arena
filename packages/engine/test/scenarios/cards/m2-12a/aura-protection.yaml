name: White Knight's protection from black means a black Aura can't target it, or stay attached to it
rules: [CR 702.16b, CR 702.16c, CR 704.5m]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [White Knight, Swamp]
    hand: [Unholy Strength]
  p2:
    battlefield: [Grizzly Bears, { card: Unholy Strength, attachedTo: p1:White Knight }]
steps:
  - expect:
      p2.graveyard: [Unholy Strength]
      p1:White Knight.power: 2
  - p1 cast: Unholy Strength
    targets: [p1:White Knight]
    pay: auto
  - expect error: illegalAction
