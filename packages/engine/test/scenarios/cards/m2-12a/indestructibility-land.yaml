name: Indestructibility can enchant any permanent, a land too, which then can't be destroyed
rules: [CR 702.5a, CR 702.12b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains, { card: Indestructibility, attachedTo: p1:Plains }]
  p2:
    battlefield: [Forest, Forest, Forest, Forest, Forest]
    hand: [Acidic Slime]
steps:
  - p2 cast: Acidic Slime
    pay: auto
  - all pass: once
  - p2 choose: p1:Plains
  - all pass: once
  - expect:
      p1.battlefield: [Plains, Indestructibility]
      p1:Plains.abilities contains: [indestructible]
