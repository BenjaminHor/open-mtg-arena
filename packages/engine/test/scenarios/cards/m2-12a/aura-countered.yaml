name: A countered Aura spell goes to the graveyard, countered rather than not resolving
rules: [CR 701.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Plains]
    hand: [Holy Strength]
  p2:
    battlefield: [Island, Island]
    hand: [Negate]
steps:
  - p1 cast: Holy Strength
    targets: [p1:Grizzly Bears]
    pay: auto
  - p1 pass: once
  - p2 cast: Negate
    targets: [p1:Holy Strength]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Holy Strength]
      events contains: [{ type: SPELL_COUNTERED }]
      events lacks: [{ type: SPELL_DID_NOT_RESOLVE }]
      p1:Grizzly Bears.power: 2
