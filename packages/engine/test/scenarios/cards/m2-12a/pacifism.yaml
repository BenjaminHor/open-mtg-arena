name: The creature Pacifism enchants can't attack, and can't block
rules: [CR 508.1c, CR 509.1b, CR 303.4m]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    battlefield: [Hill Giant, { card: Pacifism, attachedTo: p2:Hill Giant }, Raging Goblin, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Hill Giant]
  - expect error: illegalAction
  - p2 attack: [Raging Goblin]
  - all pass: until main2
  - expect:
      p1.life: 19
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Grizzly Bears }
  - expect error: illegalAction
