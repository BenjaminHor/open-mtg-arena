name: A pacified creature needn't block Prized Unicorn; one that can, must
rules: [CR 509.1c, CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Prized Unicorn]
  p2:
    battlefield: [Grizzly Bears, { card: Pacifism, attachedTo: p2:Grizzly Bears }, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Prized Unicorn]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Prized Unicorn }
  - all pass: until main2
  - expect:
      p2.life: 20
