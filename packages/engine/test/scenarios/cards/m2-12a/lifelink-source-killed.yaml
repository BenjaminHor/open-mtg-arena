name: A Prodigal Pyromancer with Lifelink, killed in response, still has lifelink as its ability resolves (last known information)
rules: [CR 702.15c, CR 113.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Prodigal Pyromancer, { card: Lifelink, attachedTo: p1:Prodigal Pyromancer }]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Prodigal Pyromancer]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Prodigal Pyromancer, Lifelink]
  - all pass: once
  - expect:
      p2.life: 19
      p1.life: 21
