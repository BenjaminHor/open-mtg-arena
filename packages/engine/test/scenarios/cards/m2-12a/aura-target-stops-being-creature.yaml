name: Aura targeting an animated Forest that stops being a creature before it resolves doesn't resolve
rules: [CR 608.3b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest, Forest, Forest, Forest, Plains]
    hand: [Awakener Druid, Holy Strength]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest#5
  - all pass: once
  - p1 cast: Holy Strength
    targets: [p1:Forest#5]
    pay: auto
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Awakener Druid]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.graveyard: [Awakener Druid, Holy Strength]
      events contains: [{ type: SPELL_DID_NOT_RESOLVE }]
