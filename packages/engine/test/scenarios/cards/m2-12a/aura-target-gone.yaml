name: An Aura spell whose target is gone doesn't resolve and goes to its owner's graveyard
rules: [CR 608.3b, CR 608.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Swamp]
    hand: [Unholy Strength]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 cast: Unholy Strength
    targets: [p1:Grizzly Bears]
    pay: auto
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.battlefield: [Swamp]
      p1.graveyard: [Grizzly Bears, Unholy Strength]
      events contains: [{ type: SPELL_DID_NOT_RESOLVE }]
