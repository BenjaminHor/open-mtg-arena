name: Siege-Gang Commander with Lifelink sacrifices itself; its damage still has lifelink, as it last existed
rules: [CR 702.15c, CR 113.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Siege-Gang Commander, { card: Lifelink, attachedTo: p1:Siege-Gang Commander }, Mountain, Mountain]
steps:
  - p1 activate: Siege-Gang Commander
    sacrifice: p1:Siege-Gang Commander
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.life: 18
      p1.life: 22
