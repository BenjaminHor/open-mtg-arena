name: When the enchanted creature dies, its Aura is attached to nothing and goes to its owner's graveyard
rules: [CR 704.5m, CR 303.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, { card: Oakenform, attachedTo: p1:Grizzly Bears }, Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - expect:
      p1:Grizzly Bears.power: 5
  - p1 cast: Doom Blade
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: [Swamp, Swamp]
      # Doom Blade finishes resolving first; the Aura goes when state-based actions are next checked.
      p1.graveyard: [Grizzly Bears, Doom Blade, Oakenform]
      events contains: [{ type: STATE_BASED_ACTIONS }]
