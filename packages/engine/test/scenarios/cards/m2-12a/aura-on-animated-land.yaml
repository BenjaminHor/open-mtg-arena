name: An Aura enchanting a Forest made a creature goes to the graveyard when the Forest stops being a creature
rules: [CR 704.5m, CR 303.4c, CR 611.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest, Forest, Forest, Forest, Plains, Mountain]
    hand: [Awakener Druid, Holy Strength, Shock]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest#5
  - all pass: once
  - p1 cast: Holy Strength
    targets: [p1:Forest#5]
    pay: auto
  - all pass: once
  - expect:
      p1:Forest#5.power: 5
  - p1 cast: Shock
    targets: [p1:Awakener Druid]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Shock, Awakener Druid, Holy Strength]
      p1.battlefield contains: [Forest, Forest, Forest, Forest, Forest]
