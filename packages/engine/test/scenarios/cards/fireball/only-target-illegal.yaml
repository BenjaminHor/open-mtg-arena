name: Fireball whose only target became illegal doesn't resolve, unlike one cast with no targets
rules: [CR 608.2b, CR 115.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Fireball]
    battlefield: [Mountain, Mountain, Mountain]
  p2:
    hand: [Shock]
    battlefield: [Grizzly Bears, Mountain]
steps:
  - p1 cast: Fireball
    x: 2
    targets: [[p2:Grizzly Bears]]
    pay: auto
  - p1 pass: once
  - p2 cast: Shock
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.graveyard: [Fireball]
      events contains: [{ type: SPELL_DID_NOT_RESOLVE }]
