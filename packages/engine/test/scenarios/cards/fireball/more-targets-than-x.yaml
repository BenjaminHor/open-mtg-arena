name: With more legal targets than X as it resolves, Fireball's even share is 0, and it deals no damage
rules: [CR 120.8]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Fireball]
    battlefield: [Mountain, Mountain, Mountain]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Fireball
    x: 1
    targets: [[p2:Grizzly Bears, p2]]
    pay: auto
  - all pass: once
  - expect:
      p2.life: 20
      p2:Grizzly Bears.damage: 0
      events contains: [{ type: SPELL_RESOLVED }]
