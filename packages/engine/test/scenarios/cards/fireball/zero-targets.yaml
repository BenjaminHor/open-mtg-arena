name: Fireball can be cast with zero targets; it isn't targeted, resolves, and deals no damage
rules: [CR 115.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Fireball]
    battlefield: [Mountain, Mountain, Mountain]
steps:
  - p1 cast: Fireball
    x: 2
  - p1 choose: 0
  # Zero targets costs no extra: the increase is for each target beyond the first.
  - expect:
      pending: { player: p1, kind: payMana, cost: [{ kind: generic, amount: 2 }, { kind: colored, color: R }] }
  - p1 choose: cancel
  - p1 cast: Fireball
    x: 2
    targets: [[]]
    pay: auto
  - all pass: once
  - expect:
      p2.life: 20
      p1.graveyard: [Fireball]
      events contains: [{ type: SPELL_RESOLVED }]
