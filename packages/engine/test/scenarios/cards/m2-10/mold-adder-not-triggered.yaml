name: Mold Adder doesn't trigger for its controller's own blue spell, nor for an opponent's spell of another color
rules: [CR 603.2, CR 109.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mold Adder, Island]
    hand: [Unsummon]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  # Its controller's own blue spell doesn't count.
  - p1 cast: Unsummon
    targets: [p1:Mold Adder]
    pay: auto
  - expect:
      stack: [Unsummon]
  - p1 pass: once
  # A red spell doesn't either.
  - p2 cast: Shock
    targets: [p1]
    pay: auto
  - expect:
      stack: [Unsummon, Shock]
