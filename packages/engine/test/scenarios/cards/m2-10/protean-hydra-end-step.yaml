name: Counters removed from Protean Hydra during an end step come back at the next turn's end step (its ruling)
rules: [CR 603.7, CR 513.1]
setup:
  turn: { active: p1, step: end }
  p1:
    battlefield: [{ card: Protean Hydra, counters: { +1/+1: 3 } }]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Protean Hydra]
    pay: auto
  - all pass: once
  - all pass: once
  - all pass: once
  - expect:
      stack: []
      p1:Protean Hydra.counters: { +1/+1: 1 }
  - all pass: until main1
  - expect:
      active: p2
      p1:Protean Hydra.counters: { +1/+1: 1 }
  - all pass: until end
  - expect:
      stack: [Protean Hydra ability, Protean Hydra ability]
  - all pass: once
  - all pass: once
  - expect:
      p1:Protean Hydra.counters: { +1/+1: 5 }
