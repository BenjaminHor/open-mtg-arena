name: Mold Adder gets a +1/+1 counter when an opponent casts a black spell, its ability resolving before the spell
rules: [CR 603.2, CR 122.6]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Mold Adder]
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - p2 cast: Doom Blade
    targets: [p1:Mold Adder]
    pay: auto
  - all pass: once
  - p1 choose: yes
  - expect:
      p1:Mold Adder.counters: { +1/+1: 1 }
      stack: [Doom Blade]
