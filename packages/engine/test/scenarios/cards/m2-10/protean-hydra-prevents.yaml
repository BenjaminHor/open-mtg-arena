name: Damage to Protean Hydra is prevented and that many +1/+1 counters are removed; at the next end step it gets two back for each
rules: [CR 615.5, CR 615.6, CR 603.2c, CR 603.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Protean Hydra, counters: { +1/+1: 3 } }]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Protean Hydra]
    pay: auto
  - all pass: once
  - expect:
      p1:Protean Hydra.damage: 0
      p1:Protean Hydra.counters: { +1/+1: 1 }
      events contains: [{ type: DAMAGE_PREVENTED, amount: 2 }, { type: COUNTERS_REMOVED, amount: 2 }]
  # Two counters removed: two triggers, each making a delayed ability.
  - expect:
      stack: [Protean Hydra ability, Protean Hydra ability]
  - all pass: once
  - all pass: once
  - all pass: until end
  - all pass: once
  - all pass: once
  - expect:
      p1:Protean Hydra.counters: { +1/+1: 5 }
