name: All damage to Protean Hydra is prevented even with fewer counters than the damage, and all of them are removed (its ruling)
rules: [CR 615.5, CR 101.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Protean Hydra, counters: { +1/+1: 1 } }, Forest]
    hand: [Giant Growth]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  # Giant Growth keeps it alive once its counter is gone (toughness 0 + 3).
  - p1 cast: Giant Growth
    targets: [p1:Protean Hydra]
    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Protean Hydra]
    pay: auto
  - all pass: once
  - expect:
      p1:Protean Hydra.damage: 0
      p1:Protean Hydra.counters: {}
      p1:Protean Hydra.toughness: 3
      events contains: [{ type: COUNTERS_REMOVED, amount: 1 }]
