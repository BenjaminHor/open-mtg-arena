name: A counter put on Mold Adder adds to the counters already on it
rules: [CR 122.1, CR 122.6]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Mold Adder, counters: { +1/+1: 2 } }]
  p2:
    battlefield: [Island]
    hand: [Unsummon]
steps:
  - p2 cast: Unsummon
    targets: [p1:Mold Adder]
    pay: auto
  - all pass: once
  - p1 choose: yes
  - expect:
      p1:Mold Adder.counters: { +1/+1: 3 }
      p1:Mold Adder.power: 4
