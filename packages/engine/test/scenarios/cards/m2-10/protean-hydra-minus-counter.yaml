name: A -1/-1 counter annihilating one of Protean Hydra's +1/+1 counters triggers it (its ruling)
rules: [CR 704.5q]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Protean Hydra, counters: { +1/+1: 3, -1/-1: 1 } }]
steps:
  - expect:
      p1:Protean Hydra.counters: { +1/+1: 2 }
      stack: [Protean Hydra ability]
  - all pass: once
  - all pass: until end
  - all pass: once
  - expect:
      p1:Protean Hydra.counters: { +1/+1: 4 }
