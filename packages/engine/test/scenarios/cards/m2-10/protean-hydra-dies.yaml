name: Protean Hydra dealt damage at least equal to its counters loses them all and dies; its delayed abilities later do nothing
rules: [CR 704.5f, CR 615.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Protean Hydra, counters: { +1/+1: 3 } }]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p1:Protean Hydra]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Protean Hydra]
      stack: [Protean Hydra ability, Protean Hydra ability, Protean Hydra ability]
  - all pass: once
  - all pass: once
  - all pass: once
  - all pass: until end
  - expect:
      stack: [Protean Hydra ability, Protean Hydra ability, Protean Hydra ability]
  - all pass: once
  - all pass: once
  - all pass: once
  - expect:
      p1.graveyard: [Protean Hydra]
      stack: []
