name: With Protean Hydra's own prevention chosen before Fog, it removes that many counters
rules: [CR 616.1]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Protean Hydra, counters: { +1/+1: 3 } }, Forest]
    hand: [Fog]
  p2:
    battlefield: [Craw Wurm]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p1 block: { Protean Hydra: Craw Wurm }
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: Protean Hydra
  - expect:
      p1.graveyard: [Fog, Protean Hydra]
      events contains: [{ type: COUNTERS_REMOVED }]
      stack: [Protean Hydra ability, Protean Hydra ability, Protean Hydra ability]
