name: With Fog chosen first for damage to Protean Hydra, nothing is left for the Hydra's own prevention, so no counters are removed
rules: [CR 616.1]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Protean Hydra, counters: { +1/+1: 3 } }, Forest]
    hand: [Fog]
  p2:
    battlefield: [Craw Wurm]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p1 block: { Protean Hydra: Craw Wurm }
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: Fog
  - expect:
      p1:Protean Hydra.counters: { +1/+1: 3 }
      events lacks: [{ type: COUNTERS_REMOVED }]
      stack: []
