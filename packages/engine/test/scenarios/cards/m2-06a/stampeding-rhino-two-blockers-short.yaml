name: When a trampler's first blocker gets less than lethal, everything left goes to the last blocker, none to the player
rules: [CR 702.19b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino]
  p2:
    battlefield: [Elite Vanguard, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Elite Vanguard: Stampeding Rhino, Runeclaw Bear: Stampeding Rhino }
  - all pass: until combat.damage
  - p1 assign: { Elite Vanguard: 0, Runeclaw Bear: 4, p2: 0 }
  - expect:
      p2.life: 20
      p2.battlefield: [Elite Vanguard]
