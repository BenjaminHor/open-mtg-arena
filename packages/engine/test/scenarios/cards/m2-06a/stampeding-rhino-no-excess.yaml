name: A trampler with no more damage than its blocker needs isn't asked; all of it goes to the blocker
rules: [CR 702.19b, CR 510.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino]
  p2:
    battlefield: [Siege Mastodon]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: Stampeding Rhino }
  - all pass: until combat.damage
  - expect:
      pending: { player: p1, kind: priority }
      p2:Siege Mastodon.damage: 4
      p2.life: 20
