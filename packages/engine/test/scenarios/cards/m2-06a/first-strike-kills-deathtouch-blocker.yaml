name: A first striker kills a deathtouch blocker before the blocker can deal its damage
rules: [CR 510.4, CR 702.7b, CR 702.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Viashino Spearhunter]
  p2:
    battlefield: [Deadly Recluse]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Viashino Spearhunter]
  - all pass: until combat.declareBlockers
  - p2 block: { Deadly Recluse: Viashino Spearhunter }
  - all pass: until main2
  - expect:
      p1.battlefield: [Viashino Spearhunter]
      p1:Viashino Spearhunter.damage: 0
      p2.graveyard: [Deadly Recluse]
