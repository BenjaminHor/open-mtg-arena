name: A trampler with no more damage than its blockers need together divides among them like any creature; the player isn't offered
rules: [CR 702.19b, CR 510.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino]
  p2:
    battlefield: [Runeclaw Bear, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear#1: Stampeding Rhino, Runeclaw Bear#2: Stampeding Rhino }
  - all pass: until combat.damage
  - expect:
      pending: { kind: assignDamage, lethal: null, amount: 4 }
  - p1 assign: { Runeclaw Bear#1: 2, Runeclaw Bear#2: 2 }
  - expect:
      p2.life: 20
      p2.graveyard: [Runeclaw Bear, Runeclaw Bear]
