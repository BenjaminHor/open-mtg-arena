name: Lifelink works on a blocker too, for its controller, the defending player
rules: [CR 702.15b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Runeclaw Bear]
  p2:
    life: 10
    battlefield: [Child of Night]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Runeclaw Bear]
  - all pass: until combat.declareBlockers
  - p2 block: { Child of Night: Runeclaw Bear }
  - all pass: until combat.damage
  - expect:
      p2.life: 12
      p1.life: 20
      events contains: [{ type: LIFE_GAINED, player: p2, amount: 2 }]
