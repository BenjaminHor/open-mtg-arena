name: Two first strikers, attacker and blocker, deal their damage at the same time in the first step; nothing is left for the second
rules: [CR 510.4, CR 510.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Viashino Spearhunter]
  p2:
    battlefield: [Viashino Spearhunter]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Viashino Spearhunter]
  - all pass: until combat.declareBlockers
  - p2 block: { Viashino Spearhunter: Viashino Spearhunter }
  - all pass: until combat.damage
  - expect:
      p1.graveyard: [Viashino Spearhunter]
      p2.graveyard: [Viashino Spearhunter]
  - all pass: once
  - expect:
      step: combat.damage
      events lacks: [{ type: DAMAGE_DEALT }]
