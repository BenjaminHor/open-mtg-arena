name: A first striker that doesn't kill its blocker takes the blocker's damage in the second step
rules: [CR 510.4, CR 702.7b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Viashino Spearhunter]
  p2:
    battlefield: [Siege Mastodon]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Viashino Spearhunter]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: Viashino Spearhunter }
  - all pass: until combat.damage
  - expect:
      p2:Siege Mastodon.damage: 2
      p1:Viashino Spearhunter.damage: 0
  - all pass: once
  - expect:
      p1.graveyard: [Viashino Spearhunter]
      p2:Siege Mastodon.damage: 2
