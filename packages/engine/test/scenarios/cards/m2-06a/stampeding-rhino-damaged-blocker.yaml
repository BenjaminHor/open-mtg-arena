name: Damage already marked on the blocker counts toward lethal damage, so more can trample over
rules: [CR 702.19b, CR 120.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino]
  p2:
    battlefield: [{ card: Siege Mastodon, damage: 3 }]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: Stampeding Rhino }
  - all pass: until combat.damage
  - expect:
      pending: { kind: assignDamage, lethal: [2] }
  - p1 assign: { Siege Mastodon: 2, p2: 2 }
  - expect:
      p2.life: 18
      p2.graveyard: [Siege Mastodon]
