name: Creatures with vigilance don't tap when they attack; others do
rules: [CR 702.20b, CR 508.1f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Serra Angel, Griffin Sentinel, Siege Mastodon]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Serra Angel, Griffin Sentinel, Siege Mastodon]
  - expect:
      p1:Serra Angel.tapped: false
      p1:Griffin Sentinel.tapped: false
      p1:Siege Mastodon.tapped: true
  - all pass: until main2
  - expect:
      p2.life: 12
