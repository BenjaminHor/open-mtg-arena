name: A trampler blocked by two creatures needs lethal damage on both before the player gets any
rules: [CR 702.19b, CR 510.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino]
  p2:
    battlefield: [Elite Vanguard, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Elite Vanguard: Stampeding Rhino, Runeclaw Bear: Stampeding Rhino }
  - all pass: until combat.damage
  - expect:
      pending: { kind: assignDamage, lethal: [1, 2] }
  # The Vanguard has lethal damage, the Bear only 1 of its 2: the player can't get any.
  - p1 assign: { Elite Vanguard: 1, Runeclaw Bear: 1, p2: 2 }
  - expect error: illegalAction
  - p1 assign: { Elite Vanguard: 1, Runeclaw Bear: 2, p2: 1 }
  - expect:
      p2.life: 19
      p2.graveyard: [Elite Vanguard, Runeclaw Bear]
