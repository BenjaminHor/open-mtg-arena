name: With one first striker in combat, every other attacker and blocker deals its damage in the second step, unblocked ones too
rules: [CR 510.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Viashino Spearhunter, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Viashino Spearhunter, Runeclaw Bear]
  - all pass: until combat.damage
  - expect:
      p2.life: 18
  - all pass: once
  - expect:
      p2.life: 16
