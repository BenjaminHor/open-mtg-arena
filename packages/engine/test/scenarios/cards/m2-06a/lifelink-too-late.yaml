name: A first striker's damage ends the game before a lifelink blocker deals its damage in the second step
rules: [CR 510.4, CR 704.5a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Razorfoot Griffin, Runeclaw Bear]
  p2:
    life: 2
    battlefield: [Child of Night]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Razorfoot Griffin, Runeclaw Bear]
  - all pass: until combat.declareBlockers
  - p2 block: { Child of Night: Runeclaw Bear }
  - all pass: once
  - expect:
      winner: p1
      p2.life: 0
