name: A first striker that isn't attacking or blocking doesn't make a first strike step
rules: [CR 510.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Viashino Spearhunter, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Runeclaw Bear]
  - all pass: until combat.damage
  - expect:
      p2.life: 18
  - all pass: once
  - expect:
      step: combat.end
