name: Lifelink's life comes with the damage, before state-based actions, so it saves a player the same combat would kill
rules: [CR 120.4c, CR 702.15b, CR 704.5a, CR 510.2]
setup:
  turn: { active: p2, step: main1 }
  p1:
    life: 2
    battlefield: [Child of Night]
  p2:
    battlefield: [Runeclaw Bear, Siege Mastodon]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Runeclaw Bear, Siege Mastodon]
  - all pass: until combat.declareBlockers
  - p1 block: { Child of Night: Siege Mastodon }
  - all pass: until main2
  # 2 - 2 from the Bear + 2 from Child of Night's damage, all in one event: never at 0 when state-based actions look.
  - expect:
      winner: (game not over)
      p1.life: 2
      p1.graveyard: [Child of Night]
