name: Deathtouch needs damage actually dealt; a deathtouch creature with 0 power deals none and destroys nothing
rules: [CR 702.2b, CR 510.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Deadly Recluse, Island, Island, Island, Island]
    hand: [Disorient]
  p2:
    battlefield: [Siege Mastodon]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Deadly Recluse]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: Deadly Recluse }
  - p1 cast: Disorient
    targets: [p1:Deadly Recluse]
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p1.graveyard: [Disorient, Deadly Recluse]
      p2:Siege Mastodon.damage: 0
      p2.battlefield: [Siege Mastodon]
