name: Combat damage from a creature with lifelink makes its controller gain that much life
rules: [CR 702.15b, CR 120.3f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 10
    battlefield: [Child of Night]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Child of Night]
  - all pass: until main2
  - expect:
      p1.life: 12
      p2.life: 18
