name: A trampler may assign more than lethal damage to its blocker, even all of it
rules: [CR 702.19b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino]
  p2:
    battlefield: [Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Stampeding Rhino }
  - all pass: until combat.damage
  - p1 assign: { Runeclaw Bear: 4, p2: 0 }
  - expect:
      p2.life: 20
      p2.graveyard: [Runeclaw Bear]
