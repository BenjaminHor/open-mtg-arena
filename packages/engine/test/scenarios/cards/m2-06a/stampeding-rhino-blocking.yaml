name: Trample does nothing for a blocker; a blocking trampler isn't asked how to divide and deals no damage to a player
rules: [CR 702.19a, CR 510.1d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Runeclaw Bear]
  p2:
    battlefield: [Stampeding Rhino]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Runeclaw Bear]
  - all pass: until combat.declareBlockers
  - p2 block: { Stampeding Rhino: Runeclaw Bear }
  - all pass: until combat.damage
  - expect:
      pending: { kind: priority }
      p1.life: 20
      p1.graveyard: [Runeclaw Bear]
