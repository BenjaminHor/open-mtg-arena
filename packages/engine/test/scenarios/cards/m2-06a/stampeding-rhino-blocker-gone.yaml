name: A blocked trampler whose blocker is gone assigns all its damage to the player, without a decision
rules: [CR 702.19d, CR 509.1h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino, Mountain]
    hand: [Lightning Bolt]
  p2:
    battlefield: [Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Stampeding Rhino }
  - p1 cast: Lightning Bolt
    targets: [p2:Runeclaw Bear]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Runeclaw Bear]
  - all pass: until combat.damage
  - expect:
      pending: { kind: priority }
      p2.life: 16
