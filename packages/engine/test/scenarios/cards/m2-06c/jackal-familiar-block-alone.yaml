name: A creature that can't block alone can block when another creature blocks, even a different attacker
rules: [CR 506.5, CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Runeclaw Bear, Elite Vanguard]
  p2:
    battlefield: [Jackal Familiar, Siege Mastodon]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Runeclaw Bear, Elite Vanguard]
  - all pass: until combat.declareBlockers
  - p2 block: { Jackal Familiar: Elite Vanguard }
  - expect error: illegalAction
  - p2 block: { Jackal Familiar: Elite Vanguard, Siege Mastodon: Runeclaw Bear }
  - all pass: until main2
  - expect:
      p1.graveyard: [Runeclaw Bear, Elite Vanguard]
      p2.graveyard: [Jackal Familiar]
