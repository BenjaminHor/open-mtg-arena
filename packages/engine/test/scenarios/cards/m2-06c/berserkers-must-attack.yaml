name: A creature that attacks each combat if able must be declared as an attacker; others may stay home
rules: [CR 508.1d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Berserkers of Blood Ridge, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: []
  - expect error: illegalAction
  - p1 attack: [Berserkers of Blood Ridge]
  - all pass: until main2
  - expect:
      p2.life: 16
