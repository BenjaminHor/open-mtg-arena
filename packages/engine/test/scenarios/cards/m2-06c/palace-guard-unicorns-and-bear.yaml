name: Palace Guard must block both Prized Unicorns; it may also block a third attacker, but not instead of one
rules: [CR 509.1c, CR 101.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Prized Unicorn, Prized Unicorn, Runeclaw Bear]
  p2:
    battlefield: [Palace Guard]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Prized Unicorn#1, Prized Unicorn#2, Runeclaw Bear]
  - all pass: until combat.declareBlockers
  - p2 block: { Palace Guard: [Prized Unicorn#1, Runeclaw Bear] }
  - expect error: illegalAction
  - p2 block: { Palace Guard: [Prized Unicorn#1, Prized Unicorn#2, Runeclaw Bear] }
  - all pass: until combat.damage
  - p2 assign: { Prized Unicorn#1: 1, Prized Unicorn#2: 0, Runeclaw Bear: 0 }
  - expect:
      p2.graveyard: [Palace Guard]
