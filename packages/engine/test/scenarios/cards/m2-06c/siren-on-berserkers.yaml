name: A creature with two requirements to attack (its own and Alluring Siren's) obeys both by attacking
rules: [CR 508.1d]
setup:
  turn: { active: p2, step: upkeep }
  p1:
    battlefield: [Alluring Siren]
  p2:
    battlefield: [Berserkers of Blood Ridge, Runeclaw Bear]
steps:
  - p2 pass: once
  - p1 activate: p1:Alluring Siren
    targets: [p2:Berserkers of Blood Ridge]
  - all pass: once
  - all pass: until combat.declareAttackers
  - p2 attack: []
  - expect error: illegalAction
  - p2 attack: [Berserkers of Blood Ridge]
  - all pass: until main2
  - expect:
      p1.life: 16
