name: Alluring Siren's target that isn't able to attack (summoning sick) doesn't have to, and nothing else must attack in its place
rules: [CR 508.1d, CR 302.6]
setup:
  turn: { active: p2, step: upkeep }
  p1:
    battlefield: [Alluring Siren]
  p2:
    battlefield: [{ card: Siege Mastodon, sick: true }, Runeclaw Bear]
steps:
  - p2 pass: once
  - p1 activate: p1:Alluring Siren
    targets: [p2:Siege Mastodon]
  - all pass: once
  - all pass: until combat.declareAttackers
  - p2 attack: []
  - expect:
      pending: { player: p2, kind: priority }
