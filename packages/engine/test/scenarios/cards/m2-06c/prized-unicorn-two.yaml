name: With two Prized Unicorns attacking, each able creature must block one of them, not necessarily the same one
rules: [CR 509.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Prized Unicorn, Prized Unicorn, Runeclaw Bear]
  p2:
    battlefield: [Siege Mastodon, Elite Vanguard]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Prized Unicorn#1, Prized Unicorn#2, Runeclaw Bear]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: Runeclaw Bear, Elite Vanguard: Prized Unicorn#1 }
  - expect error: illegalAction
  # Both blockers on Unicorns: legal.
  - p2 block: { Siege Mastodon: Prized Unicorn#2, Elite Vanguard: Prized Unicorn#1 }
  - all pass: until main2
  - expect:
      p2.life: 18
