name: A lone Jackal Familiar declared as an attacker can be taken back, since that declaration can't be finished
rules: [CR 506.5, CR 508.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Jackal Familiar, { card: Runeclaw Bear, tapped: true }]
steps:
  - all pass: until combat.declareAttackers
  - p1 choose: Jackal Familiar
  - expect:
      pending: { player: p1, kind: declareAttackers }
  - p1 choose: done
  - expect error: illegalAction
  - p1 choose: take back
  - p1 choose: done
  - expect:
      pending: { player: p1, kind: priority }
      p1:Jackal Familiar.tapped: false
