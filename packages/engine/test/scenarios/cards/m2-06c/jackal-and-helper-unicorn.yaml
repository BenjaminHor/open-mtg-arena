name: With Prized Unicorn attacking, Jackal Familiar and another able creature must both block it; the helper can't block something else instead
rules: [CR 509.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Prized Unicorn, Elite Vanguard]
  p2:
    battlefield: [Jackal Familiar, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Prized Unicorn, Elite Vanguard]
  - all pass: until combat.declareBlockers
  - p2 block: { Jackal Familiar: Prized Unicorn, Runeclaw Bear: Elite Vanguard }
  - expect error: illegalAction
  - p2 block: { Jackal Familiar: Prized Unicorn, Runeclaw Bear: Prized Unicorn }
  - all pass: until combat.damage
  - p1 assign: { Jackal Familiar: 2, Runeclaw Bear: 0 }
  - expect:
      p2.life: 18
      p2.graveyard: [Jackal Familiar]
