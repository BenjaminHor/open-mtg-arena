name: With two Prized Unicorns attacking, both blockers may block the same one
rules: [CR 509.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Prized Unicorn, Prized Unicorn]
  p2:
    battlefield: [Siege Mastodon, Elite Vanguard]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Prized Unicorn#1, Prized Unicorn#2]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: Prized Unicorn#1, Elite Vanguard: Prized Unicorn#1 }
  - all pass: until combat.damage
  - p1 assign: { Siege Mastodon: 0, Elite Vanguard: 2 }
  - expect:
      p2.life: 18
