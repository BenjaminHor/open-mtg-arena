name: A creature that must attack but can't attack alone makes its controller attack with another creature too, to obey the requirement
rules: [CR 508.1c, CR 508.1d]
setup:
  turn: { active: p2, step: upkeep }
  p1:
    battlefield: [Alluring Siren]
  p2:
    battlefield: [Jackal Familiar, Runeclaw Bear]
steps:
  - p2 pass: once
  - p1 activate: p1:Alluring Siren
    targets: [p2:Jackal Familiar]
  - all pass: once
  - all pass: until combat.declareAttackers
  # Attacking with nothing disobeys the requirement, which could be obeyed with the Bear's help.
  - p2 attack: []
  - expect error: illegalAction
  - p2 attack: [Jackal Familiar]
  - expect error: illegalAction
  - p2 attack: [Jackal Familiar, Runeclaw Bear]
  - all pass: until main2
  - expect:
      p1.life: 16
