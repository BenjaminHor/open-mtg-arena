name: Clone copying Protean Hydra prevents damage, removes counters, and gets two back at the end step (copied text)
rules: [CR 707.2, CR 615.1a, CR 603.7]
setup:
  turn: { active: p1, step: main1 }
  rules: [{ kind: creaturesGetPT, controller: p1, power: 1, toughness: 1 }]
  p1:
    battlefield: [Island, Island, Island, Island, Mountain, { card: Ajani Goldmane, counters: { loyalty: 4 } }]
    hand: [Clone, Shock]
  p2:
    battlefield: [{ card: Protean Hydra, counters: { +1/+1: 3 } }]
steps:
  - p1 cast: Clone
    pay: auto
  - all pass: once
  - p1 choose: p2:Protean Hydra
  - expect:
      p1:Protean Hydra.power: 1
  - p1 activate: Ajani Goldmane
    ability: 2
  - all pass: once
  - expect:
      p1:Protean Hydra.counters: { +1/+1: 1 }
  - p1 cast: Shock
    targets: [p1:Protean Hydra]
    pay: auto
  - all pass: once
  - expect:
      p1:Protean Hydra.damage: 0
      p1:Protean Hydra.counters: {}
  - all pass: until end
  - expect:
      stack: [Protean Hydra ability]
  - all pass: once
  - expect:
      p1:Protean Hydra.counters: { +1/+1: 2 }
