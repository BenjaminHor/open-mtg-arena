name: Clone copying Prodigal Pyromancer has its damage ability, which resolves from the copied text
rules: [CR 707.2, CR 602.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island]
    hand: [Clone]
  p2:
    battlefield: [Prodigal Pyromancer]
steps:
  - p1 cast: Clone
    pay: auto
  - all pass: once
  - p1 choose: p2:Prodigal Pyromancer
  - all pass: until main1
  - all pass: until main1
  - p1 activate: p1:Prodigal Pyromancer
    targets: [p2]
  - expect:
      stack: [Prodigal Pyromancer ability]
  - all pass: once
  - expect:
      p2.life: 19
