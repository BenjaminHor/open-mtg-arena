name: Elvish Piper puts Clone onto the battlefield; Clone chooses a creature to copy
rules: [CR 614.12a, CR 707.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Elvish Piper, Forest]
    hand: [Clone]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 activate: Elvish Piper
    pay: auto
  - all pass: once
  - p1 choose: Clone
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: copy }
  - p1 choose: p2:Grizzly Bears
  - expect:
      p1.battlefield contains: [Grizzly Bears]
