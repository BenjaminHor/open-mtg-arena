name: Clone-as-Pyromancer destroyed in response still deals red damage (LKI), so Great Sable Stag isn't protected
rules: [CR 608.2h, CR 113.7a, CR 707.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island]
    hand: [Clone]
  p2:
    battlefield: [Prodigal Pyromancer, Great Sable Stag, Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - p1 cast: Clone
    pay: auto
  - all pass: once
  - p1 choose: p2:Prodigal Pyromancer
  - all pass: until main1
  - all pass: until main1
  - p1 activate: p1:Prodigal Pyromancer
    targets: [p2:Great Sable Stag]
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Prodigal Pyromancer]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Clone]
      stack: [Prodigal Pyromancer ability]
  - all pass: once
  - expect:
      p2:Great Sable Stag.damage: 1
