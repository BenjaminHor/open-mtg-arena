name: Soul Warden triggers for a Clone entering as a creature, even copying nothing
rules: [CR 707.5, CR 603.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Soul Warden]
