name: A Clone that Sphinx Ambassador puts onto the battlefield from a library chooses what to copy, and the choice announced doesn't name the card by its library id
rules: [CR 614.12a, CR 707.5, CR 401.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Sphinx Ambassador]
  p2:
    library: [Clone, Island]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Sphinx Ambassador]
  - all pass: until combat.damage
  - all pass: once
  - p1 choose: Clone
  - p2 choose: Grizzly Bears
  - p1 choose: yes
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: copy }
  - p1 choose: Sphinx Ambassador
  - expect:
      p1.battlefield: [Sphinx Ambassador, Sphinx Ambassador]
      p1:Sphinx Ambassador#2.power: 5
      events contains: [{ type: OBJECTS_CHOSEN, player: p1, object: null }]
