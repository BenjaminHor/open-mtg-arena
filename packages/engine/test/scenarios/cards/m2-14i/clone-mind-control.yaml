name: A Clone copying Hill Giant that p2 takes with Mind Control is still a Hill Giant (control is layer 2, the copy layer 1)
rules: [CR 613.2a, CR 613.1b, CR 707.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island]
    hand: [Clone]
  p2:
    battlefield: [Hill Giant, Island, Island, Island, Island, Island]
    hand: [Mind Control]
steps:
  - p1 cast: Clone
    pay: auto
  - all pass: once
  - p1 choose: p2:Hill Giant
  - all pass: until main1
  - p2 cast: Mind Control
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: [Island, Island, Island, Island]
      p2.battlefield contains: [Hill Giant, Hill Giant, Mind Control]
      p2:Hill Giant#2.power: 3
      p2:Hill Giant#2.toughness: 3
