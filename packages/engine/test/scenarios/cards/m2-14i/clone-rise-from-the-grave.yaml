name: Clone put onto the battlefield by Rise from the Grave still chooses what to copy, and is then also a black Zombie
rules: [CR 614.12a, CR 707.5, CR 613.1d, CR 613.1e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Swamp]
    hand: [Rise from the Grave]
    graveyard: [Clone]
    manaPool: { B: 5 }
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Rise from the Grave
    targets: [graveyard:p1:Clone]
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: copy }
  - p1 choose: p2:Grizzly Bears
  - expect:
      p1:Grizzly Bears.colors: [B, G]
      p1:Grizzly Bears.subtypes: [Bear, Zombie]
      p1:Grizzly Bears.power: 2
      p1.graveyard: [Rise from the Grave]
