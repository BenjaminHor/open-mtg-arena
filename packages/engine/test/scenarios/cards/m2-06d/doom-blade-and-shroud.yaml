name: Doom Blade can't target a creature with shroud, so with no other creature to target it can't be cast
rules: [CR 702.18a, CR 601.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
  p2:
    battlefield: [Kalonian Behemoth]
steps:
  - p1 cast: Doom Blade
    targets: [p2:Kalonian Behemoth]
    pay: auto
  - expect error: illegalAction
