name: A player with several triggers at once chooses the order they go on the stack; the one put on first resolves last
rules: [CR 603.3b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 10
    battlefield: [Soul Warden, Forest, Forest]
    hand: [Elvish Visionary]
    library: [Island]
steps:
  - p1 cast: Elvish Visionary
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: orderTriggers }
  - p1 choose: Elvish Visionary
  - expect:
      stack: [Elvish Visionary ability, Soul Warden ability]
      pending: { player: p1, kind: priority }
  - all pass: once
  - expect:
      p1.life: 11
      p1.hand: []
