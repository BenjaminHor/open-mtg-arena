name: Ball Lightning attacks with haste, then its trigger at the beginning of the end step sacrifices it
rules: [CR 603.2b, CR 513.1, CR 701.21a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Ball Lightning]
steps:
  - p1 cast: Ball Lightning
    pay: auto
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Ball Lightning]
  - all pass: until end
  - expect:
      p2.life: 14
      stack: [Ball Lightning ability]
  - all pass: once
  - expect:
      p1.graveyard: [Ball Lightning]
      stack: []
