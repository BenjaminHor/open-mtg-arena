name: Soul Warden doesn't trigger for itself entering, nor for a land
rules: [CR 603.6a, CR 603.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains]
    hand: [Soul Warden, Forest]
steps:
  - p1 cast: Soul Warden
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Soul Warden]
      stack: []
      events lacks: [{ type: ABILITY_TRIGGERED }]
  - p1 play: Forest
  - expect:
      stack: []
      p1.life: 20
