name: A Soul Warden in the graveyard doesn't trigger when a creature enters; only permanents' abilities do
rules: [CR 113.6, CR 603.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest]
    hand: [Grizzly Bears]
    graveyard: [Soul Warden]
steps:
  - p1 cast: Grizzly Bears
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Grizzly Bears]
      stack: []
      p1.life: 20
      events lacks: [{ type: ABILITY_TRIGGERED }]
