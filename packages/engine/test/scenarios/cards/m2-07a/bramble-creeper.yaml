name: Bramble Creeper's attack trigger goes on the stack before anyone gets priority in the declare attackers step
rules: [CR 508.3a, CR 508.2b, CR 603.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Bramble Creeper]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Bramble Creeper]
  - expect:
      stack: [Bramble Creeper ability]
      pending: { player: p1, kind: priority }
  - all pass: once
  - expect:
      p1:Bramble Creeper.power: 5
  - all pass: until main2
  - expect:
      p2.life: 15
