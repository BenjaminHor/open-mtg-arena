name: After the active player's trigger is on the stack, the other player orders their two; the last goes on unasked
rules: [CR 603.3b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest]
    hand: [Elvish Visionary]
    library: [Island]
  p2:
    battlefield: [Soul Warden, Soul Warden]
steps:
  - p1 cast: Elvish Visionary
    pay: auto
  - all pass: once
  - expect:
      stack: [Elvish Visionary ability]
      pending: { player: p2, kind: orderTriggers }
  - p2 choose: Soul Warden
  - expect:
      stack: [Elvish Visionary ability, Soul Warden ability, Soul Warden ability]
      pending: { player: p1, kind: priority }
