name: On the starting player's first turn there is no draw step, so Howling Mine doesn't trigger
rules: [CR 103.8a, CR 603.2b]
setup:
  turn: { active: p1, step: upkeep, number: 1 }
  p1:
    battlefield: [Howling Mine]
    library: [Forest, Island]
steps:
  - all pass: until main1
  - expect:
      p1.hand: []
      stack: []
