name: Sparkmage Apprentice's trigger deals its damage even if the Apprentice is gone, as the ability's source
rules: [CR 113.7a, CR 608.2h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Sparkmage Apprentice]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p1 cast: Sparkmage Apprentice
    pay: auto
  - all pass: once
  - p1 choose: p2
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p1:Sparkmage Apprentice]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Sparkmage Apprentice]
  - all pass: once
  - expect:
      p2.life: 19
