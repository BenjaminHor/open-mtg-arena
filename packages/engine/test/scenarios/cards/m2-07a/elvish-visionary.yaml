name: Elvish Visionary's enters trigger goes on the stack as it enters, before anyone gets priority, and draws a card as it resolves
rules: [CR 603.1, CR 603.3, CR 603.6a, CR 117.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest]
    hand: [Elvish Visionary]
    library: [Island, Island]
steps:
  - p1 cast: Elvish Visionary
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Elvish Visionary]
      stack: [Elvish Visionary ability]
      pending: { player: p1, kind: priority }
      events contains: [{ type: ABILITY_TRIGGERED, controller: p1 }]
  - all pass: once
  - expect:
      stack: []
      p1.hand: [Island]
