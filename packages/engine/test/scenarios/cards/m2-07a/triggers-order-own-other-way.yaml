name: The same two triggers ordered the other way resolve the other way round
rules: [CR 603.3b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 10
    battlefield: [Soul Warden, Forest, Forest]
    hand: [Elvish Visionary]
    library: [Island]
steps:
  - p1 cast: Elvish Visionary
    pay: auto
  - all pass: once
  - p1 choose: Soul Warden
  - expect:
      stack: [Soul Warden ability, Elvish Visionary ability]
  - all pass: once
  - expect:
      p1.hand: [Island]
      p1.life: 10
