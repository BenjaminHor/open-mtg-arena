name: Acidic Slime's trigger must target something if it can, even its controller's own land
rules: [CR 603.3d, CR 115.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest, Forest, Forest, Forest]
    hand: [Acidic Slime]
steps:
  - p1 cast: Acidic Slime
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseTarget }
  - p1 choose: cancel
  - expect error: illegalAction
  - p1 choose: p1:Forest#1
  - all pass: once
  - expect:
      p1.graveyard: [Forest]
