name: Answering no to Gravedigger's "you may" leaves the card in the graveyard
rules: [CR 603.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Swamp, Swamp, Swamp, Swamp]
    hand: [Gravedigger]
    graveyard: [Runeclaw Bear]
steps:
  - p1 cast: Gravedigger
    pay: auto
  - all pass: once
  - p1 choose: graveyard:p1:Runeclaw Bear
  - all pass: once
  - p1 choose: no
  - expect:
      p1.graveyard: [Runeclaw Bear]
      p1.hand: []
