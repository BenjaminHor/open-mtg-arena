name: Triggers of both players go on the stack in APNAP order, the active player's first, so the other player's resolves first
rules: [CR 603.3b, CR 101.4, CR 603.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest]
    hand: [Elvish Visionary]
    library: [Island]
  p2:
    life: 10
    battlefield: [Soul Warden]
steps:
  - p1 cast: Elvish Visionary
    pay: auto
  - all pass: once
  - expect:
      stack: [Elvish Visionary ability, Soul Warden ability]
      pending: { player: p1, kind: priority }
  - all pass: once
  - expect:
      p2.life: 11
      stack: [Elvish Visionary ability]
  - all pass: once
  - expect:
      p1.hand: [Island]
