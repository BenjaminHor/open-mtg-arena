name: A tapped Howling Mine doesn't trigger at all, its condition being false as the step begins
rules: [CR 603.4]
setup:
  turn: { active: p1, step: upkeep }
  p1:
    battlefield: [{ card: Howling Mine, tapped: true }]
    library: [Forest, Island, Mountain]
steps:
  - all pass: until draw
  - expect:
      stack: []
      p1.hand: [Forest]
      events lacks: [{ type: ABILITY_TRIGGERED }]
