name: Sparkmage Apprentice's trigger chooses its target as it goes on the stack, can't be cancelled, and deals 1 damage
rules: [CR 603.3d, CR 115.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Sparkmage Apprentice]
steps:
  - p1 cast: Sparkmage Apprentice
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseTarget }
  - p1 choose: cancel
  - expect error: illegalAction
  - p1 choose: p2
  - expect:
      stack: [Sparkmage Apprentice ability]
      pending: { player: p1, kind: priority }
  - all pass: once
  - expect:
      p2.life: 19
