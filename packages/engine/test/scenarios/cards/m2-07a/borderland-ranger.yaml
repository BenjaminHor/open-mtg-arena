name: Borderland Ranger's trigger may search for a basic land, reveal it and put it into hand, then shuffle
rules: [CR 603.5, CR 701.23a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest, Forest]
    hand: [Borderland Ranger]
    library: [Runeclaw Bear, Plains]
steps:
  - p1 cast: Borderland Ranger
    pay: auto
  - all pass: once
  - all pass: once
  - p1 choose: yes
  - p1 choose: Plains
  - expect:
      p1.hand: [Plains]
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
