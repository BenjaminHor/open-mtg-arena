name: Inferno Elemental blocked by two creatures triggers once for each, dealing 3 damage to each
rules: [CR 509.3d, CR 603.2c, CR 603.3b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Inferno Elemental]
  p2:
    battlefield: [Grizzly Bears, Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Inferno Elemental]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Inferno Elemental, Giant Spider: Inferno Elemental }
  - expect:
      pending: { player: p1, kind: orderTriggers }
  - p1 choose: Inferno Elemental
  - expect:
      stack: [Inferno Elemental ability, Inferno Elemental ability]
  - all pass: once
  - all pass: once
  - expect:
      p2.graveyard: [Grizzly Bears]
      p2:Giant Spider.damage: 3
