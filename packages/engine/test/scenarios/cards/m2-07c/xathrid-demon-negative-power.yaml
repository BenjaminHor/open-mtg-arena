name: A creature with negative power sacrificed to Xathrid Demon makes no one lose or gain life
rules: [CR 107.1b, CR 608.2h]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Xathrid Demon, Grizzly Bears]
  p2:
    battlefield: [Island, Island, Island, Island]
    hand: [Disorient]
steps:
  - all pass: until upkeep
  - p1 pass: once
