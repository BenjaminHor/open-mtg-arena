name: A blocker gone before Inferno Elemental's trigger resolves takes no damage; the Elemental stays blocked and deals no combat damage
rules: [CR 400.7, CR 509.1h, CR 510.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Inferno Elemental]
  p2:
    battlefield: [Grizzly Bears, Island]
    hand: [Unsummon]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Inferno Elemental]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Inferno Elemental }
  - p1 pass: once
  - p2 cast: Unsummon
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p2.hand: [Grizzly Bears]
      events lacks: [{ type: DAMAGE_DEALT }]
  - all pass: until combat.end
  - expect:
      p2.life: 20
