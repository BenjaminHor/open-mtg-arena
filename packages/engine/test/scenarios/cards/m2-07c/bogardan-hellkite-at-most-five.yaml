name: Bogardan Hellkite's 5 damage can be divided among at most five targets, each a different one
rules: [CR 601.2d, CR 601.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Grizzly Bears]
    hand: [Bogardan Hellkite]
  p2:
    battlefield: [Grizzly Bears, Grizzly Bears, Giant Spider]
steps:
  - p1 cast: Bogardan Hellkite
    pay: auto
  - all pass: once
  - p1 choose: 6
  - expect error: illegalAction
  - p1 choose: 5
  - p1 choose: p2
  - p1 choose: p2
  - expect error: illegalAction
