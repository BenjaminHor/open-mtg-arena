name: Bogardan Hellkite, cast with flash in the opponent's turn, divides 5 damage among targets chosen as its trigger goes on the stack
rules: [CR 702.8a, CR 603.3d, CR 601.2d]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain]
    hand: [Bogardan Hellkite]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p2 pass: once
  - p1 cast: Bogardan Hellkite
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Bogardan Hellkite]
      pending: { player: p1, kind: chooseTargetCount }
  - p1 choose: 2
  - p1 choose: p2
  - p1 choose: p2:Grizzly Bears
  - p1 choose: 3
  - expect:
      stack: [Bogardan Hellkite ability]
  - all pass: once
  - expect:
      p2.life: 17
      p2.graveyard: [Grizzly Bears]
