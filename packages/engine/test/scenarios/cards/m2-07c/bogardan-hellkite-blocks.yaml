name: Bogardan Hellkite flashed in during the opponent's declare attackers step can block an attacker
rules: [CR 702.8a, CR 509.1a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain]
    hand: [Bogardan Hellkite]
  p2:
    battlefield: [Craw Wurm]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - p2 pass: once
  - p1 cast: Bogardan Hellkite
    pay: auto
  - all pass: once
  - p1 choose: 1
  - p1 choose: p2
  - all pass: once
  - expect:
      p2.life: 15
  - all pass: until combat.declareBlockers
  - p1 block: { Bogardan Hellkite: Craw Wurm }
  - all pass: until combat.end
  - expect:
      p2.graveyard: [Craw Wurm]
      p1.graveyard: [Bogardan Hellkite]
      p1.life: 20
