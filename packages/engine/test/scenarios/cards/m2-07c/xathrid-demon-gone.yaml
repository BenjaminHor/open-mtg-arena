name: Xathrid Demon gone before its trigger resolves still makes its controller sacrifice another creature
rules: [CR 113.7a, CR 608.2h]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Xathrid Demon, Grizzly Bears]
  p2:
    battlefield: [Island]
    hand: [Unsummon]
steps:
  - all pass: until upkeep
  - p1 pass: once
  - p2 cast: Unsummon
    targets: [p1:Xathrid Demon]
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Xathrid Demon]
  - all pass: once
  - expect:
      p1.graveyard: [Grizzly Bears]
      p2.life: 18
