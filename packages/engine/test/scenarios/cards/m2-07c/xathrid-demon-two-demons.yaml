name: With two Xathrid Demons and nothing else, the first trigger sacrifices the other Demon, the second the first
rules: [CR 603.3b, CR 608.2h, CR 113.7a]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Xathrid Demon, Xathrid Demon]
steps:
  - all pass: once
  - expect:
      pending: { player: p1, kind: orderTriggers }
  - p1 choose: Xathrid Demon
  - all pass: once
  - expect:
      p1.graveyard: [Xathrid Demon]
      p2.life: 13
  - all pass: once
  - expect:
      p1.graveyard: [Xathrid Demon, Xathrid Demon]
      p2.life: 6
      p1.life: 20
