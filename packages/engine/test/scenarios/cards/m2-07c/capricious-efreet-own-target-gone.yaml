name: Capricious Efreet's own-side target gone by resolution leaves the pick among the opponent's targets
rules: [CR 608.2b]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Capricious Efreet, Grizzly Bears, Island]
    hand: [Unsummon]
  p2:
    battlefield: [Craw Wurm]
steps:
  - all pass: once
  - p1 choose: p1:Grizzly Bears
  - p1 choose: 1
  - p1 choose: p2:Craw Wurm
  - p1 cast: Unsummon
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.hand: [Grizzly Bears]
      p2.graveyard: [Craw Wurm]
      p1.battlefield contains: [Capricious Efreet]
