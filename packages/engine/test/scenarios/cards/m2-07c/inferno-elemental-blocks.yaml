name: Inferno Elemental blocking deals 3 damage to the attacker before combat damage, which then finishes it
rules: [CR 509.3b, CR 510.2]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Inferno Elemental]
  p2:
    battlefield: [Craw Wurm]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p1 block: { Inferno Elemental: Craw Wurm }
  - expect:
      stack: [Inferno Elemental ability]
  - all pass: once
  - expect:
      p2:Craw Wurm.damage: 3
  - all pass: until combat.end
  - expect:
      p2.graveyard: [Craw Wurm]
      p1.graveyard: [Inferno Elemental]
