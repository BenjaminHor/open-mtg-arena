name: A target of Bogardan Hellkite's trigger that's gone loses its share of the damage; it isn't dealt to the others
rules: [CR 608.2b, CR 601.2d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain]
    hand: [Bogardan Hellkite]
  p2:
    battlefield: [Grizzly Bears, Island]
    hand: [Unsummon]
steps:
  - p1 cast: Bogardan Hellkite
    pay: auto
  - all pass: once
  - p1 choose: 2
  - p1 choose: p2
  - p1 choose: p2:Grizzly Bears
  - p1 choose: 2
  - p1 pass: once
  - p2 cast: Unsummon
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p2.life: 18
      p2.hand: [Grizzly Bears]
      stack: []
