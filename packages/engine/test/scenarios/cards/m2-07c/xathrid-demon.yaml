name: Xathrid Demon's upkeep trigger sacrifices its controller's only other creature; each opponent loses life equal to its power
rules: [CR 603.2b, CR 701.21a, CR 608.2c]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Xathrid Demon, Grizzly Bears]
steps:
  - all pass: until upkeep
  - expect:
      active: p1
      stack: [Xathrid Demon ability]
  - all pass: once
  - expect:
      p1.graveyard: [Grizzly Bears]
      p2.life: 18
      p1.life: 20
      p1:Xathrid Demon.tapped: false
