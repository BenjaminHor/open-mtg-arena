name: A target of Capricious Efreet that's gone by resolution isn't among those picked from; the one left is destroyed
rules: [CR 608.2b, CR 115.1]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Capricious Efreet, Forest]
  p2:
    battlefield: [Grizzly Bears, Island]
    hand: [Unsummon]
steps:
  - all pass: once
  - p1 choose: p1:Capricious Efreet
  - p1 choose: 1
  - p1 choose: p2:Grizzly Bears
  - expect:
      stack: [Capricious Efreet ability]
  - p1 pass: once
  - p2 cast: Unsummon
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.graveyard: [Capricious Efreet]
      p2.hand: [Grizzly Bears]
