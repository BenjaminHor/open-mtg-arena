name: Capricious Efreet can't target a land, its controller's or an opponent's
rules: [CR 115.1, CR 603.3d]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Capricious Efreet, Forest]
  p2:
    battlefield: [Mountain, Grizzly Bears]
steps:
  - all pass: once
  - p1 choose: p1:Forest
  - expect error: illegalAction
  - p1 choose: p1:Capricious Efreet
  - p1 choose: 1
  - p1 choose: p2:Mountain
  - expect error: illegalAction
  - p1 choose: p2:Grizzly Bears
  - expect:
      stack: [Capricious Efreet ability]
