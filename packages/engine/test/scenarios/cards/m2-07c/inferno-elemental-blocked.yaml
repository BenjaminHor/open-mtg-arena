name: Inferno Elemental's trigger kills its blocker in the declare blockers step; it stays blocked and deals no combat damage
rules: [CR 509.3d, CR 509.1h, CR 510.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Inferno Elemental]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Inferno Elemental]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Inferno Elemental }
  - expect:
      stack: [Inferno Elemental ability]
      step: combat.declareBlockers
  - all pass: once
  - expect:
      p2.graveyard: [Grizzly Bears]
      events contains: [{ type: DAMAGE_DEALT, amount: 3, combat: false }]
  - all pass: until combat.end
  - expect:
      p2.life: 20
