name: Goblin Chieftain gives the Goblin tokens +1/+1 and haste, so they attack the turn they're created
rules: [CR 613.4c, CR 302.6, CR 111.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Goblin Chieftain, Mountain, Mountain, Mountain, Mountain, Mountain]
    hand: [Siege-Gang Commander]
steps:
  - p1 cast: Siege-Gang Commander
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1:Goblin Token#1.power: 2
      p1:Siege-Gang Commander.power: 3
  - all pass: until combat.declareAttackers
  - p1 attack: [Goblin Token#1, Goblin Token#2, Goblin Token#3]
  - all pass: until main2
  - expect:
      p2.life: 14
