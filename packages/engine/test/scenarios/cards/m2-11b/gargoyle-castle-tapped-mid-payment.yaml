name: Tapping Gargoyle Castle for {C} while paying for its own ability leaves its {T} cost unpayable; cancelling undoes it all
rules: [CR 601.2g, CR 601.2h, CR 602.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Gargoyle Castle, Forest, Forest, Forest, Forest, Forest]
steps:
  - p1 activate: Gargoyle Castle
    ability: 2
  - expect:
      pending: { player: p1, kind: payMana }
  - p1 activate: Gargoyle Castle
    ability: 1
  - expect:
      p1:Gargoyle Castle.tapped: true
      p1.manaPool: { C: 1 }
  - p1 choose: cancel
  - expect:
      stack: []
      p1:Gargoyle Castle.tapped: false
      p1.manaPool: {}
