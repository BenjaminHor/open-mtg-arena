name: Soldier tokens with the Captain's vigilance attack next turn without tapping, alongside Veteran Armorsmith's +0/+1
rules: [CR 702.20b, CR 613.4c, CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Veteran Armorsmith, Plains, Plains, Plains, Plains, Plains, Plains]
    hand: [Captain of the Watch]
steps:
  - p1 cast: Captain of the Watch
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1:Soldier Token#1.toughness: 3
      p1:Captain of the Watch.toughness: 4
  - all pass: until main1
  - all pass: until main1
  - all pass: until combat.declareAttackers
  - p1 attack: [Soldier Token#1, Soldier Token#2]
  - expect:
      p1:Soldier Token#1.tapped: false
  - all pass: until main2
  - expect:
      p2.life: 16
