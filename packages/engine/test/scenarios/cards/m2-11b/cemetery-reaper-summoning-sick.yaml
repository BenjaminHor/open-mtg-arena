name: Cemetery Reaper's {T} ability can't be activated the turn it comes under its controller's control
rules: [CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Swamp, Swamp, Swamp, Swamp, Swamp, Swamp]
    hand: [Cemetery Reaper]
  p2:
    graveyard: [Grizzly Bears]
steps:
  - p1 cast: Cemetery Reaper
    pay: auto
  - all pass: once
  - p1 activate: Cemetery Reaper
    targets: [graveyard:p2:Grizzly Bears]
    pay: auto
  - expect error: illegalAction
