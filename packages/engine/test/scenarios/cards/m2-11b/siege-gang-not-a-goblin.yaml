name: Siege-Gang Commander's ability can't sacrifice a creature that isn't a Goblin
rules: [CR 601.2h, CR 602.2b, CR 109.2, CR 701.21a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Siege-Gang Commander, Grizzly Bears, Mountain, Mountain]
steps:
  - p1 activate: Siege-Gang Commander
    sacrifice: Grizzly Bears
    targets: [p2]
    pay: auto
  - expect error: illegalAction
