name: Siege-Gang Commander enters and creates three 1/1 red Goblin tokens at once
rules: [CR 603.6a, CR 111.1, CR 111.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain]
    hand: [Siege-Gang Commander]
steps:
  - p1 cast: Siege-Gang Commander
    pay: auto
  - all pass: once
  - expect:
      stack: [Siege-Gang Commander ability]
  - all pass: once
  - expect:
      p1.battlefield contains: [Siege-Gang Commander, Goblin Token, Goblin Token, Goblin Token]
      p1.battlefield count: 9
      p1:Goblin Token#3.colors: [R]
      p1:Goblin Token#3.power: 1
