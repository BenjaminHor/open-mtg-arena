name: Cemetery Reaper can't target a card in a graveyard that isn't a creature card
rules: [CR 109.2a, CR 601.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Cemetery Reaper, Swamp, Swamp, Swamp]
    graveyard: [Shock]
steps:
  - p1 activate: Cemetery Reaper
    targets: [graveyard:p1:Shock]
    pay: auto
  - expect error: illegalAction
