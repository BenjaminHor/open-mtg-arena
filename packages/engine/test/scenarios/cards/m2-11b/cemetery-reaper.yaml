name: Cemetery Reaper exiles a creature card from any graveyard and makes a 2/2 black Zombie, which it pumps
rules: [CR 115.1, CR 111.1, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Cemetery Reaper, Swamp, Swamp, Swamp]
  p2:
    graveyard: [Grizzly Bears]
steps:
  - p1 activate: Cemetery Reaper
    targets: [graveyard:p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: []
      exile: [Grizzly Bears]
      p1:Zombie Token.power: 3
      p1:Zombie Token.colors: [B]
      p1:Cemetery Reaper.power: 2
