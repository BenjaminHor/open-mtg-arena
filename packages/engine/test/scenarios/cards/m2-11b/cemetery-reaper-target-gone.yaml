name: If Cemetery Reaper's target has left the graveyard, the ability doesn't resolve and makes no Zombie (its ruling)
rules: [CR 608.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Cemetery Reaper, Cemetery Reaper, Swamp, Swamp, Swamp, Swamp, Swamp, Swamp]
  p2:
    graveyard: [Grizzly Bears]
steps:
  - p1 activate: p1:Cemetery Reaper#1
    targets: [graveyard:p2:Grizzly Bears]
    pay: auto
  - p1 activate: p1:Cemetery Reaper#2
    targets: [graveyard:p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      exile: [Grizzly Bears]
      p1.battlefield contains: [Zombie Token]
      p1.battlefield count: 9
      p1:Zombie Token.power: 4
      events contains: [{ type: ABILITY_DID_NOT_RESOLVE }]
