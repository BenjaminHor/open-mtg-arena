name: Panic Attack's targets can't block this turn; other creatures still can
rules: [CR 509.1b, CR 611.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Siege Mastodon, Runeclaw Bear, Mountain, Mountain, Mountain]
    hand: [Panic Attack]
  p2:
    battlefield: [Giant Spider, Elite Vanguard, Coral Merfolk, Horned Turtle]
steps:
  - p1 cast: Panic Attack
    targets: [[p2:Giant Spider, p2:Elite Vanguard, p2:Coral Merfolk]]
    pay: auto
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Siege Mastodon, Runeclaw Bear]
  - all pass: until combat.declareBlockers
  - p2 block: { Giant Spider: Siege Mastodon }
  - expect error: illegalAction
  - p2 block: { Horned Turtle: Runeclaw Bear }
  - all pass: until main2
  - expect:
      p2.life: 17
