name: Panic Attack's effect lasts only this turn; next turn the creature blocks again
rules: [CR 514.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Runeclaw Bear, Mountain, Mountain, Mountain]
    hand: [Panic Attack]
  p2:
    battlefield: [Elite Vanguard]
steps:
  - p1 cast: Panic Attack
    targets: [p2:Elite Vanguard]
    pay: auto
  - all pass: once
  - all pass: until end
  - all pass: until main1
  - all pass: until end
  - all pass: until combat.declareAttackers
  - p1 attack: [Runeclaw Bear]
  - all pass: until combat.declareBlockers
  - p2 block: { Elite Vanguard: Runeclaw Bear }
  - all pass: until main2
  - expect:
      p2.graveyard: [Elite Vanguard]
