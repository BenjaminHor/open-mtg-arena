name: A creature that can't be blocked except by black creatures can be blocked by a black one only
rules: [CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Dread Warlock]
  p2:
    battlefield: [Runeclaw Bear, Child of Night]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Dread Warlock]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Dread Warlock }
  - expect error: illegalAction
  - p2 block: { Child of Night: Dread Warlock }
  - all pass: until main2
  - expect:
      # Child of Night's lifelink: it dealt 2 to the Warlock.
      p2.life: 22
      p2.graveyard: [Child of Night]
