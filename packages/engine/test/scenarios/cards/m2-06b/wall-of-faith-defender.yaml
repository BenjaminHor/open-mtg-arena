name: A creature with defender can't attack, but blocks, and Wall of Faith's ability raises its toughness
rules: [CR 702.3b, CR 508.1a, CR 508.1c, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Wall of Faith, Runeclaw Bear, Plains, Plains]
  p2:
    battlefield: [Craw Wurm]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Wall of Faith]
  - expect error: illegalAction
  - p1 attack: [Runeclaw Bear]
  - expect:
      p1:Wall of Faith.tapped: false
  - all pass: until end
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p1 block: { Wall of Faith: Craw Wurm }
  - p2 pass: once
  # The 6/4 Wurm would kill the 0/5 Wall even with one +0/+1; with two, it's 0/7.
  - p1 activate: p1:Wall of Faith
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 activate: p1:Wall of Faith
    pay: auto
  - all pass: once
  - expect:
      p1:Wall of Faith.toughness: 7
  - all pass: until combat.damage
  - expect:
      p1:Wall of Faith.damage: 6
      p1.battlefield contains: [Wall of Faith]
