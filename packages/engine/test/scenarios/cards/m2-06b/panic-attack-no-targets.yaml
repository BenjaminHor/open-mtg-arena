name: Panic Attack can be cast with no targets, "up to three" allowing none; it resolves and does nothing
rules: [CR 601.2c, CR 608.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Panic Attack]
steps:
  - p1 cast: Panic Attack
    targets: [[]]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Panic Attack]
      events contains: [{ type: SPELL_RESOLVED }]
