name: Other creatures still block one attacker each; only Palace Guard can block a second
rules: [CR 509.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Runeclaw Bear, Elite Vanguard]
  p2:
    battlefield: [Siege Mastodon]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Runeclaw Bear, Elite Vanguard]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: [Runeclaw Bear, Elite Vanguard] }
  - expect error: illegalAction
