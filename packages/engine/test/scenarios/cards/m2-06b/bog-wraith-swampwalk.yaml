name: A swampwalker can't be blocked while the defending player controls a Swamp
rules: [CR 702.14a, CR 702.14c, CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Bog Wraith]
  p2:
    battlefield: [Siege Mastodon, Swamp]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Bog Wraith]
  # No block is possible, so p2 isn't asked: blockers are declared as none, and p1 gets priority.
  - all pass: until combat.declareBlockers
  - expect:
      pending: { player: p1, kind: priority }
      events contains: [{ type: BLOCKERS_DECLARED, player: p2, blocks: [] }]
  - all pass: until main2
  - expect:
      p2.life: 17
