name: Palace Guard left blocking one attacker isn't asked to divide; all its damage goes to that one
rules: [CR 510.1d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Runeclaw Bear, Elite Vanguard, Mountain]
    hand: [Lightning Bolt]
  p2:
    battlefield: [Palace Guard]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Runeclaw Bear, Elite Vanguard]
  - all pass: until combat.declareBlockers
  - p2 block: { Palace Guard: [Runeclaw Bear, Elite Vanguard] }
  - p1 cast: Lightning Bolt
    targets: [p1:Runeclaw Bear]
    pay: auto
  - all pass: once
  - all pass: until combat.damage
  - expect:
      pending: { kind: priority }
      p1.graveyard: [Lightning Bolt, Runeclaw Bear, Elite Vanguard]
      p2:Palace Guard.damage: 2
