name: Stone Giant's delayed ability destroys the permanent even though it's no longer a creature (its ruling)
rules: [CR 603.7c, CR 701.8a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stone Giant, Forest, Swamp, Swamp]
    hand: [Awakener Druid, Giant Growth, Doom Blade]
    manaPool: { G: 4 }
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - expect:
      p1:Forest.power: 4
  - p1 cast: Giant Growth
    targets: [p1:Stone Giant]
    pay: auto
  - all pass: once
  - p1 activate: Stone Giant
    targets: [p1:Forest]
  - all pass: once
  - p1 cast: Doom Blade
    targets: [p1:Awakener Druid]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Awakener Druid]
      p1.battlefield contains: [Forest]
  - expect:
      p1:Forest.types: [basic, land]
  - all pass: until end
  - all pass: once
  - expect:
      p1.graveyard contains: [Forest]
