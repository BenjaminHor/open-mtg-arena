name: A creature Stone Giant's delayed ability destroys can regenerate, staying on the battlefield tapped
rules: [CR 701.19a, CR 701.8c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stone Giant, Drudge Skeletons, Swamp]
steps:
  - p1 activate: Stone Giant
    targets: [p1:Drudge Skeletons]
  - all pass: once
  - p1 activate: Drudge Skeletons
    pay: auto
  - all pass: once
  - all pass: until end
  - all pass: once
  - expect:
      p1.battlefield contains: [Drudge Skeletons]
      p1:Drudge Skeletons.tapped: true
