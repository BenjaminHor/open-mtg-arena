name: Stone Giant's delayed ability destroys the creature even though the Giant left the battlefield before the end step
rules: [CR 603.7e, CR 113.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stone Giant, Grizzly Bears]
  p2:
    battlefield: [Island]
    hand: [Unsummon]
steps:
  - p1 activate: Stone Giant
    targets: [p1:Grizzly Bears]
  - all pass: once
  - p1 pass: once
  - p2 cast: Unsummon
    targets: [p1:Stone Giant]
    pay: auto
  - all pass: once
  - all pass: until end
  - all pass: once
  - expect:
      p1.hand contains: [Stone Giant]
      p1.graveyard: [Grizzly Bears]
