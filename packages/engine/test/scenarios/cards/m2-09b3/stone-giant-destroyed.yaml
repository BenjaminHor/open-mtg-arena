name: If Stone Giant is destroyed before its ability resolves, its power as it last existed keeps the target legal
rules: [CR 608.2b, CR 608.2h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stone Giant, Hill Giant, Mountain, Mountain]
    hand: [Kindled Fury]
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - p1 cast: Kindled Fury
    targets: [p1:Stone Giant]
    pay: auto
  - all pass: once
  - p1 activate: Stone Giant
    targets: [p1:Hill Giant]
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Stone Giant]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.graveyard contains: [Stone Giant]
      p1:Hill Giant.abilities contains: [flying]
