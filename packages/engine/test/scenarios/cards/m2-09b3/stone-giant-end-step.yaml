name: Stone Giant activated during an end step destroys the creature at the next turn's end step, not this one (its ruling)
rules: [CR 603.7, CR 513.1]
setup:
  turn: { active: p1, step: end }
  p1:
    battlefield: [Stone Giant, Grizzly Bears]
steps:
  - p1 activate: Stone Giant
    targets: [p1:Grizzly Bears]
  - all pass: once
  - all pass: until upkeep
  - expect:
      p1.battlefield contains: [Grizzly Bears]
  - all pass: until end
  - all pass: once
  - expect:
      p1.graveyard: [Grizzly Bears]
