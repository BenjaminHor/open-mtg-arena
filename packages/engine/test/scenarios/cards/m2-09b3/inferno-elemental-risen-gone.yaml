name: A risen black Inferno Elemental bounced before its trigger resolves deals its damage as a black source, so White Knight's protection prevents it
rules: [CR 608.2h, CR 702.16e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Rise from the Grave]
    manaPool: { B: 5 }
  p2:
    battlefield: [White Knight, Island]
    hand: [Unsummon]
    graveyard: [Inferno Elemental]
steps:
  - p1 cast: Rise from the Grave
    targets: [graveyard:p2:Inferno Elemental]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - all pass: until upkeep
  - all pass: until combat.declareAttackers
  - p1 attack: [Inferno Elemental]
  - all pass: until combat.declareBlockers
  - p2 block: { White Knight: Inferno Elemental }
  # Its trigger is on the stack; p2 bounces it in response.
  - p1 pass: once
  - p2 cast: Unsummon
    targets: [p1:Inferno Elemental]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p2.hand contains: [Inferno Elemental]
      p2:White Knight.damage: 0
      events contains: [{ type: DAMAGE_PREVENTED }]
