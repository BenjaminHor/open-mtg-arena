name: If Stone Giant leaves before its ability resolves, its power as it last existed decides whether the target is still legal
rules: [CR 608.2b, CR 608.2h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stone Giant, Hill Giant, Mountain, Mountain]
    hand: [Kindled Fury]
  p2:
    battlefield: [Island]
    hand: [Unsummon]
steps:
  # Kindled Fury makes the Giant 4/4; Hill Giant's toughness 3 is less only than that 4, not the printed 3. The ability still resolves.
  - p1 cast: Kindled Fury
    targets: [p1:Stone Giant]
    pay: auto
  - all pass: once
  - p1 activate: Stone Giant
    targets: [p1:Hill Giant]
  - p1 pass: once
  - p2 cast: Unsummon
    targets: [p1:Stone Giant]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.hand contains: [Stone Giant]
      p1:Hill Giant.abilities contains: [flying]
