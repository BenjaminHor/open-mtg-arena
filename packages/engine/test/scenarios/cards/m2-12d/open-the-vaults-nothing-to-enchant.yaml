name: An Aura with nothing to enchant stays in the graveyard; it can't enchant an artifact returning with it
rules: [CR 303.4g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains, Plains, Plains, Plains, Plains, Plains]
    hand: [Open the Vaults]
    graveyard: [Pacifism, Ornithopter]
steps:
  - p1 cast: Open the Vaults
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: priority }
      p1.battlefield contains: [Ornithopter]
      p1.graveyard: [Pacifism, Open the Vaults]
