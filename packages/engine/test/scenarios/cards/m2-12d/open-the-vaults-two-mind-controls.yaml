name: Two Mind Controls returned onto one creature get timestamps in APNAP order, so the nonactive player's wins
rules: [CR 613.7m, CR 613.7e, CR 303.4f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains, Plains, Plains, Plains, Plains, Plains, Hill Giant]
    hand: [Open the Vaults]
    graveyard: [Mind Control]
  p2:
    graveyard: [Mind Control]
steps:
  - p1 cast: Open the Vaults
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield contains: [Hill Giant, Mind Control]
      p1.battlefield contains: [Mind Control]
      p2:Hill Giant.sick: true
