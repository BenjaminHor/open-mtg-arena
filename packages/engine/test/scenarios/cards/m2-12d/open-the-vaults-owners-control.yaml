name: Cards return under their owners' control; a returned Mind Control takes its creature, which is summoning sick
rules: [CR 110.2, CR 303.4f, CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains, Plains, Plains, Plains, Plains, Plains]
    hand: [Open the Vaults]
    graveyard: [Mind Control]
  p2:
    battlefield: [Hill Giant]
    graveyard: [Ornithopter]
steps:
  - p1 cast: Open the Vaults
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Mind Control, Hill Giant]
      p2.battlefield: [Ornithopter]
      p1:Mind Control.attachedTo: p1:Hill Giant
      p1:Hill Giant.sick: true
