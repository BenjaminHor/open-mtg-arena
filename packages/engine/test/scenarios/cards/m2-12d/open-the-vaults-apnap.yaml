name: With p2 active, p2 announces what its Aura enchants first, and p1 knows that choice when making theirs
rules: [CR 101.4, CR 101.4b, CR 303.4f]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Hill Giant]
    graveyard: [Pacifism]
  p2:
    battlefield: [Plains, Plains, Plains, Plains, Plains, Plains, Grizzly Bears]
    hand: [Open the Vaults]
    graveyard: [Holy Strength]
steps:
  - p2 cast: Open the Vaults
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p2, kind: chooseCards, purpose: enchant }
  - p2 choose: Hill Giant
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: enchant }
      events contains: [{ type: AURA_HOST_CHOSEN, player: p2 }]
  - p1 choose: Grizzly Bears
  - expect:
      p2:Holy Strength.attachedTo: p1:Hill Giant
      p1:Pacifism.attachedTo: p2:Grizzly Bears
      p1:Hill Giant.power: 4
