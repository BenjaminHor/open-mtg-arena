name: An Aura returned by Open the Vaults doesn't target, so it can enchant a creature with shroud
rules: [CR 303.4f, CR 702.18a, CR 115.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains, Plains, Plains, Plains, Plains, Plains]
    hand: [Open the Vaults]
    graveyard: [Holy Strength]
  p2:
    battlefield: [Mist Leopard, Hill Giant]
steps:
  - p1 cast: Open the Vaults
    pay: auto
  - all pass: once
  - p1 choose: Mist Leopard
  - expect:
      p1:Holy Strength.attachedTo: p2:Mist Leopard
      p2:Mist Leopard.power: 4
      events lacks: [{ type: BECAME_TARGET }]
