name: With p2 active, p1's returned Mind Control is the later one, so p1 keeps its own creature
rules: [CR 613.7m, CR 303.4f]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Hill Giant]
    graveyard: [Mind Control]
  p2:
    battlefield: [Plains, Plains, Plains, Plains, Plains, Plains]
    hand: [Open the Vaults]
    graveyard: [Mind Control]
steps:
  - p2 cast: Open the Vaults
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Hill Giant, Mind Control]
      p2.battlefield contains: [Mind Control]
      p1:Hill Giant.sick: false
