name: Equip can't be activated in an opponent's main phase, even with the stack empty
rules: [CR 602.5d]
setup:
  turn: { active: p1, step: main1 }
  p2:
    battlefield: [Gorgon Flail, Grizzly Bears, Forest, Forest]
steps:
  - p1 pass: once
  - p2 activate: Gorgon Flail
    targets: [p2:Grizzly Bears]
    pay: auto
  - expect error: illegalAction
