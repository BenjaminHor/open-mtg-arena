name: Equipping Magebane Armor after a Jump gives the Armor a new timestamp, so the creature loses flying again
rules: [CR 613.7e, CR 701.3c, CR 613.7, CR 613.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Magebane Armor, Island, Forest, Forest]
    hand: [Jump]
steps:
  - p1 cast: Jump
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.abilities contains: [flying]
  - p1 activate: Magebane Armor
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.abilities lacks: [flying]
      p1:Grizzly Bears.power: 4
