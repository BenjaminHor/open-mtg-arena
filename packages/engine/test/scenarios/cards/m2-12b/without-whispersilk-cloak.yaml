name: Without Whispersilk Cloak, the same attack asks p2 to declare blockers (the control case)
rules: [CR 509.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant, Whispersilk Cloak]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - expect:
      pending: { player: p2, kind: declareBlockers }
