name: Equipping another creature moves the Equipment, which leaves the first creature
rules: [CR 701.3a, CR 701.3c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Hill Giant, { card: Gorgon Flail, attachedTo: p1:Grizzly Bears }, Forest, Forest]
steps:
  - expect:
      p1:Grizzly Bears.power: 3
  - p1 activate: Gorgon Flail
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.power: 2
      p1:Hill Giant.power: 4
      p1:Hill Giant.abilities contains: [deathtouch]
