name: A creature with Whispersilk Cloak can't be blocked and has shroud, so it can't be targeted
rules: [CR 509.1b, CR 702.18a, CR 301.5f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant, { card: Whispersilk Cloak, attachedTo: p1:Hill Giant }]
  p2:
    battlefield: [Grizzly Bears, Mountain]
    hand: [Shock]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Hill Giant]
    pay: auto
  - expect error: illegalAction
  # With no block possible, p2 is never asked to declare one: the step goes straight to priority (CR 509.1b).
  - all pass: until combat.declareBlockers
  - expect:
      pending: { player: p1, kind: priority }
  - all pass: until main2
  - expect:
      p2.life: 17
