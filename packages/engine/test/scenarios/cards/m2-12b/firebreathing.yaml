name: Firebreathing's ability pumps the enchanted creature, activated by the Aura's controller, even on an opponent's creature
rules: [CR 303.4e, CR 303.4m, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, { card: Firebreathing, attachedTo: p2:Grizzly Bears }]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 activate: Firebreathing
    pay: auto
  - all pass: once
  - p1 activate: Firebreathing
    pay: auto
  - all pass: once
  - expect:
      p2:Grizzly Bears.power: 4
      p2:Grizzly Bears.toughness: 2
  # Only the Aura's controller can activate its abilities (CR 303.4e), not the enchanted creature's.
  - p1 pass: once
  - p2 activate: p1:Firebreathing
  - expect error: illegalAction
