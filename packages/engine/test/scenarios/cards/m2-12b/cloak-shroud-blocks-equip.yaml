name: A creature wearing Whispersilk Cloak can't be the target of another equip (shroud), but the Cloak itself can move off it
rules: [CR 702.18a, CR 702.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant, { card: Whispersilk Cloak, attachedTo: p1:Hill Giant }, Gorgon Flail, Grizzly Bears, Forest, Forest, Forest, Forest]
steps:
  - p1 activate: Gorgon Flail
    targets: [p1:Hill Giant]
    pay: auto
  - expect error: illegalAction
  - p1 activate: Whispersilk Cloak
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 activate: Gorgon Flail
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p1:Hill Giant.power: 4
      p1:Hill Giant.abilities lacks: [shroud]
      p1:Grizzly Bears.abilities contains: [shroud]
