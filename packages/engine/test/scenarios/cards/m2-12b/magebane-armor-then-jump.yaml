name: A creature that lost flying to Magebane Armor gains it from a Jump that resolves later (its ruling)
rules: [CR 613.7, CR 613.7e, CR 613.1f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Serra Angel, { card: Magebane Armor, attachedTo: p1:Serra Angel }, Island]
    hand: [Jump]
steps:
  - expect:
      p1:Serra Angel.abilities lacks: [flying]
  - p1 cast: Jump
    targets: [p1:Serra Angel]
    pay: auto
  - all pass: once
  - expect:
      p1:Serra Angel.abilities contains: [flying]
