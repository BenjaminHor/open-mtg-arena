name: Firebreathing destroyed in response to its ability still pumps the creature it last enchanted (last known information)
rules: [CR 608.2h, CR 113.7a]
# CR 608.2h: "enchanted creature" is read from the Aura as it last existed, so the creature it enchanted then gets the
# bonus. Shiv's Embrace, with the same text, has the ruling: "If Shiv's Embrace has left the battlefield by then, the
# creature it was enchanting at the time it left the battlefield will get +1/+0" (D-080).
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, { card: Firebreathing, attachedTo: p1:Grizzly Bears }, Mountain, Forest, Forest]
    hand: [Naturalize]
steps:
  - p1 activate: Firebreathing
    pay: auto
  - p1 cast: Naturalize
    targets: [p1:Firebreathing]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Firebreathing]
  - all pass: once
  - expect:
      p1:Grizzly Bears.power: 3
