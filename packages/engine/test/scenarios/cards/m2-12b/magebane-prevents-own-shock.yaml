name: Magebane Armor prevents noncombat damage from its own controller's sources too, deathtouch included
rules: [CR 615.1a, CR 120.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Prodigal Pyromancer, { card: Gorgon Flail, attachedTo: p1:Prodigal Pyromancer }]
  p2:
    battlefield: [Hill Giant, { card: Magebane Armor, attachedTo: p2:Hill Giant }]
steps:
  - p1 activate: Prodigal Pyromancer
    targets: [p2:Hill Giant]
  - all pass: once
  - expect:
      p2:Hill Giant.damage: 0
      p2.graveyard: []
