name: Equip can be activated only as a sorcery, and only targeting a creature its controller controls
rules: [CR 702.6a, CR 602.5d, CR 301.5b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Gorgon Flail, Grizzly Bears, Forest, Forest, Forest]
    hand: [Giant Growth]
  p2:
    battlefield: [Hill Giant]
steps:
  - p1 activate: Gorgon Flail
    targets: [p2:Hill Giant]
    pay: auto
  - expect error: illegalAction
  - p1 cast: Giant Growth
    targets: [p1:Grizzly Bears]
    pay: auto
  - p1 activate: Gorgon Flail
    targets: [p1:Grizzly Bears]
    pay: auto
  - expect error: illegalAction
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: []
  - all pass: until combat.end
  - p1 activate: Gorgon Flail
    targets: [p1:Grizzly Bears]
    pay: auto
  - expect error: illegalAction
