name: Equipping the creature an Equipment is already on does nothing, with no new timestamp, so a later Jump's flying stays
rules: [CR 701.3b, CR 613.7e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Serra Angel, { card: Magebane Armor, attachedTo: p1:Serra Angel }, Island, Forest, Forest]
    hand: [Jump]
steps:
  - p1 cast: Jump
    targets: [p1:Serra Angel]
    pay: auto
  - all pass: once
  - expect:
      p1:Serra Angel.abilities contains: [flying]
  - p1 activate: Magebane Armor
    targets: [p1:Serra Angel]
    pay: auto
  - all pass: once
  - expect:
      p1:Serra Angel.abilities contains: [flying]
      events lacks: [{ type: ATTACHED }]
