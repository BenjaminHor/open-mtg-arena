name: An equip whose target dies in response doesn't resolve, and the Equipment stays where it was
rules: [CR 608.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Hill Giant, { card: Gorgon Flail, attachedTo: p1:Grizzly Bears }, Forest, Forest]
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - p1 activate: Gorgon Flail
    targets: [p1:Hill Giant]
    pay: auto
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1:Grizzly Bears.power: 3
      p1.graveyard: [Hill Giant]
      events lacks: [{ type: ATTACHED }]
