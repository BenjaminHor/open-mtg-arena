name: Paying with Rootbound Crag and Llanowar Elves out taps the land, keeping the creature free to attack
rules: [CR 601.2g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Llanowar Elves, Rootbound Crag]
    hand: [Giant Growth]
steps:
  - p1 cast: Giant Growth
    targets: [p1:Llanowar Elves]
    pay: auto
  - expect:
      p1:Rootbound Crag.tapped: true
      p1:Llanowar Elves.tapped: false
