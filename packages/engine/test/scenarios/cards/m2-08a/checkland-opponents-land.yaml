name: An opponent's Island doesn't count; only lands its controller controls let Drowned Catacomb enter untapped
rules: [CR 614.12, CR 109.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest]
    hand: [Drowned Catacomb]
  p2:
    battlefield: [Island, Swamp]
steps:
  - p1 play: Drowned Catacomb
  - expect:
      p1:Drowned Catacomb.tapped: true
