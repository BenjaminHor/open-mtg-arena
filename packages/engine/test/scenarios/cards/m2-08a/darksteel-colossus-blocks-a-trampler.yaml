name: A trampler assigns lethal damage to a damaged Darksteel Colossus, ignoring indestructible, and tramples over the rest
rules: [CR 702.19b, CR 702.12b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino]
  p2:
    battlefield: [{ card: Darksteel Colossus, damage: 9 }]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Darksteel Colossus: Stampeding Rhino }
  - all pass: until combat.damage
  - p1 assign: { Darksteel Colossus: 2, p2: 2 }
  - expect:
      p2.life: 18
      p2:Darksteel Colossus.damage: 11
      p2.battlefield: [Darksteel Colossus]
