name: Darksteel Colossus discarded down to hand size in the cleanup step is shuffled into its owner's library
rules: [CR 514.1, CR 113.6b]
setup:
  turn: { active: p1, step: end }
  p1:
    hand: [Darksteel Colossus, Forest, Forest, Forest, Forest, Forest, Forest, Forest]
    library: [Island]
steps:
  - all pass: once
  - p1 choose: Darksteel Colossus
  - expect:
      p1.graveyard: []
      p1.library contains: [Darksteel Colossus]
      p1.library count: 2
      events contains: [{ type: CARD_DISCARDED, player: p1, newId: null }, { type: LIBRARY_SHUFFLED, player: p1 }]
