name: Darksteel Colossus sacrificed for Vampire Aristocrat is revealed and shuffled into its owner's library; the cost is still paid
rules: [CR 614.1a, CR 113.6b, CR 701.21a, CR 118.11]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Aristocrat, Darksteel Colossus]
    library: [Forest, Forest]
steps:
  - p1 activate: Vampire Aristocrat
    sacrifice: Darksteel Colossus
  - expect:
      p1.graveyard: []
      p1.library count: 3
      p1.library contains: [Darksteel Colossus]
      events contains: [{ type: CARDS_REVEALED }, { type: PERMANENT_SACRIFICED }, { type: LIBRARY_SHUFFLED }]
      stack: [Vampire Aristocrat ability]
  - all pass: once
  - expect:
      p1:Vampire Aristocrat.power: 4
