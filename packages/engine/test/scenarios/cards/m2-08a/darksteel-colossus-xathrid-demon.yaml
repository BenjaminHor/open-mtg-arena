name: Xathrid Demon's upkeep sacrifice of Darksteel Colossus still happens; the opponent loses life equal to its power
rules: [CR 608.2h, CR 701.21a, CR 614.6]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Xathrid Demon, Darksteel Colossus]
    library: [Island, Island]
  p2:
    library: [Island]
steps:
  - all pass: until upkeep
  - all pass: once
  - expect:
      p2.life: 9
      p1.life: 20
      p1:Xathrid Demon.tapped: false
      p1.graveyard: []
      p1.library contains: [Darksteel Colossus]
