name: Darksteel Colossus dealt damage by a creature with deathtouch isn't destroyed
rules: [CR 702.12b, CR 704.5h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Darksteel Colossus]
  p2:
    battlefield: [Deadly Recluse]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Darksteel Colossus]
  - all pass: until combat.declareBlockers
  - p2 block: { Deadly Recluse: Darksteel Colossus }
  - all pass: until combat.damage
  - p1 assign: { Deadly Recluse: 2, p2: 9 }
  - expect:
      p1.battlefield: [Darksteel Colossus]
      p1:Darksteel Colossus.damage: 1
      p2.graveyard: [Deadly Recluse]
      p2.life: 11
