name: Darksteel Colossus milled from a library is shuffled back into it
rules: [CR 113.6b, CR 701.24c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island]
    hand: [Tome Scour]
  p2:
    library: [Forest, Darksteel Colossus, Island, Plains, Swamp, Mountain]
steps:
  - p1 cast: Tome Scour
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Forest, Island, Plains, Swamp]
      p2.library count: 2
      p2.library contains: [Darksteel Colossus, Mountain]
