name: Darksteel Colossus discarded is shuffled into its owner's library instead, and it was still discarded; Megrim triggers
rules: [CR 113.6b, CR 701.9a, CR 614.6]
setup:
  turn: { active: p2, step: main1 }
  p1:
    hand: [Darksteel Colossus, Forest]
    library: [Island]
  p2:
    battlefield: [Swamp, Swamp, Swamp, Megrim]
    hand: [Mind Rot]
steps:
  - p2 cast: Mind Rot
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.hand: []
      p1.graveyard: [Forest]
      p1.library count: 2
      p1.library contains: [Darksteel Colossus]
      stack: [Megrim ability, Megrim ability]
