name: A token p2 created that p1 controls counts for p2, its owner
rules: [CR 111.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Act of Treason, Warp World]
    manaPool: { R: 11 }
    library: [Island]
  p2:
    battlefield: [Ant Queen]
    manaPool: { G: 2 }
    library: [Forest]
steps:
  - p1 pass: once
  - p2 activate: Ant Queen
    pay: auto
  - all pass: once
  - p1 cast: Act of Treason
    targets: [p2:Insect Token]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: [Insect Token]
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: []
      p1.library: [Island]
      p2.battlefield count: 2
      p2.library: []
