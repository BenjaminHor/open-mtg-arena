name: Lurking Predators putting a revealed card on the bottom of its library reorders it, which everyone is told
rules: [CR 701.20a, CR 400.7]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Lurking Predators]
    library: [Island, Forest, Craw Wurm]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - all pass: once
  - p1 choose: yes
  - expect:
      p1.library: [Forest, Craw Wurm, Island]
      events contains: [{ type: PUT_ON_LIBRARY_BOTTOM, player: p1, count: 1 }]
