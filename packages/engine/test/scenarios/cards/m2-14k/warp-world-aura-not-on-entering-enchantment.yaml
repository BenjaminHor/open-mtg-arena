name: Indestructibility can't enchant an enchantment entering with it
rules: [CR 303.4f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, { card: Indestructibility, attachedTo: p1:Grizzly Bears }, Howling Mine]
    hand: [Warp World]
    manaPool: { R: 8 }
    library: []
  p2:
    battlefield: [Honor of the Pure]
    library: []
steps:
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: enchant }
  # `p1 choose: Honor of the Pure` here fails: "no Honor of the Pure among the cards to choose".
  - p1 choose: Howling Mine
  - expect:
      p1:Indestructibility.attachedTo: p1:Howling Mine
      p2.battlefield: [Honor of the Pure]
