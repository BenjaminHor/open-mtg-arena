name: Convincing Mirage picks a host among lands put in, then a land type
rules: [CR 303.4f, CR 614.12a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, { card: Convincing Mirage, attachedTo: p1:Forest }]
    hand: [Warp World]
    manaPool: { R: 8 }
    library: []
  p2:
    battlefield: [Mountain]
    library: []
steps:
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: enchant }
  - p1 choose: Mountain
  - expect:
      pending: { player: p1, kind: chooseName }
  - p1 choose: Island
  - expect:
      p1:Convincing Mirage.attachedTo: p2:Mountain
      p2:Mountain.subtypes: [Island]
