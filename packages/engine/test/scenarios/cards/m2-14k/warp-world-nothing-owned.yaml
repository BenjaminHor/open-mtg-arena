name: p1 owns no permanents (Act of Treason resolved, Ant Queen is p2's) and still shuffles; p2 counts the token it created
rules: [CR 701.24d, CR 111.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Act of Treason, Warp World]
    manaPool: { R: 11 }
    library: []
  p2:
    battlefield: [Ant Queen]
    manaPool: { G: 2 }
    library: []
steps:
  - p1 pass: once
  - p2 activate: Ant Queen
    pay: auto
  - all pass: once
  - p1 cast: Act of Treason
    targets: [p2:Ant Queen]
    pay: auto
  - all pass: once
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: []
      p2.battlefield: [Ant Queen]
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
