name: Warp World shuffles each player's permanents into their library and puts back as many cards, here the same ones
rules: [CR 701.24a, CR 701.20a, CR 608.2c, CR 400.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Hill Giant]
    hand: [Warp World]
    manaPool: { R: 8 }
    library: []
  p2:
    battlefield: [Llanowar Elves]
    library: []
steps:
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: [Grizzly Bears, Hill Giant]
      p2.battlefield: [Llanowar Elves]
      p1.library: []
      p2.library: []
      p1.graveyard: [Warp World]
      p1:Grizzly Bears.sick: true
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }, { type: LIBRARY_SHUFFLED, player: p2 }, { type: CARDS_REVEALED }]
