name: A permanent goes to its owner's library and counts for its owner, whoever controls it (Act of Treason)
rules: [CR 108.3, CR 400.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Act of Treason, Warp World]
    manaPool: { R: 11 }
    library: []
  p2:
    battlefield: [Hill Giant]
    library: []
steps:
  - p1 cast: Act of Treason
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: []
      p2.battlefield: [Hill Giant]
      p2:Hill Giant.sick: true
