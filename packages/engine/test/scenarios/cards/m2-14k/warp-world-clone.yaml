name: A Clone put in by Warp World can't copy a creature entering with it, so it copies nothing and dies
rules: [CR 614.12a, CR 707.5, CR 704.5f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Clone, counters: { "+1/+1": 1 } }, Grizzly Bears]
    hand: [Warp World]
    manaPool: { R: 8 }
    library: []
steps:
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: copy, options: [] }
  - p1 choose: finish
  - expect:
      p1.battlefield: [Grizzly Bears]
      p1.graveyard: [Warp World, Clone]
