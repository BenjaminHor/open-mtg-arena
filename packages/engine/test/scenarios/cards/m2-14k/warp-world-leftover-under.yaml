name: A revealed card Warp World doesn't put onto the battlefield goes under the cards it didn't reveal
rules: [CR 401.4, CR 608.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Garruk Wildspeaker, counters: { loyalty: 3 } }]
    hand: [Warp World]
    manaPool: { R: 8 }
    library: [Lava Axe]
  p2:
    library: []
steps:
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      events contains: [{ type: CARDS_REVEALED, cards: [Garruk Wildspeaker] }, { type: PUT_ON_LIBRARY_BOTTOM, player: p1, count: 1 }]
      p1.library: [Lava Axe, Garruk Wildspeaker]
