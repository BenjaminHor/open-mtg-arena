name: Two Pithing Needles, AP names first
rules: [CR 101.4, CR 101.4b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Pithing Needle, chosenName: Mirror of Fate }]
    hand: [Warp World]
    manaPool: { R: 8 }
    library: []
  p2:
    battlefield: [{ card: Pithing Needle, chosenName: Mirror of Fate }]
    library: []
steps:
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseName }
  - p1 choose: Lightning Bolt
  - expect:
      pending: { player: p2, kind: chooseName }
      events contains: [{ type: NAME_CHOSEN, player: p1, object: null }]
  - p2 choose: Shock
  - expect:
      p1:Pithing Needle.chosenName: Lightning Bolt
      p2:Pithing Needle.chosenName: Shock
