name: Twincast copies Warp World; copy and original each resolve fully, counting afresh
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Ant Queen]
    hand: [Warp World]
    manaPool: { R: 8 }
    library: []
  p2:
    battlefield: [Island, Island, Hill Giant]
    hand: [Twincast]
    library: []
steps:
  - p1 cast: Warp World
    pay: auto
  - p1 pass: once
  - p2 cast: Twincast
    targets: [spell:p1:Warp World]
    pay: auto
  - all pass: once
  - expect:
      stack: [Warp World, Warp World copy]
  - all pass: once
  - expect:
      stack: [Warp World]
      p1.battlefield: [Grizzly Bears, Ant Queen]
      p2.battlefield: [Hill Giant, Island, Island]
  - all pass: once
  - expect:
      stack: []
      p1.battlefield: [Grizzly Bears, Ant Queen]
      p2.battlefield: [Hill Giant, Island, Island]
      p1.graveyard: [Warp World]
      p2.graveyard: [Twincast]
