name: Warp World counts a token its controller created, but the token isn't a card, so it isn't revealed and is gone
rules: [CR 111.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Ant Queen]
    hand: [Warp World]
    library: [Forest, Forest, Forest]
    manaPool: { R: 8, G: 2 }
steps:
  - p1 activate: Ant Queen
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: [Ant Queen, Insect Token]
  - p1 cast: Warp World
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield count: 2
      p1.library count: 2
