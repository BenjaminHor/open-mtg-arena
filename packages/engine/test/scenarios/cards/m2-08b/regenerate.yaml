name: Regenerate cast on a creature in response to Doom Blade saves it, tapped
rules: [CR 701.19a, CR 614.4]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Forest, Forest]
    hand: [Regenerate]
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - p2 cast: Doom Blade
    targets: [p1:Grizzly Bears]
    pay: auto
  - p2 pass: once
  - p1 cast: Regenerate
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      stack: []
      p1.battlefield contains: [Grizzly Bears]
      p1:Grizzly Bears.tapped: true
      p2.graveyard: [Doom Blade]
