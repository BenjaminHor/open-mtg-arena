name: A regeneration shield is used up by the first destruction; a second destroy that turn kills Cudgel Troll
rules: [CR 701.19a, CR 614.8]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Cudgel Troll, Forest]
  p2:
    battlefield: [Swamp, Swamp, Swamp, Swamp]
    hand: [Doom Blade, Doom Blade]
steps:
  - p2 pass: once
  - p1 activate: Cudgel Troll
    pay: auto
  - all pass: once
  - p2 cast: Doom Blade
    targets: [p1:Cudgel Troll]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Cudgel Troll]
      p1:Cudgel Troll.tapped: true
  - p2 cast: Doom Blade
    targets: [p1:Cudgel Troll]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Cudgel Troll]
