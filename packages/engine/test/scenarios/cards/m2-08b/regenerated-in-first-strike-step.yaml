name: An attacker regenerated in the first-strike damage step deals no regular combat damage
rules: [CR 510.4, CR 506.4, CR 701.19a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Cudgel Troll, Forest]
  p2:
    battlefield: [Lightwielder Paladin]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Cudgel Troll]
  - all pass: until combat.declareBlockers
  - p2 block: { Lightwielder Paladin: Cudgel Troll }
  - p1 activate: Cudgel Troll
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p1.battlefield contains: [Cudgel Troll]
      p2:Lightwielder Paladin.damage: 0
      events contains: [{ type: PERMANENT_REGENERATED }]
