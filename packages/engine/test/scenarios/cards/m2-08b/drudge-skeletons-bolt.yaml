name: Drudge Skeletons with a regeneration shield, dealt lethal damage, is tapped and its damage removed instead of dying
rules: [CR 701.19a, CR 614.8, CR 704.5g]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Drudge Skeletons, Swamp]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 pass: once
  - p1 activate: Drudge Skeletons
    pay: auto
  - all pass: once
  - p2 cast: Lightning Bolt
    targets: [p1:Drudge Skeletons]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Drudge Skeletons]
      p1:Drudge Skeletons.tapped: true
      p1:Drudge Skeletons.damage: 0
      p1.graveyard: []
      events contains: [{ type: PERMANENT_REGENERATED }]
