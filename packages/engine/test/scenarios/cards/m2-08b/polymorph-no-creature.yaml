name: With no creature card in the library, Polymorph reveals the whole library, which is shuffled; the creature stays destroyed
rules: [CR 701.20a, CR 701.24a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island]
    hand: [Polymorph]
  p2:
    battlefield: [Grizzly Bears]
    library: [Forest, Island]
steps:
  - p1 cast: Polymorph
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Grizzly Bears]
      p2.battlefield: []
      p2.library count: 2
      events contains: [{ type: CARDS_REVEALED }, { type: LIBRARY_SHUFFLED, player: p2 }]
