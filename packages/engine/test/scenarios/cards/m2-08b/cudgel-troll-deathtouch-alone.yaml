name: Deathtouch damage that isn't lethal still destroys, and a shield regenerates Cudgel Troll
rules: [CR 704.5h, CR 701.19a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Cudgel Troll, Forest]
  p2:
    battlefield: [Deadly Recluse]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Cudgel Troll]
  - all pass: until combat.declareBlockers
  - p2 block: { Deadly Recluse: Cudgel Troll }
  - p1 activate: Cudgel Troll
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p1.battlefield contains: [Cudgel Troll]
      p1:Cudgel Troll.damage: 0
      p2.graveyard: [Deadly Recluse]
      events contains: [{ type: PERMANENT_REGENERATED }]
