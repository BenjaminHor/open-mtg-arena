name: A regeneration shield lasts only this turn; unused, it's gone by the next turn
rules: [CR 701.19a, CR 514.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Drudge Skeletons, Swamp]
    library: [Swamp, Swamp]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
    library: [Mountain, Mountain]
steps:
  - p1 activate: Drudge Skeletons
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      active: p2
  - all pass: until main1
  - p2 cast: Lightning Bolt
    targets: [p1:Drudge Skeletons]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Drudge Skeletons]
