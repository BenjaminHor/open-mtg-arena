name: Polymorph stops at any card with the creature type, an artifact creature card too
rules: [CR 701.20a, CR 205.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island]
    hand: [Polymorph]
  p2:
    battlefield: [Grizzly Bears]
    library: [Forest, Darksteel Colossus, Island]
steps:
  - p1 cast: Polymorph
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield: [Darksteel Colossus]
      p2.library count: 2
