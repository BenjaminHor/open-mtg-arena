name: A shield doesn't follow a creature that left the battlefield and came back as a new object
rules: [CR 400.7, CR 701.19a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Forest, Forest, Forest, Forest, Island]
    hand: [Regenerate, Unsummon]
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - p1 cast: Regenerate
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 cast: Unsummon
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 cast: Grizzly Bears
    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Grizzly Bears]
      events lacks: [{ type: PERMANENT_REGENERATED }]
