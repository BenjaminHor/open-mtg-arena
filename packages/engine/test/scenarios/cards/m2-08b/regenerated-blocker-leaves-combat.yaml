name: A blocker regenerated before damage leaves combat; the attacker stays blocked and, without trample, deals no damage
rules: [CR 506.4, CR 509.1h, CR 701.19a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Craw Wurm, Mountain]
    hand: [Lightning Bolt]
  p2:
    battlefield: [Drudge Skeletons, Swamp]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p2 block: { Drudge Skeletons: Craw Wurm }
  - p1 pass: once
  - p2 activate: Drudge Skeletons
    pay: auto
  - all pass: once
  - p1 cast: Lightning Bolt
    targets: [p2:Drudge Skeletons]
    pay: auto
  - all pass: once
  - expect:
      p2:Drudge Skeletons.tapped: true
  - all pass: until main2
  - expect:
      p2.life: 20
      p1:Craw Wurm.damage: 0
      p2.battlefield contains: [Drudge Skeletons]
