name: An attacker regenerated before damage leaves combat, deals no combat damage, and is no longer an attacking creature to target
rules: [CR 506.4, CR 701.19a, CR 115.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Cudgel Troll, Forest]
  p2:
    battlefield: [Mountain, Plains, Plains, Plains, Plains]
    hand: [Lightning Bolt, Divine Verdict]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Cudgel Troll]
  - all pass: until combat.declareBlockers
  - p1 activate: Cudgel Troll
    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p1:Cudgel Troll]
    pay: auto
  - all pass: once
  - expect:
      p1:Cudgel Troll.tapped: true
  - p1 pass: once
  - p2 cast: Divine Verdict
    targets: [p1:Cudgel Troll]
  - expect error: illegalAction
  - all pass: until main2
  - expect:
      p2.life: 20
      p1.battlefield contains: [Cudgel Troll]
