name: Cudgel Troll dealt lethal damage and deathtouch damage at once is saved by one shield, and is no longer an attacking creature
rules: [CR 701.19a, CR 704.5g, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Cudgel Troll, Forest]
  p2:
    battlefield: [Deadly Recluse, Hill Giant, Plains, Plains, Plains, Plains]
    hand: [Divine Verdict]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Cudgel Troll]
  - all pass: until combat.declareBlockers
  - p2 block: { Deadly Recluse: Cudgel Troll, Hill Giant: Cudgel Troll }
  - p1 activate: Cudgel Troll
    pay: auto
  - all pass: once
  - all pass: until combat.damage
  - p1 assign: { Deadly Recluse: 2, Hill Giant: 2 }
  - expect:
      p1.battlefield contains: [Cudgel Troll]
      p1:Cudgel Troll.damage: 0
      p2.graveyard: [Deadly Recluse]
  # Out of combat now (CR 506.4): Divine Verdict can't target it as an attacking creature.
  - p1 pass: once
  - p2 cast: Divine Verdict
    targets: [p1:Cudgel Troll]
  - expect error: illegalAction
