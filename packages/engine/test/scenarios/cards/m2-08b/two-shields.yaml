name: Two regeneration shields save Drudge Skeletons twice, one at a time
rules: [CR 701.19a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Drudge Skeletons, Swamp, Swamp]
  p2:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Lightning Bolt, Lightning Bolt, Lightning Bolt]
steps:
  - p2 pass: once
  - p1 activate: Drudge Skeletons
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 activate: Drudge Skeletons
    pay: auto
  - all pass: once
  - p2 cast: Lightning Bolt
    targets: [p1:Drudge Skeletons]
    pay: auto
  - all pass: once
  - p2 cast: Lightning Bolt
    targets: [p1:Drudge Skeletons]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Drudge Skeletons]
  - p2 cast: Lightning Bolt
    targets: [p1:Drudge Skeletons]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Drudge Skeletons]
