name: A Forest made an Island by Convincing Mirage taps for blue, and is a Forest again once the Aura goes
rules: [CR 305.7, CR 305.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, { card: Convincing Mirage, attachedTo: p1:Forest, chosenLandType: Island }, Mountain, Mountain, Forest]
    hand: [Coral Merfolk, Naturalize]
steps:
  # Only the Mirage's land can pay the {U}.
  - p1 cast: Coral Merfolk
    pay: auto
  - expect:
      stack: [Coral Merfolk]
      p1:Forest.tapped: true
  - all pass: once
  - p1 cast: Naturalize
    targets: [p1:Convincing Mirage]
    pay: auto
  - all pass: once
  - expect:
      p1:Forest.subtypes: [Forest]
