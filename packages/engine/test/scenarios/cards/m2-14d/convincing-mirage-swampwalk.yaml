name: A land made a Swamp by Convincing Mirage counts for swampwalk, so the Wraith can't be blocked
rules: [CR 702.14c, CR 305.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Bog Wraith]
  p2:
    battlefield: [Grizzly Bears, Plains, { card: Convincing Mirage, attachedTo: p2:Plains, chosenLandType: Swamp }]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Bog Wraith]
  - all pass: until main2
  - expect:
      p2.life: 17
      p2:Grizzly Bears.damage: 0
