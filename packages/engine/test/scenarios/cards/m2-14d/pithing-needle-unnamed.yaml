name: A Pithing Needle naming another card doesn't stop a graveyard ability or a loyalty ability
rules: [CR 602.5, CR 113.6m, CR 606.3]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Pithing Needle, chosenName: Grizzly Bears }]
  p2:
    battlefield: [Jace Beleren, Mountain, Mountain, Mountain, Mountain, Mountain]
    graveyard: [Magma Phoenix]
steps:
  - p2 activate: graveyard:p2:Magma Phoenix
    pay: auto
  - all pass: once
  - expect:
      p2.hand contains: [Magma Phoenix]
  - p2 activate: Jace Beleren
    ability: 1
  - all pass: once
  - expect:
      p2:Jace Beleren.counters: { loyalty: 5 }
