name: Serpent of the Endless Sea can't attack when the defender's Swamp Convincing Mirage made an Island
rules: [CR 305.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Serpent of the Endless Sea, Island]
  p2:
    battlefield: [Island, { card: Convincing Mirage, attachedTo: p2:Island, chosenLandType: Swamp }]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Serpent of the Endless Sea]
  - expect error: illegalAction
