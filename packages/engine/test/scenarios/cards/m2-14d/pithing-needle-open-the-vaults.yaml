name: Two Pithing Needles returned by Open the Vaults each name a card, the active player's first, by the player each enters under
rules: [CR 614.12a, CR 101.4, CR 101.4b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains, Plains, Plains, Plains, Plains, Plains, Mountain, Mountain, Gorgon Flail, Grizzly Bears]
    hand: [Open the Vaults]
    graveyard: [Pithing Needle]
  p2:
    battlefield: [Gargoyle Castle]
    graveyard: [Pithing Needle]
steps:
  - p1 cast: Open the Vaults
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseName }
  - p1 choose: Gargoyle Castle
  # p2 knows p1's choice before making theirs (CR 101.4b).
  - expect:
      pending: { player: p2, kind: chooseName }
      events contains: [{ type: NAME_CHOSEN, player: p1, name: Gargoyle Castle }]
  - p2 choose: Gorgon Flail
  - expect:
      p1:Pithing Needle.chosenName: Gargoyle Castle
      p2:Pithing Needle.chosenName: Gorgon Flail
  # p2's Needle stops p1's Equipment; p1's stops p2's land's non-mana ability.
  - p1 activate: Gorgon Flail
  - expect error: illegalAction
  - p1 pass: once
  - p2 activate: Gargoyle Castle
    ability: 2
  - expect error: illegalAction
  - p2 activate: Gargoyle Castle
    ability: 1
  - expect:
      p2:Gargoyle Castle.tapped: true
