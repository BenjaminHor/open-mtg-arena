name: Two Convincing Mirages from Open the Vaults with p2 active, so p2 announces and chooses first
rules: [CR 613.7m, CR 101.4, CR 303.4f, CR 614.12a]
setup:
  turn: { active: p2, step: main1 }
  p2:
    battlefield: [Plains, Plains, Plains, Plains, Plains, Plains, Mountain]
    hand: [Open the Vaults]
    graveyard: [Convincing Mirage]
  p1:
    battlefield: [Forest]
    graveyard: [Convincing Mirage]
steps:
  - p2 cast: Open the Vaults
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p2, kind: chooseCards }
  - p2 choose: Forest
  - expect:
      pending: { player: p1, kind: chooseCards }
  - p1 choose: Forest
  - expect:
      pending: { player: p2, kind: chooseName }
  - p2 choose: Island
  - expect:
      pending: { player: p1, kind: chooseName }
  - p1 choose: Swamp
  - expect:
      p1:Forest.subtypes: [Swamp]
