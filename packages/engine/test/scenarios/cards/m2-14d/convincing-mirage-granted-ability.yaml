name: A land whose type Convincing Mirage set keeps abilities granted by other effects (CR 305.7)
rules: [CR 305.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest, Forest, Island, Island, Island, Gorgon Flail, Mountain, Mountain, Mountain]
    hand: [Awakener Druid, Convincing Mirage]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - p1 activate: Gorgon Flail
    targets: [p1:Forest]
    pay: auto
  - all pass: once
  - p1 cast: Convincing Mirage
    targets: [p1:Forest]
    pay: auto
  - all pass: once
  - p1 choose: Island
  - expect:
      p1:Forest.subtypes: [Treefolk, Island]
      p1:Forest.abilities contains: [deathtouch]
