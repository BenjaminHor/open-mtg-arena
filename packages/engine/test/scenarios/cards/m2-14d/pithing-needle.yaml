name: Pithing Needle's controller names a card as it enters, and that card's loyalty abilities can't be activated
rules: [CR 614.12a, CR 201.4, CR 602.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island]
    hand: [Pithing Needle]
  p2:
    battlefield: [Jace Beleren]
steps:
  - p1 cast: Pithing Needle
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseName }
  - p1 choose: Jace Beleren
  - expect:
      p1.battlefield contains: [Pithing Needle]
  - all pass: until main1
  - expect:
      active: p2
  - p2 activate: Jace Beleren
    ability: 1
  - expect error: illegalAction
