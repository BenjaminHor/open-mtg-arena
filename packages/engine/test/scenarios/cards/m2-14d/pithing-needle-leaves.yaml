name: Once Pithing Needle leaves the battlefield, the named card's abilities can be activated again (its ruling)
rules: [CR 602.5]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Pithing Needle, chosenName: Gorgon Flail }]
  p2:
    battlefield: [Gorgon Flail, Grizzly Bears, Mountain, Mountain, Mountain, Mountain]
    hand: [Shatter]
steps:
  - p2 cast: Shatter
    targets: [p1:Pithing Needle]
    pay: auto
  - all pass: once
  - p2 activate: Gorgon Flail
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2:Gorgon Flail.attachedTo: p2:Grizzly Bears
