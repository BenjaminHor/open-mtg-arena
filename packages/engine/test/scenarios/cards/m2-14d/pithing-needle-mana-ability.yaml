name: Naming a card with a mana ability and another activated ability stops only the other one (its ruling)
rules: [CR 602.5, CR 605.1a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Pithing Needle, chosenName: Gargoyle Castle }]
  p2:
    battlefield: [Gargoyle Castle, Mountain, Mountain, Mountain, Mountain, Mountain]
steps:
  - p2 activate: Gargoyle Castle
    ability: 2
  - expect error: illegalAction
  - p2 activate: Gargoyle Castle
    ability: 1
  - expect:
      p2:Gargoyle Castle.tapped: true
