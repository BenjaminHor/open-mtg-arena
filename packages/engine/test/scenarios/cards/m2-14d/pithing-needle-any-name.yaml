name: Pithing Needle may name any card, even one with no activated abilities (its ruling), but only a card's name
rules: [CR 201.4, CR 614.12a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island]
    hand: [Pithing Needle]
steps:
  - p1 cast: Pithing Needle
    pay: auto
  - all pass: once
  - p1 choose: Not A Real Card
  - expect error: illegalAction
  # A token's name only if a card has it (its ruling, CR 201.4).
  - p1 choose: Beast Token
  - expect error: illegalAction
  - p1 choose: Grizzly Bears
  - expect:
      p1.battlefield contains: [Pithing Needle]
      events contains: [{ type: ZONE_CHANGED, to: { zone: battlefield } }]
