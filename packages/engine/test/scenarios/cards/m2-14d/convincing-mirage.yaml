name: Convincing Mirage chooses a basic land type as it enters, and the enchanted land is only that type
rules: [CR 614.12a, CR 305.7, CR 613.1d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island]
    hand: [Convincing Mirage]
  p2:
    battlefield: [Forest]
steps:
  - p1 cast: Convincing Mirage
    targets: [p2:Forest]
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseName }
  - p1 choose: Swamp
  - expect:
      p2:Forest.subtypes: [Swamp]
      p2:Forest.types: [basic, land]
