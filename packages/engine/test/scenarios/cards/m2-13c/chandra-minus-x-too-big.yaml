name: X for Chandra Nalaar's -X can't be more than her loyalty (its ruling); a cancelled activation doesn't count
rules: [CR 606.6, CR 606.3, CR 734.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Chandra Nalaar]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 activate: Chandra Nalaar
    ability: 2
  - expect:
      pending: { player: p1, kind: announceX, upTo: 6 }
  - p1 choose: 7
  - expect error: illegalAction
  - p1 choose: cancel
  - p1 activate: Chandra Nalaar
    ability: 1
    targets: [p2]
  - all pass: once
  - expect:
      p2.life: 19
      p1:Chandra Nalaar.counters: { loyalty: 7 }
