name: If the planeswalker Chandra Nalaar's -8 targets is gone as it resolves, nothing happens, creatures included
rules: [CR 608.2b, CR 601.2h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Chandra Nalaar, counters: { loyalty: 9 } }]
  p2:
    battlefield: [Jace Beleren, Hill Giant, Mountain]
    hand: [Lightning Bolt]
steps:
  - p1 activate: Chandra Nalaar
    ability: 3
    targets: [p2:Jace Beleren]
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p2:Jace Beleren]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p2:Hill Giant.damage: 0
      p2.life: 20
      p1:Chandra Nalaar.counters: { loyalty: 1 }
      events contains: [{ type: ABILITY_DID_NOT_RESOLVE }]
