name: Chandra Nalaar's -X with X of 0 deals no damage, and still uses the turn's loyalty ability (its ruling)
rules: [CR 606.3, CR 107.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Chandra Nalaar]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 activate: Chandra Nalaar
    ability: 2
    x: 0
    targets: [p2:Grizzly Bears]
  - all pass: once
  - expect:
      p1:Chandra Nalaar.counters: { loyalty: 6 }
      p2:Grizzly Bears.damage: 0
  - p1 activate: Chandra Nalaar
    ability: 1
    targets: [p2]
  - expect error: illegalAction
