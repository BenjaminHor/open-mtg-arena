name: Combat damage to its controller shrinks Ajani's Avatar at once, though nothing else on the board changed
rules: [CR 604.3, CR 510.2, CR 120.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Ajani Goldmane, counters: { loyalty: 6 } }]
  p2:
    battlefield: [Hill Giant]
steps:
  - p1 activate: Ajani Goldmane
    ability: 3
  - all pass: once
  - all pass: until main1
  - all pass: until combat.declareAttackers
  - p2 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p1 block: {}
  - all pass: until combat.end
  - expect:
      p1.life: 17
      p1:Avatar Token.power: 17
