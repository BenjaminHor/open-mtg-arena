name: Ajani Goldmane's Avatar token is as big as your life total, and changes with it; damage marked can then be lethal
rules: [CR 604.3, CR 613.4a, CR 111.3, CR 704.5g, CR 704.5i]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 3
    battlefield: [{ card: Ajani Goldmane, counters: { loyalty: 6 } }, Mountain, Mountain]
    hand: [Shock, Shock]
steps:
  - p1 activate: Ajani Goldmane
    ability: 3
  - all pass: once
  - expect:
      p1.graveyard: [Ajani Goldmane]
      p1.battlefield contains: [Avatar Token]
      p1:Avatar Token.power: 3
      p1:Avatar Token.toughness: 3
      p1:Avatar Token.colors: [W]
  - p1 cast: Shock
    targets: [p1:Avatar Token]
    pay: auto
  - all pass: once
  - expect:
      p1:Avatar Token.damage: 2
  # Down to 1 life, the Avatar is 1/1 with 2 damage marked: it dies (CR 704.5g).
  - p1 cast: Shock
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.life: 1
      p1.battlefield: [Mountain, Mountain]
