name: Chandra Nalaar at 8 can target herself with her -8, but she's gone as it resolves, so it does nothing
rules: [CR 601.2c, CR 601.2h, CR 608.2b, CR 704.5i]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Chandra Nalaar, counters: { loyalty: 8 } }, Grizzly Bears]
steps:
  - p1 activate: Chandra Nalaar
    ability: 3
    targets: [p1:Chandra Nalaar]
  - expect:
      p1.graveyard: [Chandra Nalaar]
  - all pass: once
  - expect:
      p1:Grizzly Bears.damage: 0
      p1.life: 20
      events contains: [{ type: ABILITY_DID_NOT_RESOLVE }]
