name: Liliana Vess's +1 makes the target player discard a card of their choice
rules: [CR 606.4, CR 701.9b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Liliana Vess]
  p2:
    hand: [Shock, Forest]
steps:
  - p1 activate: Liliana Vess
    ability: 1
    targets: [p2]
  - all pass: once
  - expect:
      pending: { player: p2, kind: chooseCards, purpose: discard }
  - p2 choose: Shock
  - expect:
      p2.graveyard: [Shock]
      p2.hand: [Forest]
      p1:Liliana Vess.counters: { loyalty: 6 }
