name: Mesa Enchantress draws a card when its controller casts an enchantment spell, even if that spell is then countered
rules: [CR 601.2i, CR 603.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mesa Enchantress, Forest, Forest, Forest, Forest, Forest, Forest]
    hand: [Lurking Predators]
    library: [Plains]
  p2:
    battlefield: [Island, Island, Island]
    hand: [Cancel]
steps:
  - p1 cast: Lurking Predators
    pay: auto
  - expect:
      stack: [Lurking Predators, Mesa Enchantress ability]
  - p1 pass: once
  - p2 cast: Cancel
    targets: [spell:p1:Lurking Predators]
    pay: auto
  - expect:
      stack: [Lurking Predators, Mesa Enchantress ability, Cancel]
  - all pass: once
  - expect:
      stack: [Mesa Enchantress ability]
      p1.graveyard: [Lurking Predators]
  - all pass: once
  - p1 choose: yes
  - expect:
      p1.hand: [Plains]
