name: A discard to hand size triggers Megrim, so the cleanup step gives priority, then another cleanup step begins
rules: [CR 514.1, CR 514.3a]
setup:
  turn: { active: p2, step: end }
  p1:
    battlefield: [Megrim]
  p2:
    hand: [Forest, Forest, Forest, Island, Island, Island, Swamp, Swamp]
steps:
  - all pass: once
  - expect:
      step: cleanup
      pending: { player: p2, kind: discardToHandSize }
  - p2 choose: Swamp
  - expect:
      step: cleanup
      stack: [Megrim ability]
      pending: { player: p2, kind: priority }
  - all pass: once
  - expect:
      p2.life: 18
      step: cleanup
  - all pass: once
  - expect:
      active: p1
