name: Lightwielder Paladin's first-strike trigger exiles the creature blocking another attacker before regular damage, which stays blocked
rules: [CR 510.4, CR 509.1h, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Lightwielder Paladin, Grizzly Bears]
  p2:
    battlefield: [Raging Goblin]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Lightwielder Paladin, Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Raging Goblin: Grizzly Bears }
  - all pass: once
  - p1 choose: p2:Raging Goblin
  - all pass: once
  - p1 choose: yes
  - all pass: once
  - expect:
      exile: [Raging Goblin]
      p2.life: 16
      p1.battlefield contains: [Grizzly Bears]
