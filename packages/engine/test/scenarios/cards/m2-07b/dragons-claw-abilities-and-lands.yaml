name: Dragon's Claw doesn't trigger on activating a red creature's ability or playing a land; only a cast spell does
rules: [CR 601.2i, CR 602.2b, CR 305.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Dragon's Claw, Furnace Whelp, Mountain]
    hand: [Mountain]
steps:
  - p1 play: Mountain
  - p1 activate: Furnace Whelp
    pay: auto
  - expect:
      stack: [Furnace Whelp ability]
      events lacks: [{ type: ABILITY_TRIGGERED }]
