name: Lightwielder Paladin's first-strike damage triggers it before regular damage; it may exile a red permanent that player controls
rules: [CR 510.4, CR 603.3d, CR 603.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Lightwielder Paladin, Grizzly Bears]
  p2:
    battlefield: [Raging Goblin, Mountain]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Lightwielder Paladin, Grizzly Bears]
  - all pass: until combat.declareBlockers
  - all pass: once
  - expect:
      p2.life: 16
      pending: { player: p1, kind: chooseTarget }
  - p1 choose: p2:Raging Goblin
  - expect:
      stack: [Lightwielder Paladin ability]
  - all pass: once
  - p1 choose: yes
  - expect:
      exile: [Raging Goblin]
      p2.life: 16
  - all pass: once
  - expect:
      p2.life: 14
