name: Wurm's Tooth doesn't trigger on a red spell; Dragon's Claw does
rules: [CR 603.2, CR 105.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Wurm's Tooth, Dragon's Claw, Mountain]
    hand: [Lightning Bolt]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - expect:
      stack: [Lightning Bolt, Dragon's Claw ability]
