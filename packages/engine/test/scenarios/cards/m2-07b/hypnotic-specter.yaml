name: Hypnotic Specter dealing combat damage to an opponent makes that player discard a card at random
rules: [CR 510.2, CR 603.2, CR 701.9b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hypnotic Specter]
  p2:
    hand: [Forest, Island, Swamp]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hypnotic Specter]
  - all pass: until combat.damage
  - expect:
      p2.life: 18
      stack: [Hypnotic Specter ability]
  - all pass: once
  - expect:
      p2.hand count: 2
      p2.graveyard count: 1
      events contains: [{ type: CARD_DISCARDED, player: p2 }]
