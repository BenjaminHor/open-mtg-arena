name: A revealed noncreature card not put on the bottom stays on top of the library
rules: [CR 701.20b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Lurking Predators]
    library: [Island, Forest]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - all pass: once
  - p1 choose: no
  - expect:
      p1.library: [Island, Forest]
