name: Lurking Predators reveals a noncreature card, and its controller may put it on the bottom of their library
rules: [CR 701.20b, CR 608.2d]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Lurking Predators]
    library: [Island, Forest, Craw Wurm]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseYesNo }
  - p1 choose: yes
  - expect:
      p1.library: [Forest, Craw Wurm, Island]
      stack: [Lightning Bolt]
