name: Kraken's Eye's trigger from Cancel resolves first; Angel's Feather and Demon's Horn don't trigger on a blue spell
rules: [CR 601.2i, CR 603.3b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Kraken's Eye, Angel's Feather, Demon's Horn, Island, Island, Island]
    hand: [Cancel]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - expect:
      stack: [Lightning Bolt]
  - p2 pass: once
  - p1 cast: Cancel
    targets: [spell:p2:Lightning Bolt]
    pay: auto
  - expect:
      stack: [Lightning Bolt, Cancel, Kraken's Eye ability]
  - all pass: once
  - p1 choose: yes
  - all pass: once
  - expect:
      p1.life: 21
      stack: []
      p2.graveyard: [Lightning Bolt]
