name: With no black or red permanent for that player (a land is colorless), Lightwielder Paladin's trigger is removed
rules: [CR 603.3d, CR 105.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Lightwielder Paladin]
  p2:
    battlefield: [Mountain, Swamp, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Lightwielder Paladin]
  - all pass: until combat.declareBlockers
  - all pass: once
  - expect:
      p2.life: 16
      stack: []
      pending: { player: p1, kind: priority }
