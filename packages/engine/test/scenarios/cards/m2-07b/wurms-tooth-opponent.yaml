name: Wurm's Tooth triggers on any player's green spell, and its controller gains the life
rules: [CR 603.2, CR 603.3a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Wurm's Tooth]
  p2:
    battlefield: [Forest, Forest]
    hand: [Grizzly Bears]
steps:
  - p2 cast: Grizzly Bears
    pay: auto
  - expect:
      stack: [Grizzly Bears, Wurm's Tooth ability]
  - all pass: once
  - p1 choose: yes
  - expect:
      p1.life: 21
      p2.life: 20
