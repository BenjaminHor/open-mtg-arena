name: Wurm's Tooth triggers as a green spell becomes cast, goes on the stack above it and resolves first
rules: [CR 601.2i, CR 603.3, CR 603.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Wurm's Tooth, Forest, Forest]
    hand: [Grizzly Bears]
steps:
  - p1 cast: Grizzly Bears
    pay: auto
  - expect:
      stack: [Grizzly Bears, Wurm's Tooth ability]
      pending: { player: p1, kind: priority }
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseYesNo }
  - p1 choose: yes
  - expect:
      p1.life: 21
      stack: [Grizzly Bears]
