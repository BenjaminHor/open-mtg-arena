name: Megrim deals 2 damage for each card an opponent discards
rules: [CR 603.2c, CR 701.9a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Megrim, Swamp, Swamp, Swamp]
    hand: [Mind Rot]
  p2:
    hand: [Forest, Island]
steps:
  - p1 cast: Mind Rot
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Island, Forest]
      stack: [Megrim ability, Megrim ability]
  - all pass: once
  - all pass: once
  - expect:
      p2.life: 16
