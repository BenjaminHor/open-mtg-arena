name: Two creatures with lifelink dealing combat damage together are two life-gain events, so Sanguine Bond triggers twice
rules: [CR 702.15b, CR 603.2c, CR 510.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Sanguine Bond, Child of Night, Child of Night]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Child of Night, Child of Night#2]
  - all pass: until combat.declareBlockers
  - all pass: once
  - expect:
      p1.life: 24
      p2.life: 16
      pending: { player: p1, kind: chooseTarget }
  - p1 choose: p2
  - p1 choose: p2
  - expect:
      stack: [Sanguine Bond ability, Sanguine Bond ability]
  - all pass: once
  - all pass: once
  - expect:
      p2.life: 12
