name: Ignite Disorder with one target deals all 3 damage to it, with no division to announce
rules: [CR 601.2c, CR 601.2d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ignite Disorder]
    battlefield: [Mountain, Mountain]
  p2:
    battlefield: [Elite Vanguard, Coral Merfolk]
steps:
  - p1 cast: Ignite Disorder
    targets: [p2:Coral Merfolk]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Coral Merfolk]
      p2.battlefield: [Elite Vanguard]
      events contains: [{ type: DAMAGE_DEALT, amount: 3 }]
