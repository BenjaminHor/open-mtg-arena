name: A target of a division can't be given 0, even when the rest still adds up
rules: [CR 601.2d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ignite Disorder]
    battlefield: [Mountain, Mountain]
  p2:
    battlefield: [Elite Vanguard, Coral Merfolk]
steps:
  - p1 cast: Ignite Disorder
    targets: [[p2:Elite Vanguard, p2:Coral Merfolk]]
    divide: [0, 3]
    pay: auto
  - expect error: illegalAction
