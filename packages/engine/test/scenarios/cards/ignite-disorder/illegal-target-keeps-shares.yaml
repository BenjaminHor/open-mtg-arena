name: When one of Ignite Disorder's targets becomes illegal, its share is lost and the other keeps its own share
rules: [CR 601.2d, CR 608.2b, CR 115.7f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ignite Disorder]
    battlefield: [Mountain, Mountain]
  p2:
    hand: [Shock]
    battlefield: [Elite Vanguard, Coral Merfolk, Mountain]
steps:
  - p1 cast: Ignite Disorder
    targets: [[p2:Elite Vanguard, p2:Coral Merfolk]]
    divide: [1, 2]
    pay: auto
  - p1 pass: once
  - p2 cast: Shock
    targets: [p2:Elite Vanguard]
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield: [Coral Merfolk, Mountain]
  - all pass: once
  # Coral Merfolk is dealt its own 2, not Elite Vanguard's 1, and not the whole 3.
  - expect:
      p2.battlefield: [Mountain]
      events contains: [{ type: DAMAGE_DEALT, amount: 2 }]
