name: When both of Ignite Disorder's targets become illegal, it doesn't resolve
rules: [CR 608.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ignite Disorder]
    battlefield: [Mountain, Mountain]
  p2:
    hand: [Shock, Shock]
    battlefield: [Elite Vanguard, Coral Merfolk, Mountain, Mountain]
steps:
  - p1 cast: Ignite Disorder
    targets: [[p2:Elite Vanguard, p2:Coral Merfolk]]
    divide: [1, 2]
    pay: auto
  - p1 pass: once
  - p2 cast: Shock
    targets: [p2:Elite Vanguard]
    pay: auto
  - p2 cast: Shock
    targets: [p2:Coral Merfolk]
    pay: auto
  - all pass: once
  - all pass: once
  - all pass: once
  - expect:
      p1.graveyard: [Ignite Disorder]
      events contains: [{ type: SPELL_DID_NOT_RESOLVE }]
