name: Ignite Disorder's 3 damage is divided as its caster announces, among three white and/or blue creatures
rules: [CR 601.2c, CR 601.2d, CR 115.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ignite Disorder]
    battlefield: [Mountain, Mountain]
  p2:
    battlefield: [Elite Vanguard, Elite Vanguard, Coral Merfolk]
steps:
  - p1 cast: Ignite Disorder
    targets: [[p2:Elite Vanguard, p2:Elite Vanguard#2, p2:Coral Merfolk]]
    divide: [1, 1, 1]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Elite Vanguard, Elite Vanguard, Coral Merfolk]
