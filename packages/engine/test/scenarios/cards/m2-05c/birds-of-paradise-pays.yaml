name: Birds of Paradise pays a cost with the color it needs, while the cost is being paid
rules: [CR 605.3a, CR 601.2g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Unsummon]
    battlefield: [Birds of Paradise, Forest, Forest]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Unsummon
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.hand: [Grizzly Bears]
      p1:Birds of Paradise.tapped: true
