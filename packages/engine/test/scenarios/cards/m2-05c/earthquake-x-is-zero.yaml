name: Earthquake with X of 0 deals no damage at all
rules: [CR 120.8]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Earthquake]
    battlefield: [Mountain, Grizzly Bears]
steps:
  - p1 cast: Earthquake
    x: 0
    pay: auto
  - all pass: once
  - expect:
      events lacks: [{ type: DAMAGE_DEALT }]
      p1.life: 20
