name: Acolyte of Xathrid can make its own controller lose 1 life
rules: [CR 115.1c, CR 119.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Acolyte of Xathrid, Swamp, Swamp]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 activate: Acolyte of Xathrid
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.life: 19
      events contains: [{ type: LIFE_LOST, player: p1, amount: 1 }]
