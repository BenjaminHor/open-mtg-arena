name: Earthquake that brings both players to 0 life makes the game a draw
rules: [CR 704.5a, CR 104.4a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 3
    hand: [Earthquake]
    battlefield: [Mountain, Mountain, Mountain, Mountain]
  p2:
    life: 3
steps:
  - p1 cast: Earthquake
    x: 3
    pay: auto
  - all pass: once
  - expect:
      winner: draw
