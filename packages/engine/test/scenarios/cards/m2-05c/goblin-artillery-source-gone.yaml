name: Goblin Artillery's ability still deals its damage after the Artillery is destroyed in response
rules: [CR 113.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Goblin Artillery]
  p2:
    hand: [Doom Blade]
    battlefield: [Swamp, Swamp]
steps:
  - p1 activate: Goblin Artillery
    targets: [p2]
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Goblin Artillery]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p2.life: 18
      p1.life: 17
