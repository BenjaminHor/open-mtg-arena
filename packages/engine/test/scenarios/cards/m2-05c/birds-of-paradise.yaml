name: Birds of Paradise adds one mana of the color chosen as it's activated, and it doesn't use the stack
rules: [CR 106.1a, CR 605.3b, CR 608.2d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Birds of Paradise]
steps:
  - p1 activate: Birds of Paradise
    color: U
  - expect:
      p1.manaPool: { U: 1 }
      p1:Birds of Paradise.tapped: true
      stack: []
      pending: { player: p1, kind: priority }
