name: A summoning-sick Birds of Paradise can't tap for mana, and Windstorm can destroy it, as it has flying
rules: [CR 302.6, CR 702.9a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Windstorm]
    battlefield: [{ card: Birds of Paradise, sick: true }, Forest, Forest]
steps:
  - p1 activate: Birds of Paradise
    color: G
  - expect error: illegalAction
  - p1 cast: Windstorm
    x: 1
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Birds of Paradise]
