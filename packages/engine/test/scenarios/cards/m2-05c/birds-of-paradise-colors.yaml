name: Birds of Paradise's mana is one of the five colors, never colorless nor none, and other abilities take no color
rules: [CR 105.4, CR 105.1, CR 106.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Birds of Paradise, Forest, Merfolk Looter]
steps:
  - p1 activate: Birds of Paradise
    color: C
  - expect error: illegalAction
  - p1 activate: Birds of Paradise
  - expect error: illegalAction
  - p1 activate: Forest
    color: U
  - expect error: illegalAction
  - p1 activate: Merfolk Looter
    color: U
  - expect error: illegalAction
