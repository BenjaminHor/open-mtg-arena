name: Birds of Paradise's mana is one of the five colors, never colorless, and a Forest takes no color
rules: [CR 106.1a, CR 106.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Birds of Paradise, Forest]
steps:
  - p1 activate: Birds of Paradise
    color: C
  - expect error: illegalAction
  - p1 activate: Forest
    color: U
  - expect error: illegalAction
