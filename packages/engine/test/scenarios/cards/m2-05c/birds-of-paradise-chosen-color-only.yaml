name: Birds of Paradise's mana is the color chosen, so red mana can't pay a blue cost
rules: [CR 106.1a, CR 601.2h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Unsummon]
    battlefield: [Birds of Paradise]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Unsummon
    targets: [p2:Grizzly Bears]
  - p1 activate: Birds of Paradise
    color: R
  - expect:
      p1.manaPool: { R: 1 }
  - p1 choose: { U: 1 }
  - expect error: illegalAction
