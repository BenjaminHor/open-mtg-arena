name: Yawning Fissure on an opponent with one land sacrifices it with nothing to choose, and with none does nothing
rules: [CR 609.3, CR 701.21a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Yawning Fissure, Yawning Fissure]
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain]
  p2:
    battlefield: [Forest, Grizzly Bears]
steps:
  - p1 cast: Yawning Fissure
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield: [Grizzly Bears]
      p2.graveyard: [Forest]
      events contains: [{ type: PERMANENT_SACRIFICED, player: p2 }]
      pending: { player: p1, kind: priority }
  - p1 cast: Yawning Fissure
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield: [Grizzly Bears]
      events lacks: [{ type: PERMANENT_SACRIFICED }]
