name: Consume Spirit with X of 2 can't be paid with one black mana and other colors for X
rules: [CR 601.2h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Consume Spirit]
    manaPool: { B: 2, R: 2 }
steps:
  - p1 cast: Consume Spirit
    x: 2
    targets: [p2]
  - p1 choose: { B: 2, R: 2 }
  - expect error: illegalAction
