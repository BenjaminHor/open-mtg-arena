name: Consume Spirit's X can't be paid with red mana, only black
rules: [CR 601.2h, CR 101.1]
# X of 1 costs {B}{1}{B} to pay: one black for X, one for the {B}, and any mana for the {1}.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Consume Spirit]
    manaPool: { B: 2, R: 2 }
steps:
  - p1 cast: Consume Spirit
    x: 1
    targets: [p2]
  - p1 choose: { B: 1, R: 2 }
  - expect error: illegalAction
  - p1 choose: { B: 2, R: 1 }
  - all pass: once
  - expect:
      p2.life: 19
