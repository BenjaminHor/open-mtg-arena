name: Only the opponent answers Yawning Fissure's choice, and they pick which copy goes
rules: [CR 701.21a, CR 102.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Yawning Fissure]
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain]
  p2:
    battlefield: [{ card: Forest, tapped: true }, Forest]
steps:
  - p1 cast: Yawning Fissure
    pay: auto
  - all pass: once
  - p1 choose: Forest
  - expect error: notYourDecision
  - p2 choose: Forest#2
  - expect:
      p2.battlefield: [Forest]
      p2:Forest.tapped: true
