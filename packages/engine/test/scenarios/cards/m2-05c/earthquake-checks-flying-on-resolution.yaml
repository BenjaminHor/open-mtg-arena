name: Earthquake checks for flying as it resolves, so a creature put onto the battlefield in response is dealt damage
rules: [CR 608.2h]
# Earthquake's ruling: whether a creature is without flying is only checked on resolution.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Earthquake, Llanowar Elves]
    battlefield: [Mountain, Mountain, Mountain, Elvish Piper, Forest]
steps:
  - p1 cast: Earthquake
    x: 2
    pay: auto
  - p1 activate: Elvish Piper
    pay: auto
  - all pass: once
  - p1 choose: Llanowar Elves
  - expect:
      p1.battlefield contains: [Llanowar Elves]
  - all pass: once
  - expect:
      p1.graveyard contains: [Llanowar Elves, Elvish Piper]
