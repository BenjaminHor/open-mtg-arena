name: Birds of Paradise tapped for mana during a cast that's then cancelled untaps, and the mana is gone
rules: [CR 734.1, CR 605.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Unsummon]
    battlefield: [Birds of Paradise]
  p2:
    battlefield: [Grizzly Bears]
steps:
