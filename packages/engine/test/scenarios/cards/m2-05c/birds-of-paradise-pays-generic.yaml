name: Birds of Paradise can pay generic mana too, after the lands
rules: [CR 107.4b, CR 601.2g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Divination]
    battlefield: [Birds of Paradise, Island, Forest]
steps:
  - p1 cast: Divination
    pay: auto
  - all pass: once
  - expect:
      p1:Birds of Paradise.tapped: true
      p1.hand count: 2
