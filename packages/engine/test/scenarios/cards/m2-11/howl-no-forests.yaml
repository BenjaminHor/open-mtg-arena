name: Howl of the Night Pack with no Forests makes no Wolves (the Forests are counted as it resolves)
rules: [CR 608.2h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Llanowar Elves]
    hand: [Howl of the Night Pack]
steps:
  - p1 cast: Howl of the Night Pack
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield count: 7
      p1.graveyard: [Howl of the Night Pack]
      events lacks: [{ type: TOKEN_CREATED }]
