name: A token created this turn can't attack (summoning sickness), but it can on its controller's next turn
rules: [CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Ant Queen, Forest, Forest]
steps:
  - p1 activate: Ant Queen
    pay: auto
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Insect Token]
  - expect error: illegalAction
  - p1 attack: []
  - all pass: until main1
  - all pass: until main1
  - all pass: until combat.declareAttackers
  - p1 attack: [Insect Token]
  - all pass: until main2
  - expect:
      p2.life: 19
