name: A token put on top of its owner's library ceases to exist there, and the library is as it was
rules: [CR 704.5d, CR 400.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Ant Queen, Forest, Forest, Plains, Plains, Plains]
    hand: [Excommunicate]
    library: [Island, Island]
steps:
  - p1 activate: Ant Queen
    pay: auto
  - all pass: once
  - p1 cast: Excommunicate
    targets: [p1:Insect Token]
    pay: auto
  - all pass: once
  - expect:
      p1.library count: 2
      events contains: [{ type: TOKEN_CEASED_TO_EXIST, from: { zone: library, player: p1 } }]
