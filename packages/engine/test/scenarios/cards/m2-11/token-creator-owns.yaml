name: The player who creates a token owns it, not the owner of the source; it stays theirs when the source goes back
rules: [CR 111.2]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Ant Queen]
  p2:
    battlefield: [Mountain, Mountain, Mountain, Forest, Forest]
    hand: [Act of Treason]
steps:
  - p2 cast: Act of Treason
    targets: [p1:Ant Queen]
    pay: auto
  - all pass: once
  - p2 activate: Ant Queen
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield contains: [Ant Queen, Insect Token]
      events contains: [{ type: TOKEN_CREATED, player: p2 }]
  - all pass: until main1
  - expect:
      p1.battlefield: [Ant Queen]
      p2.battlefield contains: [Insect Token]
