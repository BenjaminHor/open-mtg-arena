name: White Knight can't be the target of a black spell; another white creature can
rules: [CR 702.16b, CR 601.2c]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [White Knight, Serra Angel]
  p2:
    battlefield: [Swamp]
    hand: [Deathmark]
steps:
  - p2 cast: Deathmark
    targets: [p1:White Knight]
    pay: auto
  - expect error: illegalAction
  - p2 cast: Deathmark
    targets: [p1:Serra Angel]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Serra Angel]
      p1.battlefield contains: [White Knight]
