name: Fog and White Knight's protection both apply to a black attacker's damage to it; its controller chooses which first
rules: [CR 616.1, CR 702.16e]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [White Knight, Forest]
    hand: [Fog]
  p2:
    battlefield: [Bog Wraith]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Bog Wraith]
  - all pass: until combat.declareBlockers
  - p1 block: { White Knight: Bog Wraith }
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  # First strike: Fog alone prevents the Knight's damage to the Wraith. Then the Wraith's damage: Fog and protection.
  - all pass: once
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: protection
  - expect:
      p1:White Knight.damage: 0
      p2:Bog Wraith.damage: 0
