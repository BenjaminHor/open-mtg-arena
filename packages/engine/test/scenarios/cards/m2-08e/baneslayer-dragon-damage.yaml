name: Baneslayer Angel may block a Dragon; its first strike kills the Dragon before it deals damage, and lifelink gains 5
rules: [CR 702.16f, CR 702.7b, CR 702.15b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Baneslayer Angel]
  p2:
    battlefield: [Shivan Dragon]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Shivan Dragon]
  - all pass: until combat.declareBlockers
  - p1 block: { Baneslayer Angel: Shivan Dragon }
  - all pass: until main2
  # Protection doesn't stop Baneslayer blocking a Dragon (CR 702.16f is about blocking it). No Dragon in the pool
  # survives its first strike; baneslayer-demon-trample shows its damage prevention, with a Demon.
  - expect:
      p1:Baneslayer Angel.damage: 0
      p2.graveyard: [Shivan Dragon]
      p1.life: 25
