name: A Dragon's damage to Baneslayer Angel is prevented; Baneslayer's first strike and lifelink still work
rules: [CR 702.16e, CR 702.16a, CR 702.15b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Baneslayer Angel]
  p2:
    battlefield: [Shivan Dragon]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Shivan Dragon]
  - all pass: until combat.declareBlockers
  - p1 block: { Baneslayer Angel: Shivan Dragon }
  - all pass: until main2
  - expect:
      p1:Baneslayer Angel.damage: 0
      p2.graveyard: [Shivan Dragon]
      p1.life: 25
