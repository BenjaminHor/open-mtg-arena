name: Great Sable Stag can't be the target of a blue spell or a black one; a red one can target it
rules: [CR 702.16b, CR 702.16g]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Great Sable Stag]
  p2:
    battlefield: [Island, Swamp, Mountain]
    hand: [Unsummon, Tendrils of Corruption, Shock]
steps:
  - p2 cast: Unsummon
    targets: [p1:Great Sable Stag]
    pay: auto
  - expect error: illegalAction
  - p2 cast: Tendrils of Corruption
    targets: [p1:Great Sable Stag]
    pay: auto
  - expect error: illegalAction
  - p2 cast: Shock
    targets: [p1:Great Sable Stag]
    pay: auto
  - all pass: once
  - expect:
      p1:Great Sable Stag.damage: 2
