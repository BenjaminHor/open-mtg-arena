name: An attacking White Knight can't be blocked by a black creature; a nonblack one can block it
rules: [CR 702.16f, CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [White Knight]
  p2:
    battlefield: [Child of Night, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [White Knight]
  - all pass: until combat.declareBlockers
  - p2 block: { Child of Night: White Knight }
  - expect error: illegalAction
  - p2 block: { Grizzly Bears: White Knight }
  - all pass: until main2
  - expect:
      p2.graveyard: [Grizzly Bears]
      p1:White Knight.damage: 0
