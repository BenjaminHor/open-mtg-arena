name: Black Knight can't be the target of a white spell (Divine Verdict), even while attacking
rules: [CR 702.16b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Black Knight]
  p2:
    battlefield: [Plains, Plains, Plains, Plains]
    hand: [Divine Verdict]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Black Knight]
  - all pass: until combat.declareBlockers
  - p1 pass: once
  - p2 cast: Divine Verdict
    targets: [p1:Black Knight]
    pay: auto
  - expect error: illegalAction
