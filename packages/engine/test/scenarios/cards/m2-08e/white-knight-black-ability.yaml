name: White Knight can't be the target of an ability whose source is black (Royal Assassin)
rules: [CR 702.16b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [White Knight, Grizzly Bears]
  p2:
    battlefield: [Royal Assassin]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [White Knight, Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: {}
  - p1 pass: once
  - p2 activate: Royal Assassin
    targets: [p1:White Knight]
  - expect error: illegalAction
  - p2 activate: Royal Assassin
    targets: [p1:Grizzly Bears]
  - all pass: once
  - expect:
      p1.graveyard: [Grizzly Bears]
