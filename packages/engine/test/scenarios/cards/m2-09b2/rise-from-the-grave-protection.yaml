name: A creature Rise from the Grave made black can't block White Knight, which has protection from black
rules: [CR 702.16f, CR 613.1e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Rise from the Grave]
    manaPool: { B: 5 }
  p2:
    battlefield: [White Knight]
    graveyard: [Grizzly Bears]
steps:
  - p1 cast: Rise from the Grave
    targets: [graveyard:p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - all pass: until combat.declareAttackers
  - p2 attack: [White Knight]
  - all pass: until combat.declareBlockers
  # No block is possible, so p1 isn't even asked to declare blockers.
  - expect:
      pending: { player: p2, kind: priority }
  - all pass: until main2
  - expect:
      p1.life: 18
