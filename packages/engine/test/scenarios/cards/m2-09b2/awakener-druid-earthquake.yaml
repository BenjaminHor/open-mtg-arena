name: Awakener Druid and its Treefolk dealt lethal damage at once are both destroyed (its ruling)
rules: [CR 704.3, CR 704.5g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest]
    hand: [Awakener Druid]
    manaPool: { G: 3 }
  p2:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain]
    hand: [Earthquake]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - all pass: until upkeep
  - all pass: until main1
  - p2 cast: Earthquake
    x: 5
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Awakener Druid, Forest]
