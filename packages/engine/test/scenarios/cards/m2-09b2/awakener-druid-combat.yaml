name: An attacking Treefolk Forest is removed from combat when the Druid dies, as it stops being a creature
rules: [CR 506.4, CR 611.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest]
    hand: [Awakener Druid]
    manaPool: { G: 3 }
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Forest]
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Awakener Druid]
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p2.life: 20
