name: Static abilities find what they apply to after types and colors change, so they reach an animated Forest and a risen white creature turned black
rules: [CR 611.3a, CR 613.1d, CR 613.1e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Levitation, Honor of the Pure]
    hand: [Awakener Druid, Rise from the Grave]
    manaPool: { G: 3, B: 5 }
  p2:
    graveyard: [White Knight]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - p1 cast: Rise from the Grave
    targets: [graveyard:p2:White Knight]
    pay: auto
  - all pass: once
  - expect:
      p1:Forest.abilities contains: [flying]
      p1:Forest.power: 4
      p1:White Knight.colors: [W, B]
      p1:White Knight.power: 3
      p1:White Knight.abilities contains: [flying]
