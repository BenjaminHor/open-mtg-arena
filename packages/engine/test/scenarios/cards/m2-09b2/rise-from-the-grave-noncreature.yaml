name: Rise from the Grave can't target a noncreature card in a graveyard
rules: [CR 115.2, CR 601.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Rise from the Grave]
    graveyard: [Shock]
    manaPool: { B: 5 }
steps:
  - p1 cast: Rise from the Grave
    targets: [graveyard:p1:Shock]
    pay: auto
  - expect error: illegalAction
