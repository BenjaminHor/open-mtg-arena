    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield: []
      p2.graveyard contains: [Grizzly Bears, Shock]
