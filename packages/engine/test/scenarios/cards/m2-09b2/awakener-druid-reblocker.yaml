name: A blocking Forest removed from combat as it stopped being a creature stays out when a second Druid animates it again
rules: [CR 506.4, CR 509.1h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Elvish Piper, Birds of Paradise]
    hand: [Awakener Druid, Awakener Druid]
    manaPool: { G: 3 }
  p2:
    battlefield: [Grizzly Bears, Mountain]
    hand: [Shock]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - all pass: until upkeep
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p1 block: { Forest: Grizzly Bears }
  - p2 cast: Shock
    targets: [p1:Awakener Druid]
    pay: auto
  - all pass: once
  # Still in the declare blockers step: Elvish Piper puts the second Druid in, animating the Forest again.
  - p2 pass: once
  - p1 activate: Birds of Paradise
    color: G
  - p1 activate: Elvish Piper
    pay: auto
  - all pass: once
  - p1 choose: Awakener Druid
  - p1 choose: p1:Forest
  - all pass: once
  - expect:
      p1:Forest.power: 4
  - all pass: until main2
  - expect:
      p2:Grizzly Bears.damage: 0
      p1:Forest.damage: 0
      p1.life: 20
