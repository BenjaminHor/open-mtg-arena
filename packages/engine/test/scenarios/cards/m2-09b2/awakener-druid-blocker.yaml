name: A blocking Treefolk Forest is removed from combat when the Druid dies; the attacker stays blocked and deals no damage
rules: [CR 506.4, CR 509.1h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest]
    hand: [Awakener Druid]
    manaPool: { G: 3 }
  p2:
    battlefield: [Grizzly Bears, Mountain]
    hand: [Shock]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - all pass: until upkeep
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p1 block: { Forest: Grizzly Bears }
  - p2 cast: Shock
    targets: [p1:Awakener Druid]
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p1.life: 20
      p2:Grizzly Bears.damage: 0
      p1:Forest.damage: 0
