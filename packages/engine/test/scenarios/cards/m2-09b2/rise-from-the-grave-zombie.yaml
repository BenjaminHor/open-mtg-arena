name: A creature Rise from the Grave returned is a Zombie, so Undead Slayer can exile it, though not a creature that isn't one
rules: [CR 613.1d, CR 115.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Runeclaw Bear]
    hand: [Rise from the Grave]
    manaPool: { B: 5 }
  p2:
    battlefield: [Undead Slayer, Plains]
    graveyard: [Grizzly Bears]
steps:
  - p1 cast: Rise from the Grave
    targets: [graveyard:p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 activate: Undead Slayer
    targets: [p1:Runeclaw Bear]
    pay: auto
  - expect error: illegalAction
  - p2 activate: Undead Slayer
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      exile: [Grizzly Bears]
