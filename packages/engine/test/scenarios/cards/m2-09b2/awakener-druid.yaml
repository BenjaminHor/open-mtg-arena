name: Awakener Druid's Forest becomes a 4/5 green Treefolk creature that's still a land and still taps for {G}
rules: [CR 613.1d, CR 613.1e, CR 613.4b, CR 205.1b, CR 305.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest]
    hand: [Awakener Druid]
    manaPool: { G: 3 }
  p2:
    battlefield: [Forest]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - expect:
      p1:Forest.power: 4
      p1:Forest.toughness: 5
      p1:Forest.types: [basic, land, creature]
      p1:Forest.subtypes: [Forest, Treefolk]
      p1:Forest.colors: [G]
      p2:Forest.power: null
  - p1 activate: Forest
  - expect:
      p1.manaPool: { G: 1 }
      p1:Forest.tapped: true
