name: Diabolic Tutor takes the revealed top card; the next card is on top until the shuffle, so it's revealed (Vampire Nocturnus's ruling)
rules: [CR 701.20a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus, Swamp, Swamp, Swamp, Swamp]
    hand: [Diabolic Tutor]
    library: [Sign in Blood, Grizzly Bears, Swamp, Island]
steps:
  - p1 cast: Diabolic Tutor
    pay: auto
  - all pass: once
  - p1 choose: Sign in Blood
  - expect:
      p1.hand: [Sign in Blood]
      events contains:
        - { type: CARDS_REVEALED, from: { zone: library, player: p1 }, cards: [Grizzly Bears] }
