name: The opponent makes the Nocturnus player draw two; each new top is revealed before it's drawn
rules: [CR 701.20a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus]
    library: [Swamp, Sign in Blood, Island]
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Sign in Blood]
steps:
  - p2 cast: Sign in Blood
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Swamp, Sign in Blood]
      p1.revealedTop: Island
      p1:Vampire Nocturnus.power: 3
      events contains:
        - { type: CARDS_REVEALED, cards: [Sign in Blood] }
        - { type: CARDS_REVEALED, cards: [Island] }
