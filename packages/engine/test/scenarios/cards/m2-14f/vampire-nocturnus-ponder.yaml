name: Ponder with Nocturnus out, the reordered top is shown, then drawn, and the next top revealed
rules: [CR 401.4, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus, Island]
    hand: [Ponder]
    library: [Swamp, Island, Sign in Blood, Forest]
steps:
  - p1 cast: Ponder
    pay: auto
  - all pass: once
  - p1 choose: Sign in Blood
  - p1 choose: Island
  - p1 choose: Swamp
  - expect:
      p1.revealedTop: Sign in Blood
      p1:Vampire Nocturnus.power: 5
  - p1 choose: no
  - expect:
      p1.hand: [Sign in Blood]
      p1.revealedTop: Island
      p1:Vampire Nocturnus.power: 3
      events contains:
        - { type: CARDS_REVEALED, cards: [Island] }
