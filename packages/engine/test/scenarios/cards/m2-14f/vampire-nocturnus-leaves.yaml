name: Once Nocturnus leaves, the top is hidden and the other Vampires lose the bonus
rules: [CR 611.3b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus, Child of Night]
    library: [Sign in Blood]
  p2:
    battlefield: [Island]
    hand: [Unsummon]
steps:
  - expect:
      p1:Child of Night.power: 4
      p1.revealedTop: Sign in Blood
  - p2 cast: Unsummon
    targets: [p1:Vampire Nocturnus]
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Vampire Nocturnus]
      p1:Child of Night.power: 2
      p1:Child of Night.abilities lacks: [flying]
      p1.revealedTop: null
