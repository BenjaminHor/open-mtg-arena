name: With a black top Nocturnus has flying - Grizzly Bears can't block it, Giant Spider (reach) can
rules: [CR 702.9b, CR 509.1b, CR 613.1f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus]
    library: [Sign in Blood, Swamp]
  p2:
    battlefield: [Grizzly Bears, Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Vampire Nocturnus]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Vampire Nocturnus }
  - expect error: illegalAction
  - p2 block: { Giant Spider: Vampire Nocturnus }
  - expect:
      events contains: [{ type: BLOCKERS_DECLARED }]
