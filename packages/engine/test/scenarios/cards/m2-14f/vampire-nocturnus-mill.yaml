name: Tome Scour mills five at once; only the top it leaves is announced
rules: [CR 701.17a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus]
    library: [Swamp, Island, Sign in Blood, Forest, Plains, Mountain]
  p2:
    battlefield: [Island]
    hand: [Tome Scour]
steps:
  - p2 cast: Tome Scour
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.revealedTop: Mountain
      events contains: [{ type: CARDS_REVEALED, cards: [Mountain] }]
      events lacks: [{ type: CARDS_REVEALED, cards: [Island] }]
