name: Liliana Vess puts the found card on the revealed top without any other card being on top in between (CR 701.24b)
rules: [CR 701.24b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus, Liliana Vess]
    library: [Swamp, Island, Sign in Blood, Forest]
steps:
  - expect:
      p1:Vampire Nocturnus.power: 3
  - p1 activate: Liliana Vess
    ability: 2
  - all pass: once
  - p1 choose: Sign in Blood
  - expect:
      p1.revealedTop: Sign in Blood
      p1:Vampire Nocturnus.power: 5
      events contains: [{ type: CARDS_REVEALED, cards: [Sign in Blood] }]
      events lacks:
        - { type: CARDS_REVEALED, cards: [Swamp] }
        - { type: CARDS_REVEALED, cards: [Island] }
        - { type: CARDS_REVEALED, cards: [Forest] }
