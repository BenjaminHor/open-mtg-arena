name: Putting a black card on top in any order (Sage Owl) turns Vampire Nocturnus's bonus on, with no card changing zones
rules: [CR 611.3a, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus, Island, Island]
    hand: [Sage Owl]
    library: [Forest, Island, Mountain, Sign in Blood, Plains]
steps:
  - p1 cast: Sage Owl
    pay: auto
  - all pass: once
  - expect:
      p1:Vampire Nocturnus.power: 3
  - all pass: once
  - p1 choose: Sign in Blood
  - p1 choose: Mountain
  - p1 choose: Island
  - p1 choose: Forest
  - expect:
      p1.library: [Sign in Blood, Mountain, Island, Forest, Plains]
      p1:Vampire Nocturnus.power: 5
      p1:Vampire Nocturnus.abilities contains: [flying]
      p1.revealedTop: Sign in Blood
