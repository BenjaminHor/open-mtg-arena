name: Flying gained after blockers are declared doesn't undo the block (ruling 1)
rules: [CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus, Merfolk Looter]
    library: [Swamp, Sign in Blood, Swamp]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Vampire Nocturnus]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Vampire Nocturnus }
  - expect:
      p1:Vampire Nocturnus.power: 3
  - p1 activate: Merfolk Looter
  - all pass: once
  - expect:
      p1:Vampire Nocturnus.power: 5
      p1:Vampire Nocturnus.abilities contains: [flying]
      p1.revealedTop: Sign in Blood
  - all pass: until main2
  - expect:
      p2.life: 20
      p2.graveyard: [Grizzly Bears]
      p1:Vampire Nocturnus.damage: 2
