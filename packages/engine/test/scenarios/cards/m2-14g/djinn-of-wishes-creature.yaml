name: Djinn of Wishes reveals a creature, which its controller casts for free while the ability resolves; it resolves later
rules: [CR 608.2g, CR 118.9, CR 118.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island]
    library: [Craw Wurm, Island]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - expect:
      p1:Djinn of Wishes.counters: { wish: 2 }
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseYesNo }
      events contains: [{ type: CARDS_REVEALED, cards: [Craw Wurm] }]
  - p1 choose: yes
  - expect:
      stack: [Craw Wurm]
      pending: { player: p1, kind: priority }
      events contains: [{ type: SPELL_CAST, player: p1 }]
  - all pass: once
  - expect:
      p1.battlefield contains: [Craw Wurm]
      p1.library: [Island]
