name: A spell cast while Djinn of Wishes's ability resolves triggers "whenever a player casts", which waits until the ability is done, then goes on above it
rules: [CR 601.2i]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island]
    library: [Divination, Island, Swamp, Forest]
  p2:
    battlefield: [Mold Adder]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - expect:
      stack: [Divination, Mold Adder ability]
      pending: { player: p1, kind: priority }
