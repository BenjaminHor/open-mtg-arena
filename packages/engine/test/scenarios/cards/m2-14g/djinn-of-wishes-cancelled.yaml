name: A free cast cancelled goes back to the choice, with the card back on top; declined then, it's exiled
rules: [CR 601.2, CR 734.1, CR 734.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island]
    library: [Lightning Bolt, Island]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - p1 choose: cancel
  - expect:
      pending: { player: p1, kind: chooseYesNo }
      p1.library: [Lightning Bolt, Island]
      stack: [Djinn of Wishes ability]
      events contains: [{ type: CAST_CANCELLED, player: p1, restored: null }]
  - p1 choose: no
  - expect:
      exile: [Lightning Bolt]
      p1.library: [Island]
      stack: []
      pending: { player: p1, kind: priority }
