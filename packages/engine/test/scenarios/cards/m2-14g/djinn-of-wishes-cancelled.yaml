name: A free cast cancelled puts the card back on top, and it's exiled as not played
rules: [CR 734.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island]
    library: [Lightning Bolt, Island]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - p1 choose: cancel
  - expect:
      exile: [Lightning Bolt]
      p1.library: [Island]
      stack: []
      pending: { player: p1, kind: priority }
