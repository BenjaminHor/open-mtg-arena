name: A free cast that can't be paid is reversed to the choice, and redone legally with one target
rules: [CR 601.2, CR 734.1, CR 608.2g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island]
    library: [Fireball, Island]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - p1 choose: 2
  - p1 choose: p2
  - p1 choose: p2:Grizzly Bears
  - expect:
      pending: { player: p1, kind: payMana }
  - p1 choose: cancel
  - expect:
      pending: { player: p1, kind: chooseYesNo }
      exile: []
      p1.library: [Fireball, Island]
  - p1 choose: yes
  - p1 choose: 1
  - p1 choose: p2
  - expect:
      stack: [Fireball]
