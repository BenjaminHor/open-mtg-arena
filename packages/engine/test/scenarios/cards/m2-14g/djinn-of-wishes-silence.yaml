name: A player Silence stops can't cast the revealed spell, so it's exiled without asking
rules: [CR 601.3]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island]
    library: [Craw Wurm, Island]
  p2:
    battlefield: [Plains]
    hand: [Silence]
steps:
  - p2 cast: Silence
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - expect:
      exile: [Craw Wurm]
      pending: { player: p2, kind: priority }
