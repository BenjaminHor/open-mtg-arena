name: With Vampire Nocturnus out, a free cast cancelled shows nothing of the card under it until the card cast is exiled
rules: [CR 401.5, CR 734.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Vampire Nocturnus, Island, Island, Island, Island]
    library: [Lightning Bolt, Sign in Blood, Island]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - p1 choose: cancel
  - expect:
      exile: [Lightning Bolt]
      p1.revealedTop: Sign in Blood
      events contains: [{ type: CARDS_REVEALED, cards: [Sign in Blood] }]
