name: Nocturnus, a land played off the top shows the new top at once
rules: [CR 401.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Vampire Nocturnus, Island, Island, Island, Island]
    library: [Forest, Sign in Blood, Island]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - expect:
      p1.battlefield contains: [Forest]
      p1.revealedTop: Sign in Blood
      events contains: [{ type: CARDS_REVEALED, cards: [Sign in Blood] }]
      exile: []
