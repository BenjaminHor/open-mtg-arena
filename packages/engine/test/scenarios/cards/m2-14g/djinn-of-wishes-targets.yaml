name: A spell cast for free still chooses its targets as it's cast, during the resolution
rules: [CR 601.2c, CR 608.2g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island]
    library: [Lightning Bolt, Island]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - expect:
      pending: { player: p1, kind: chooseTarget }
  - p1 choose: p2
  - expect:
      stack: [Lightning Bolt]
  - all pass: once
  - expect:
      p2.life: 17
