name: Fireball cast without paying its mana cost has X 0, and its increase for each extra target is still paid
rules: [CR 107.3b, CR 118.9d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island, Mountain]
    library: [Fireball, Island]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - expect:
      pending: { player: p1, kind: chooseTargetCount }
  - p1 choose: 2
  - p1 choose: p2
  - p1 choose: p2:Grizzly Bears
  - expect:
      pending: { player: p1, kind: payMana, cost: [{ kind: generic, amount: 1 }] }
  - p1 activate: Mountain
  - p1 choose: { R: 1 }
  - expect:
      stack: [Fireball]
  - all pass: once
  - expect:
      p2.life: 20
      p2.battlefield: [Grizzly Bears]
