name: Djinn of Wishes's ability can't be activated without a wish counter to remove, and it enters with three
rules: [CR 118.3, CR 614.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 0 } }, Island, Island, Island, Island, Island, Island, Island, Island, Island]
    hand: [Djinn of Wishes]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - expect error: illegalAction
  - p1 cast: Djinn of Wishes
    pay: auto
  - all pass: once
  - expect:
      p1:Djinn of Wishes#2.counters: { wish: 3 }
