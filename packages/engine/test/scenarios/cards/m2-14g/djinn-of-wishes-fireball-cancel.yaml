name: Fireball at two targets, the Mountain tapped for it, then cancelled, untaps the Mountain and empties the pool; declined after, it's exiled
rules: [CR 734.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Djinn of Wishes, counters: { wish: 3 } }, Island, Island, Island, Island, Mountain]
    library: [Fireball, Island]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 activate: Djinn of Wishes
    pay: auto
  - all pass: once
  - p1 choose: yes
  - p1 choose: 2
  - p1 choose: p2
  - p1 choose: p2:Grizzly Bears
  - p1 activate: Mountain
  - p1 choose: cancel
  - expect:
      p1:Mountain.tapped: false
      p1.manaPool: {}
      pending: { player: p1, kind: chooseYesNo }
  - p1 choose: no
  - expect:
      exile: [Fireball]
      p1.library: [Island]
      stack: []
      pending: { player: p1, kind: priority }
