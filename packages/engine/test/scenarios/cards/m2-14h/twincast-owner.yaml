name: A copy of the opponent's spell is owned by Twincast's controller; countered, it goes to their graveyard
rules: [CR 112.2, CR 707.10]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Island, Island]
    hand: [Twincast]
  p2:
    battlefield: [Mountain, Island, Island, Island]
    hand: [Lightning Bolt, Cancel]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - p2 pass: once
  - p1 cast: Twincast
    targets: [spell:p2:Lightning Bolt]
    pay: auto
  - all pass: once
  - p1 choose: p2
  - p2 cast: Cancel
    targets: [spell:p1:Lightning Bolt copy]
    pay: auto
  - all pass: once
  - expect:
      stack: [Lightning Bolt]
      events contains: [{ type: COPY_CEASED_TO_EXIST, from: { zone: graveyard, player: p1 } }]
