name: A copy of Cancel may target the Cancel it copies, and counters it
rules: [CR 115.7d, CR 707.10]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Island, Island, Island]
    hand: [Cancel]
  p2:
    battlefield: [Mountain, Island, Island]
    hand: [Lightning Bolt, Twincast]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - p2 pass: once
  - p1 cast: Cancel
    targets: [spell:p2:Lightning Bolt]
    pay: auto
  - p1 pass: once
  - p2 cast: Twincast
    targets: [spell:p1:Cancel]
    pay: auto
  - all pass: once
  - p2 choose: spell:p1:Cancel
  - all pass: once
  - expect:
      stack: [Lightning Bolt]
      p1.graveyard: [Cancel]
  - all pass: once
  - expect:
      p1.life: 17
