name: Hive Mind destroyed in response still makes its trigger copy (CR 113.7a)
rules: [CR 113.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Forest, Forest]
    hand: [Lightning Bolt, Naturalize]
  p2:
    battlefield: [Hive Mind]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Naturalize
    targets: [p2:Hive Mind]
    pay: auto
  - all pass: once
  - p2 choose: keep
  - all pass: once
  - expect:
      p2.graveyard: [Hive Mind]
  - all pass: once
  - all pass: once
  - expect:
      pending: { player: p2, kind: chooseNewTarget }
  - p2 choose: p1
  - all pass: until main2
  - expect:
      p1.life: 17
      p2.life: 17
