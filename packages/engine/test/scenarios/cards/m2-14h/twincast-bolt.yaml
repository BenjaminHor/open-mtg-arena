name: Twincast copies Lightning Bolt with the same target; the copy isn't cast, resolves first, and then ceases to exist
rules: [CR 707.10, CR 707.10a, CR 704.5e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island]
    hand: [Lightning Bolt, Twincast]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseNewTarget }
      # Twincast is still resolving while the copy's targets are chosen.
      stack: [Lightning Bolt, Twincast, Lightning Bolt copy]
      events contains: [{ type: SPELL_COPIED, player: p1 }]
      events lacks: [{ type: SPELL_CAST }]
  - p1 choose: keep
  - expect:
      pending: { player: p1, kind: priority }
  - all pass: once
  - expect:
      p2.life: 17
      stack: [Lightning Bolt]
      p1.graveyard: [Twincast]
      events contains: [{ type: COPY_CEASED_TO_EXIST }]
  - all pass: once
  - expect:
      p2.life: 14
      p1.graveyard: [Twincast, Lightning Bolt]
