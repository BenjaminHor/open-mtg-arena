name: A copy of Earthquake keeps X and asks nothing
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Island, Island]
    hand: [Earthquake, Twincast]
steps:
  - p1 cast: Earthquake
    x: 2
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Earthquake]
    pay: auto
  - all pass: once
  - expect:
      stack: [Earthquake, Earthquake copy]
      pending: { player: p1, kind: priority }
  - all pass: until main2
  - expect:
      p1.life: 16
      p2.life: 16
