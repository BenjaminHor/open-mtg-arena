name: A copy of the opponent's spell is controlled by Twincast's controller, who may point it back
rules: [CR 707.10]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Island, Island]
    hand: [Twincast]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - p2 pass: once
  - p1 cast: Twincast
    targets: [spell:p2:Lightning Bolt]
    pay: auto
  - all pass: once
  - p1 choose: p2
  - expect:
      stack: [Lightning Bolt, Lightning Bolt copy]
  - all pass: once
  - expect:
      p2.life: 17
  - all pass: once
  - expect:
      p1.life: 17
