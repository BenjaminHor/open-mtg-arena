name: A copy aimed away from Illusionary Servant doesn't trigger it
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island]
    hand: [Lightning Bolt, Twincast]
  p2:
    battlefield: [Illusionary Servant]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - p1 choose: p1
  - expect:
      stack: [Lightning Bolt, Lightning Bolt copy]
      events lacks: [{ type: BECAME_TARGET }]
