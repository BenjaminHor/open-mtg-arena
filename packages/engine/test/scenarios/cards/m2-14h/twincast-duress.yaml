name: Copy of the opponent's Duress kept targeting its new controller is illegal ("target opponent" is relative to the copy's controller)
rules: [CR 115.7d, CR 608.2b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Island, Island]
    hand: [Twincast, Grizzly Bears]
  p2:
    battlefield: [Swamp]
    hand: [Duress, Divination]
steps:
  - p2 cast: Duress
    targets: [p1]
    pay: auto
  - p2 pass: once
  - p1 cast: Twincast
    targets: [spell:p2:Duress]
    pay: auto
  - all pass: once
  - p1 choose: p1
  - expect error: illegalAction
  - p1 choose: p2
  - all pass: once
  - expect:
      p2.graveyard: [Divination]
