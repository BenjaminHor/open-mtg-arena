name: A copy of a spell with no targets asks nothing, and "you" is the copy's controller (its ruling)
rules: [CR 707.10, CR 707.2]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Island, Island]
    hand: [Twincast]
    library: [Forest, Mountain, Plains]
  p2:
    battlefield: [Island, Island, Island]
    hand: [Divination]
    library: [Swamp, Swamp, Swamp]
steps:
  - p2 cast: Divination
    pay: auto
  - p2 pass: once
  - p1 cast: Twincast
    targets: [spell:p2:Divination]
    pay: auto
  - all pass: once
  - expect:
      stack: [Divination, Divination copy]
      pending: { player: p2, kind: priority }
  - all pass: once
  - expect:
      p1.hand: [Forest, Mountain]
