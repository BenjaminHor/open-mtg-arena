name: A target kept may be illegal by then, and a copy whose only target is illegal doesn't resolve
rules: [CR 115.7d, CR 608.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Island, Island]
    hand: [Lightning Bolt, Shock, Twincast]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2:Grizzly Bears]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - p1 cast: Shock
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Grizzly Bears]
  - all pass: once
  - p1 choose: keep
  - all pass: once
  - expect:
      stack: [Lightning Bolt]
      p2.life: 20
