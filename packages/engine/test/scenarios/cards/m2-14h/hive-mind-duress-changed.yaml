name: Hive Mind's copy of Duress retargeted to p1 makes p1 reveal; p2 (the copy's controller, "you") chooses
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Swamp]
    hand: [Duress, Shock, Divination]
  p2:
    battlefield: [Hive Mind]
    hand: [Divination]
steps:
  - p1 cast: Duress
    targets: [p2]
    pay: auto
  - all pass: once
  - p2 choose: p1
  - all pass: once
  - expect:
      pending: { player: p2, kind: chooseCards, min: 1, max: 1 }
