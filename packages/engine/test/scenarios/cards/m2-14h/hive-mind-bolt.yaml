name: Hive Mind makes each other player copy a cast instant, choosing new targets; the copy isn't cast, so it doesn't trigger Hive Mind
rules: [CR 707.10, CR 603.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
  p2:
    battlefield: [Hive Mind]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - expect:
      stack: [Lightning Bolt, Hive Mind ability]
  - all pass: once
  - expect:
      pending: { player: p2, kind: chooseNewTarget }
  - p2 choose: p1
  - expect:
      stack: [Lightning Bolt, Lightning Bolt copy]
      pending: { player: p1, kind: priority }
  - all pass: once
  - expect:
      p1.life: 17
  - all pass: once
  - expect:
      p2.life: 17
      stack: []
