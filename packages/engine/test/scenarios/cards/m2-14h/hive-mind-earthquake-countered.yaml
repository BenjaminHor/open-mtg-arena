name: Earthquake countered in response is copied with its X from last known information
rules: [CR 608.2h, CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Earthquake]
  p2:
    battlefield: [Hive Mind, Island, Island, Island]
    hand: [Cancel]
steps:
  - p1 cast: Earthquake
    x: 2
    pay: auto
  - p1 pass: once
  - p2 cast: Cancel
    targets: [spell:p1:Earthquake]
    pay: auto
  - all pass: once
  - p1 choose: keep
  - all pass: once
  - expect:
      p1.graveyard: [Earthquake]
  - all pass: until main2
  - expect:
      p1.life: 18
      p2.life: 18
