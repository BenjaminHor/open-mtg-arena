name: Hive Mind with Twincast, p2 copies Twincast; its Bolt copy isn't cast and doesn't trigger Hive Mind
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island]
    hand: [Lightning Bolt, Twincast]
  p2:
    battlefield: [Hive Mind]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - p2 choose: keep
  - expect:
      stack: [Lightning Bolt, Hive Mind ability, Twincast, Twincast copy]
  - all pass: once
  - p2 choose: p1
  - expect:
      stack: [Lightning Bolt, Hive Mind ability, Twincast, Lightning Bolt copy]
  - all pass: once
  - all pass: once
  - p1 choose: keep
  - expect:
      stack: [Lightning Bolt, Hive Mind ability, Lightning Bolt copy]
  - all pass: once
  - all pass: once
  - p2 choose: p1
  - all pass: until main2
  - expect:
      p1.life: 14
      p2.life: 14
