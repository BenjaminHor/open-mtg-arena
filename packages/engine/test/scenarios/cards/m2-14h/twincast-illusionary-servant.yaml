name: Illusionary Servant becomes the target of the copy, a new spell, and its ability triggers (D-125)
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island]
    hand: [Lightning Bolt, Twincast]
  p2:
    battlefield: [Illusionary Servant]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - p1 choose: p2:Illusionary Servant
  - expect:
      stack: [Lightning Bolt, Lightning Bolt copy, Illusionary Servant ability]
      events contains: [{ type: BECAME_TARGET }]
