name: Twincast can copy a copy, which is itself a spell
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island, Island, Island]
    hand: [Lightning Bolt, Twincast, Twincast]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - p1 choose: keep
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt copy]
    pay: auto
  - all pass: once
  - p1 choose: keep
  - expect:
      stack: [Lightning Bolt, Lightning Bolt copy, Lightning Bolt copy]
  - all pass: until main2
  - expect:
      p2.life: 11
