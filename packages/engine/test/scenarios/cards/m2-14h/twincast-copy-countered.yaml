name: A copy countered goes to the graveyard and ceases to exist there, never a card in it
rules: [CR 704.5e, CR 701.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island]
    hand: [Lightning Bolt, Twincast]
  p2:
    battlefield: [Island, Island, Island]
    hand: [Cancel]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - p1 choose: keep
  - p1 pass: once
  - p2 cast: Cancel
    targets: [spell:p1:Lightning Bolt copy]
    pay: auto
  - all pass: once
  - expect:
      stack: [Lightning Bolt]
      p1.graveyard: [Twincast]
      events contains: [{ type: COPY_CEASED_TO_EXIST, from: { zone: graveyard, player: p1 } }]
