name: The copy's controller may choose a new legal target for it
rules: [CR 707.10c, CR 115.7d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island]
    hand: [Lightning Bolt, Twincast]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - p1 choose: p2:Grizzly Bears
  - all pass: once
  - expect:
      p2.graveyard: [Grizzly Bears]
  - all pass: once
  - expect:
      p2.life: 17
