name: A copy isn't cast, so Dragon's Claw doesn't trigger for it
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island]
    hand: [Lightning Bolt, Twincast]
  p2:
    battlefield: [Dragon's Claw]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - expect:
      stack: [Lightning Bolt, Dragon's Claw ability]
  - all pass: once
  - p2 choose: yes
  - p1 cast: Twincast
    targets: [spell:p1:Lightning Bolt]
    pay: auto
  - all pass: once
  - p1 choose: keep
  - expect:
      stack: [Lightning Bolt, Lightning Bolt copy]
  - all pass: until main2
  - expect:
      p2.life: 15
