name: When Hive Mind's controller casts the spell, the other player copies it
rules: [CR 707.10]
setup:
  turn: { active: p2, step: main1 }
  p2:
    battlefield: [Hive Mind, Island, Island, Island]
    hand: [Divination]
    library: [Swamp, Swamp, Swamp]
  p1:
    library: [Forest, Mountain, Plains]
steps:
  - p2 cast: Divination
    pay: auto
  - all pass: once
  - expect:
      stack: [Divination, Divination copy]
  - all pass: once
  - expect:
      p1.hand: [Forest, Mountain]
  - all pass: once
  - expect:
      p2.hand: [Swamp, Swamp]
