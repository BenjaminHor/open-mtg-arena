name: A copy keeps X (its ruling)
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain]
    hand: [Earthquake]
  p2:
    battlefield: [Hive Mind]
steps:
  - p1 cast: Earthquake
    x: 1
    pay: auto
  - all pass: once
  - expect:
      stack: [Earthquake, Earthquake copy]
  - all pass: until main2
  - expect:
      p1.life: 18
      p2.life: 18
