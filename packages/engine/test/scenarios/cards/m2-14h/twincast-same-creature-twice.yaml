name: New targets naming one creature twice in an instance aren't a legal choice, so the player starts over from the copy's targets
rules: [CR 115.7e, CR 601.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Island, Island]
    hand: [Ignite Disorder, Twincast]
  p2:
    battlefield: [Elite Vanguard, Snapping Drake]
steps:
  - p1 cast: Ignite Disorder
    targets: [[p2:Elite Vanguard, p2:Snapping Drake]]
    divide: [2, 1]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Ignite Disorder]
    pay: auto
  - all pass: once
  - p1 choose: p2:Snapping Drake
  - p1 choose: keep
  - expect:
      pending: { player: p1, kind: chooseNewTarget, instance: 0, index: 0 }
  - p1 choose: keep
  - p1 choose: keep
  - all pass: once
  - expect:
      p2.graveyard: [Elite Vanguard]
      p2:Snapping Drake.damage: 1
