name: A copy of Fireball keeps X and the number of targets
rules: [CR 707.10]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Island, Island]
    hand: [Fireball, Twincast]
  p2:
    battlefield: [Grizzly Bears, Elite Vanguard]
steps:
  - p1 cast: Fireball
    x: 4
    targets: [[p2, p2:Grizzly Bears]]
    pay: auto
  - p1 cast: Twincast
    targets: [spell:p1:Fireball]
    pay: auto
  - all pass: once
  - p1 choose: keep
  - p1 choose: p2:Elite Vanguard
  - all pass: until main2
  - expect:
      p2.life: 16
      p2.graveyard: [Elite Vanguard, Grizzly Bears]
