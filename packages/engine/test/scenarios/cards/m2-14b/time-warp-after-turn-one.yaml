name: An extra turn right after turn 1 has its draw step; only the first turn's draw is skipped
rules: [CR 103.8a]
setup:
  turn: { active: p1, step: main1, number: 1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island]
    hand: [Time Warp]
    library: [Grizzly Bears, Island, Island]
steps:
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until main1
  - expect:
      turn: 2
      active: p1
      p1.hand: [Grizzly Bears]
