name: Until end of turn effects end in the cleanup step before the extra turn
rules: [CR 514.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island, Forest, Grizzly Bears]
    hand: [Giant Growth, Time Warp]
steps:
  - p1 cast: Giant Growth
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      turn: 4
      p1:Grizzly Bears.power: 2
