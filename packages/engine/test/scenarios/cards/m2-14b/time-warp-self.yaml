name: Time Warp on yourself gives you the next turn, then turn order goes on as usual
rules: [CR 500.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island]
    hand: [Time Warp]
steps:
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      turn: 4
      active: p1
      p1:Island.tapped: false
  - all pass: until upkeep
  - expect:
      turn: 5
      active: p2
  - all pass: until upkeep
  - expect:
      turn: 6
      active: p1
