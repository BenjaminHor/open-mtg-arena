name: A countered Time Warp gives no extra turn
rules: [CR 500.7, CR 701.6a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island]
    hand: [Time Warp]
  p2:
    battlefield: [Island, Island, Island]
    hand: [Cancel]
steps:
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - p1 pass: once
  - p2 cast: Cancel
    targets: [p1:Time Warp]
    pay: auto
  - all pass: once
  - expect:
      stack: []
      p1.graveyard: [Time Warp]
      events lacks: [{ type: EXTRA_TURN_ADDED }]
  - all pass: until upkeep
  - expect:
      turn: 4
      active: p2
