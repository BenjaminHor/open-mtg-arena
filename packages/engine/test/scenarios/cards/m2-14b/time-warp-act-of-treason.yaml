name: A creature borrowed with Act of Treason goes back before the extra turn, and its owner can attack with it then
rules: [CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island, Mountain, Mountain, Mountain]
    hand: [Act of Treason, Time Warp]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect: { p1.battlefield contains: [Grizzly Bears] }
  - p1 cast: Time Warp
    targets: [p2]
    pay: auto
  - all pass: once
  - all pass: until main1
  - expect: { turn: 4, active: p2, p2:Grizzly Bears.sick: false }
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until main2
  - expect: { p1.life: 18 }
