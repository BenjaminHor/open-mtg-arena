name: In an extra turn a creature cast before it can attack, and the land play and loyalty ability start again
rules: [CR 302.6, CR 305.2, CR 606.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island, Forest, Forest, Island, Island, Island]
    hand: [Grizzly Bears, Time Warp, Island, Island, Jace Beleren]
steps:
  - p1 play: Island
  - p1 cast: Grizzly Bears
    pay: auto
  - all pass: once
  - p1 cast: Jace Beleren
    pay: auto
  - all pass: once
  - p1 activate: Jace Beleren
    ability: 1
  - all pass: once
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until main1
  - expect:
      turn: 4
      active: p1
      p1:Grizzly Bears.sick: false
  - p1 play: Island
  - p1 activate: Jace Beleren
    ability: 1
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p2.life: 18
