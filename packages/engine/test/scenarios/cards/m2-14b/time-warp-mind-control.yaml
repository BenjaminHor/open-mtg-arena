name: A creature stolen before Time Warp can attack in its new controller's extra turn
rules: [CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island, Island, Island, Island, Island, Island]
    hand: [Mind Control, Time Warp]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Mind Control
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.sick: true
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until main1
  - expect:
      turn: 4
      p1:Grizzly Bears.sick: false
