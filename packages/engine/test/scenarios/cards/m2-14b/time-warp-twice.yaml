name: Of two extra turns created in one turn, the most recent is taken first (its ruling)
rules: [CR 500.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island, Island, Island, Island, Island, Island]
    hand: [Time Warp, Time Warp]
steps:
  - p1 cast: Time Warp
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      turn: 4
      active: p1
  - all pass: until upkeep
  - expect:
      turn: 5
      active: p2
  - all pass: until upkeep
  - expect:
      turn: 6
      active: p2
  - all pass: until upkeep
  - expect:
      turn: 7
      active: p1
