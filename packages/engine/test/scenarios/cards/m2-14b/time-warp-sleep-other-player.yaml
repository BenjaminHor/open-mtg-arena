name: Sleep on an opponent, then Time Warp on yourself - your extra turn doesn't use up their next untap step
rules: [CR 500.7, CR 502.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island, Island, Island, Island, Island]
    hand: [Sleep, Time Warp]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Sleep
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      turn: 4
      active: p1
      p2:Grizzly Bears.tapped: true
  - all pass: until upkeep
  - expect:
      turn: 5
      active: p2
      p2:Grizzly Bears.tapped: true
  - all pass: until upkeep
  - expect:
      turn: 6
      active: p1
  - all pass: until upkeep
  - expect:
      turn: 7
      active: p2
      p2:Grizzly Bears.tapped: false
