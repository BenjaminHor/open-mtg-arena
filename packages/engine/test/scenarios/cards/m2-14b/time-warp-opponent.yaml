name: Time Warp on an opponent gives them an extra turn right after this one, and then their regular turn
rules: [CR 500.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island]
    hand: [Time Warp]
steps:
  - p1 cast: Time Warp
    targets: [p2]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      turn: 4
      active: p2
  - all pass: until upkeep
  - expect:
      turn: 5
      active: p2
  - all pass: until upkeep
  - expect:
      turn: 6
      active: p1
