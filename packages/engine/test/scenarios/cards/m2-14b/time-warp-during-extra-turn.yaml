name: Time Warp cast during an extra turn gives a turn after that one, before turn order goes on
rules: [CR 500.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island]
    hand: [Time Warp]
    library: [Time Warp, Island, Island, Island]
steps:
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until main1
  - expect:
      turn: 4
      active: p1
  - p1 cast: Time Warp
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      turn: 5
      active: p1
  - all pass: until upkeep
  - expect:
      turn: 6
      active: p2
