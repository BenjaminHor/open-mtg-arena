name: Haunting Echoes searches a library with no copies left, so its target learns nothing from it
rules: [CR 701.23a, CR 401.2]
# D-062: skipping the search when no copy is left would tell the target their library holds none.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Haunting Echoes]
    battlefield: [Swamp, Swamp, Swamp, Swamp, Swamp]
  p2:
    graveyard: [Grizzly Bears]
    library: [Forest, Island]
steps:
  - p1 cast: Haunting Echoes
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 0, options: [] }
  - p1 choose: finish
  - expect:
      exile: [Grizzly Bears]
      p2.library count: 2
