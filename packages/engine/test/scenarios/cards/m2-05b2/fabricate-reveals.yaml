name: Fabricate finds an artifact card, reveals it and puts it into its caster's hand, then shuffles
rules: [CR 701.23a, CR 701.20a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Fabricate]
    library: [Forest, Ornithopter, Island]
    battlefield: [Island, Island, Island]
steps:
  - p1 cast: Fabricate
    pay: auto
  - all pass: once
  - p1 choose: Ornithopter
  - expect:
      p1.hand: [Ornithopter]
      p1.library count: 2
      events contains: [{ type: CARDS_REVEALED, from: { zone: library, player: p1 } }, { type: LIBRARY_SHUFFLED }]
