name: A player conceding while a search waits ends the game, and the search with it
rules: [CR 104.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Diabolic Tutor]
    library: [Forest, Lightning Bolt]
    battlefield: [Swamp, Swamp, Swamp, Swamp]
steps:
  - p1 cast: Diabolic Tutor
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards }
  - p2 concede: now
  - expect:
      winner: p1
