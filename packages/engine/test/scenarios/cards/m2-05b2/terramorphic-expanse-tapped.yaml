name: A tapped Terramorphic Expanse can't be activated, as {T} is part of its cost
rules: [CR 107.5]
setup:
  turn: { active: p1, step: main1 }
  p1:
    library: [Swamp]
    battlefield: [{ card: Terramorphic Expanse, tapped: true }]
steps:
  - p1 activate: Terramorphic Expanse
  - expect error: illegalAction
