name: Mind Rot's target player chooses the two cards they discard, then discards both together
rules: [CR 701.9b, CR 608.2d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Mind Rot]
    battlefield: [Swamp, Swamp, Swamp]
  p2:
    hand: [Shock, Forest, Island]
steps:
  - p1 cast: Mind Rot
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p2, kind: chooseCards, min: 2, max: 2 }
  - p2 choose: Shock
  - expect:
      pending: { player: p2, kind: chooseCards }
      p2.hand count: 3
      events lacks: [{ type: CARD_DISCARDED }]
  - p2 choose: Island
  - expect:
      p2.hand: [Forest]
      p2.graveyard: [Shock, Island]
