name: Ponder with one card in the library still shows it, and with none its caster loses for the draw
rules: [CR 609.3, CR 121.4, CR 704.5b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ponder, Ponder]
    library: [Forest]
    battlefield: [Island, Island]
steps:
  - p1 cast: Ponder
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 1, max: 1 }
  - p1 choose: Forest
  - p1 choose: no
  - expect:
      p1.hand: [Ponder, Forest]
  - p1 cast: Ponder
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseYesNo }
  - p1 choose: no
  - expect:
      winner: p2
