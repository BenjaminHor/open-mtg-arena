name: Ponder puts the top three back in the chosen order, without shuffling, then draws the new top card
rules: [CR 701.20e, CR 401.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ponder]
    library: [Forest, Island, Mountain, Swamp]
    battlefield: [Island]
steps:
  - p1 cast: Ponder
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 3, max: 3 }
  - p1 choose: Mountain
  - p1 choose: Forest
  - p1 choose: Island
  - expect:
      pending: { player: p1, kind: chooseYesNo }
  - p1 choose: no
  - expect:
      p1.hand: [Mountain]
      p1.library: [Forest, Island, Swamp]
      events lacks: [{ type: LIBRARY_SHUFFLED }]
