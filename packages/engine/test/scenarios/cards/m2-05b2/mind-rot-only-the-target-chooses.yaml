name: Only Mind Rot's target answers its choice, and Mind Rot can target its own caster
rules: [CR 701.9b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Mind Rot, Mind Rot, Forest, Island, Shock]
    battlefield: [Swamp, Swamp, Swamp, Swamp, Swamp, Swamp]
  p2:
    hand: [Shock, Forest, Island]
steps:
  - p1 cast: Mind Rot
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 choose: Shock
  - expect error: notYourDecision
  - p2 choose: Shock
  - p2 choose: Forest
  - p1 cast: Mind Rot
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 2, max: 2 }
