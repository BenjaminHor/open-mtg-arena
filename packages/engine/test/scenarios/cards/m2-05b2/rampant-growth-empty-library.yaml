name: Rampant Growth with an empty library searches nothing and asks nothing, and the empty library is still shuffled
rules: [CR 701.24e, CR 401.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Rampant Growth]
    library: []
    battlefield: [Forest, Forest]
steps:
  - p1 cast: Rampant Growth
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: priority }
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
