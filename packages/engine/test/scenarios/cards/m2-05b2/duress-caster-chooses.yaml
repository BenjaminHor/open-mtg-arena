name: Duress reveals the hand, and its caster chooses a noncreature, nonland card for the target to discard
rules: [CR 701.20a, CR 701.9b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Duress]
    battlefield: [Swamp]
  p2:
    hand: [Shock, Giant Growth, Forest, Grizzly Bears]
steps:
  - p1 cast: Duress
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 1, max: 1 }
      events contains: [{ type: CARDS_REVEALED, from: { zone: hand, player: p2 } }]
  - p1 choose: Giant Growth
  - expect:
      p2.hand: [Shock, Forest, Grizzly Bears]
      p2.graveyard: [Giant Growth]
