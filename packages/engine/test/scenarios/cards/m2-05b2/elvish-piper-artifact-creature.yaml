name: Elvish Piper can put an artifact creature card, which is a creature card, onto the battlefield
rules: [CR 110.2a]
# Elvish Piper's ruling: a "creature card" is any card with the type creature.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ornithopter]
    battlefield: [Elvish Piper, Forest]
steps:
  - p1 activate: Elvish Piper
    pay: auto
  - all pass: once
  - p1 choose: Ornithopter
  - expect:
      p1.battlefield contains: [Ornithopter]
      p1.hand: []
