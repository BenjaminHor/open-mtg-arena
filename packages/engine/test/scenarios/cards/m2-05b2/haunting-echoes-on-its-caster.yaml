name: Haunting Echoes on its own caster doesn't exile itself, being on the stack, and ends in their graveyard
rules: [CR 608.2n]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Haunting Echoes]
    graveyard: [Lightning Bolt]
    library: [Forest, Lightning Bolt]
    battlefield: [Swamp, Swamp, Swamp, Swamp, Swamp]
steps:
  - p1 cast: Haunting Echoes
    targets: [p1]
    pay: auto
  - all pass: once
  - p1 choose: Lightning Bolt
  - p1 choose: finish
  - expect:
      exile: [Lightning Bolt, Lightning Bolt]
      p1.graveyard: [Haunting Echoes]
      p1.library: [Forest]
