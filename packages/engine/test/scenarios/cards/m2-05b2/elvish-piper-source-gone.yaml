name: Elvish Piper's ability resolves even after Piper is destroyed in response
rules: [CR 113.7a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Grizzly Bears]
    battlefield: [Elvish Piper, Forest]
  p2:
    hand: [Doom Blade]
    battlefield: [Swamp, Swamp]
steps:
  - p1 activate: Elvish Piper
    pay: auto
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Elvish Piper]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Elvish Piper]
  - all pass: once
  - p1 choose: Grizzly Bears
  - expect:
      p1.battlefield contains: [Grizzly Bears]
