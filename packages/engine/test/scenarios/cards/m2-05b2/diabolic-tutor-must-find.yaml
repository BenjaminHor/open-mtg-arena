name: Diabolic Tutor must find a card when the library has one, and doesn't reveal it
rules: [CR 701.23d, CR 701.23e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Diabolic Tutor]
    library: [Forest, Lightning Bolt]
    battlefield: [Swamp, Swamp, Swamp, Swamp]
steps:
  - p1 cast: Diabolic Tutor
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 1, max: 1 }
  - p1 choose: finish
  - expect error: illegalAction
  - p1 choose: Lightning Bolt
  - expect:
      p1.hand: [Lightning Bolt]
      p1.library: [Forest]
      events lacks: [{ type: CARDS_REVEALED }]
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
