name: Haunting Echoes exiles from the graveyard, and with an empty library asks nothing but still shuffles it
rules: [CR 401.3, CR 609.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Haunting Echoes]
    battlefield: [Swamp, Swamp, Swamp, Swamp, Swamp]
  p2:
    graveyard: [Grizzly Bears]
    library: []
steps:
  - p1 cast: Haunting Echoes
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      exile: [Grizzly Bears]
      pending: { player: p1, kind: priority }
      events contains: [{ type: LIBRARY_SHUFFLED, player: p2 }]
