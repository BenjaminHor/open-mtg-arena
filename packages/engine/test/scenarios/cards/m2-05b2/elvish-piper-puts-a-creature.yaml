name: Elvish Piper puts a creature card from hand onto the battlefield, summoning sick and not cast
rules: [CR 110.2a, CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Llanowar Elves, Lightning Bolt]
    battlefield: [Elvish Piper, Forest]
steps:
  - p1 activate: Elvish Piper
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 0, max: 1 }
  - p1 choose: Llanowar Elves
  - expect:
      p1.battlefield contains: [Llanowar Elves]
      p1.hand: [Lightning Bolt]
      p1:Llanowar Elves.sick: true
      events lacks: [{ type: SPELL_CAST }]
  - p1 activate: Llanowar Elves
  - expect error: illegalAction
