name: Rampant Growth puts a basic land onto the battlefield tapped, and it isn't the turn's land play
rules: [CR 305.4, CR 110.5b, CR 603.2e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Rampant Growth, Forest]
    library: [Island, Forest, Mountain]
    battlefield: [Forest, Forest]
steps:
  - p1 cast: Rampant Growth
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 0, max: 1 }
  - p1 choose: Island
  - expect:
      p1:Island.tapped: true
      events lacks: [{ type: PERMANENT_TAPPED }]
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
      p1.library count: 2
  - p1 play: Forest
  - expect:
      p1.battlefield count: 4
