name: Merfolk Looter draws, then discards a card of its controller's choice, with nothing cast in between
rules: [CR 608.2g, CR 701.9b]
# Merfolk Looter's ruling: you can't cast the card you drew before discarding.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Forest]
    library: [Lightning Bolt, Island]
    battlefield: [Merfolk Looter, Mountain]
steps:
  - p1 activate: Merfolk Looter
  - all pass: once
  - expect:
      p1.hand: [Forest, Lightning Bolt]
      pending: { player: p1, kind: chooseCards, min: 1, max: 1 }
  - p1 cast: Lightning Bolt
  - expect error: illegalAction
  - p1 activate: Mountain
  - expect error: illegalAction
  - p1 choose: Lightning Bolt
  - expect:
      p1.hand: [Forest]
      p1.graveyard: [Lightning Bolt]
