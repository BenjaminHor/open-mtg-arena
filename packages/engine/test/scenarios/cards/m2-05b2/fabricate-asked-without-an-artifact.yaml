name: Fabricate is searched even with no artifact in the library, so the opponent learns nothing, and still shuffles
rules: [CR 701.23a, CR 401.2]
# D-062: skipping the search when nothing fits would tell the opponent the library holds no artifact.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Fabricate]
    library: [Forest, Island]
    battlefield: [Island, Island, Island]
steps:
  - p1 cast: Fabricate
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 0, options: [] }
  - p1 choose: finish
  - expect:
      p1.hand: []
      events lacks: [{ type: CARDS_REVEALED }]
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
