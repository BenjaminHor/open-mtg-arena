name: Terramorphic Expanse taps and sacrifices itself the turn it's played, and fetches a tapped basic land
rules: [CR 602.2, CR 701.21a, CR 605.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Terramorphic Expanse, Mountain]
    library: [Swamp, Island]
steps:
  - p1 play: Terramorphic Expanse
  - p1 activate: Terramorphic Expanse
  - expect:
      p1.graveyard: [Terramorphic Expanse]
      stack: [Terramorphic Expanse ability]
  - all pass: once
  - p1 choose: Swamp
  - expect:
      p1.battlefield: [Swamp]
      p1:Swamp.tapped: true
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
