name: Fabricate may find nothing even when the library holds an artifact, revealing nothing
rules: [CR 701.23b, CR 701.23e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Fabricate]
    library: [Forest, Ornithopter]
    battlefield: [Island, Island, Island]
steps:
  - p1 cast: Fabricate
    pay: auto
  - all pass: once
  - p1 choose: finish
  - expect:
      p1.hand: []
      p1.library count: 2
      events lacks: [{ type: CARDS_REVEALED }]
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
