name: Rampant Growth may find nothing, and its controller still shuffles
rules: [CR 701.23b, CR 701.24a]
# Rampant Growth's ruling: you don't have to find the card if you don't want to.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Rampant Growth]
    library: [Forest, Grizzly Bears]
    battlefield: [Forest, Forest]
steps:
  - p1 cast: Rampant Growth
    pay: auto
  - all pass: once
  - p1 choose: finish
  - expect:
      p1.library count: 2
      p1.battlefield count: 2
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }]
