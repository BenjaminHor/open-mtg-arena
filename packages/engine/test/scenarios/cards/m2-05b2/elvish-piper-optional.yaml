name: Elvish Piper's "you may" can be declined, and is asked even with no creature card in hand
rules: [CR 608.2d]
# Elvish Piper's ruling: putting the card onto the battlefield is optional. Asking even with no creature card keeps
# the hand's contents hidden (D-062).
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Elvish Piper, Forest, Forest]
steps:
  - p1 activate: Elvish Piper
    pay: auto
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, min: 0, max: 1, options: [] }
  - p1 choose: finish
  - expect:
      p1.hand: [Lightning Bolt]
      pending: { player: p1, kind: priority }
