name: A player conceding while Ponder's "you may shuffle" waits ends the game
rules: [CR 104.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ponder]
    library: [Forest]
    battlefield: [Island]
steps:
  - p1 cast: Ponder
    pay: auto
  - all pass: once
  - p1 choose: Forest
  - expect:
      pending: { player: p1, kind: chooseYesNo }
  - p1 concede: now
  - expect:
      winner: p2
