name: Ponder's "you may shuffle" shuffles the whole library, the three cards included
rules: [CR 701.24a]
# Ponder's ruling: the shuffle includes the three cards just looked at.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Ponder]
    library: [Forest, Island, Mountain, Swamp]
    battlefield: [Island]
steps:
  - p1 cast: Ponder
    pay: auto
  - all pass: once
  - p1 choose: Forest
  - p1 choose: Island
  - p1 choose: Mountain
  - p1 choose: yes
  - expect:
      events contains: [{ type: LIBRARY_SHUFFLED, player: p1 }, { type: CARD_DRAWN, player: p1 }]
      p1.hand count: 1
      p1.library count: 3
