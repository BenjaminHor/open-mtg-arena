name: Haunting Echoes with only basic lands in the graveyard exiles nothing, searches nothing, and the target shuffles
rules: [CR 701.24a]
# The owner's ruling (D-063): "for each card exiled this way" with none exiled means no search.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Haunting Echoes]
    battlefield: [Swamp, Swamp, Swamp, Swamp, Swamp]
  p2:
    graveyard: [Forest]
    library: [Grizzly Bears, Island]
steps:
  - p1 cast: Haunting Echoes
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Forest]
      pending: { player: p1, kind: priority }
      events contains: [{ type: LIBRARY_SHUFFLED, player: p2 }]
