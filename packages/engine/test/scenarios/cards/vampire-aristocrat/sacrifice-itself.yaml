name: Vampire Aristocrat can sacrifice itself to its own ability, but it isn't around to get the bonus
rules: [CR 701.21a, CR 113.7a, CR 400.7, CR 611.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Aristocrat]
steps:
  - p1 activate: Vampire Aristocrat
    sacrifice: Vampire Aristocrat
  - expect:
      p1.graveyard: [Vampire Aristocrat]
      stack: [Vampire Aristocrat ability]
  - all pass: once
  - expect:
      stack: []
      p1.graveyard: [Vampire Aristocrat]
      events contains: [{ type: ABILITY_RESOLVED }]
