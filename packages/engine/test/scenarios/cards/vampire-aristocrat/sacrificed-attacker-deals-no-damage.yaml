name: An attacking creature sacrificed during the declare blockers step deals no combat damage
rules: [CR 506.4, CR 701.21a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Aristocrat, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p1 activate: Vampire Aristocrat
    sacrifice: Grizzly Bears
  - all pass: once
  - all pass: until main2
  - expect:
      p2.life: 20
