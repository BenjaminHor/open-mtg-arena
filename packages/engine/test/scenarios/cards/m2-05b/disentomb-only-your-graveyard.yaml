name: Disentomb can't target a creature card in another player's graveyard
rules: [CR 109.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Disentomb]
    graveyard: [Grizzly Bears]
    battlefield: [Swamp]
  p2:
    graveyard: [Hill Giant]
steps:
  - p1 cast: Disentomb
    targets: [graveyard:p2:Hill Giant]
    pay: auto
  - expect error: illegalAction
