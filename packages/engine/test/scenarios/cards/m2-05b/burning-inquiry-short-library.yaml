name: A player with too few cards still discards three at random, and loses for drawing from an empty library
rules: [CR 121.4, CR 704.5b]
# Burning Inquiry's rulings: each player discards three even if they didn't draw three.
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Burning Inquiry]
    library: [Forest, Forest, Forest, Forest, Forest, Forest, Forest]
    battlefield: [Mountain]
  p2:
    hand: [Island, Island]
    library: [Forest]
steps:
  - p1 cast: Burning Inquiry
    pay: auto
  - all pass: once
  - expect:
      p2.hand count: 0
      p2.graveyard count: 3
      winner: p1
