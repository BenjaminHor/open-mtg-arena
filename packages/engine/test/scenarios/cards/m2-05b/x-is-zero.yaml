name: With X of 0, Mind Spring draws nothing and Mind Shatter discards nothing
rules: [CR 107.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Mind Spring, Mind Shatter]
    battlefield: [Island, Island, Swamp, Swamp]
  p2:
    hand: [Forest]
steps:
  - p1 cast: Mind Spring
    x: 0
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Mind Shatter]
      events lacks: [{ type: CARD_DRAWN }]
  - p1 cast: Mind Shatter
    x: 0
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.hand: [Forest]
      events lacks: [{ type: CARD_DISCARDED }]
