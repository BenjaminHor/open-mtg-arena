name: Divination draws two cards, one at a time
rules: [CR 121.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Divination]
    library: [Forest, Forest, Forest, Forest, Forest, Forest, Forest]
    battlefield: [Island, Island, Island]
steps:
  - p1 cast: Divination
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Forest, Forest]
      p1.library count: 5
