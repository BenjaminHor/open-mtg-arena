name: With fewer than five cards in the library, Tome Scour mills them all
rules: [CR 701.17a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Tome Scour]
    battlefield: [Island]
  p2:
    library: [Forest, Mountain, Island]
steps:
  - p1 cast: Tome Scour
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.library: []
      p2.graveyard count: 3
