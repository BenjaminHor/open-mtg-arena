name: When X is more than the cards in hand, Mind Shatter discards the whole hand
rules: [CR 701.9b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Mind Shatter]
    battlefield: [Swamp, Swamp, Swamp, Swamp, Swamp]
  p2:
    hand: [Forest, Mountain]
steps:
  - p1 cast: Mind Shatter
    x: 3
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.hand: []
      p2.graveyard count: 2
