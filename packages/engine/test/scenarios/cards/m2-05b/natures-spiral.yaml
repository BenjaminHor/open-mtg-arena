name: Nature's Spiral returns a permanent card, such as a land, but not an instant
rules: [CR 110.4a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Nature's Spiral, Nature's Spiral]
    graveyard: [Mountain, Forest, Lightning Bolt]
    battlefield: [Forest, Forest, Forest, Forest]
steps:
  - p1 cast: Nature's Spiral
    targets: [graveyard:p1:Mountain]
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Nature's Spiral, Mountain]
  - p1 cast: Nature's Spiral
    targets: [graveyard:p1:Lightning Bolt]
    pay: auto
  - expect error: illegalAction
