name: Disentomb returns a creature card from its caster's graveyard to their hand
rules: [CR 109.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Disentomb, Disentomb]
    graveyard: [Grizzly Bears, Grizzly Bears, Lightning Bolt]
    battlefield: [Swamp, Swamp]
  p2:
    graveyard: [Hill Giant]
steps:
  - p1 cast: Disentomb
    targets: [graveyard:p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Disentomb, Grizzly Bears]
  - p1 cast: Disentomb
    targets: [graveyard:p1:Lightning Bolt]
    pay: auto
  - expect error: illegalAction
