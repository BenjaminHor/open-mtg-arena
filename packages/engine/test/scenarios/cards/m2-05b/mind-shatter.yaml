name: Mind Shatter makes its target discard X cards at random
rules: [CR 701.9b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Mind Shatter]
    battlefield: [Swamp, Swamp, Swamp, Swamp]
  p2:
    hand: [Forest, Mountain, Island]
steps:
  - p1 cast: Mind Shatter
    x: 2
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.hand count: 1
      p2.graveyard count: 2
