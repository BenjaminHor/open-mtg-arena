name: Sign in Blood can target its caster, who loses for drawing from an empty library
rules: [CR 115.1, CR 121.4, CR 704.5b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Sign in Blood]
    library: [Forest]
    battlefield: [Swamp, Swamp]
steps:
  - p1 cast: Sign in Blood
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Forest]
      p1.life: 18
      winner: p2
