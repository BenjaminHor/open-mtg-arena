name: Sign in Blood makes its target player draw two cards and lose 2 life
rules: [CR 119.3, CR 121.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Sign in Blood]
    battlefield: [Swamp, Swamp]
  p2:
    library: [Forest, Forest, Forest, Forest, Forest, Forest, Forest]
steps:
  - p1 cast: Sign in Blood
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.hand count: 2
      p2.life: 18
      events contains: [{ type: LIFE_LOST, player: p2, amount: 2 }]
