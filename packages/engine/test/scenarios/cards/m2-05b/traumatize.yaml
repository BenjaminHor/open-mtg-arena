name: Traumatize mills half the target's library, rounded down
rules: [CR 701.17a, CR 107.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Traumatize]
    battlefield: [Island, Island, Island, Island, Island]
  p2:
    library: [Forest, Mountain, Island, Plains, Swamp, Grizzly Bears, Lightning Bolt]
steps:
  - p1 cast: Traumatize
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.library: [Plains, Swamp, Grizzly Bears, Lightning Bolt]
      p2.graveyard count: 3
