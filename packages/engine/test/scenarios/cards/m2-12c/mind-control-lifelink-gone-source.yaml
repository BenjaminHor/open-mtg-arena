name: A stolen Pyromancer with Lifelink killed in response still gains its thief the life (last known information)
rules: [CR 702.15b, CR 702.15c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 10
    battlefield: [{ card: Mind Control, attachedTo: p2:Prodigal Pyromancer }]
  p2:
    battlefield: [Prodigal Pyromancer, Mountain, { card: Lifelink, attachedTo: p2:Prodigal Pyromancer }]
    hand: [Shock]
steps:
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Prodigal Pyromancer]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard contains: [Prodigal Pyromancer, Lifelink]
      p1.graveyard: [Mind Control]
  - all pass: once
  - expect:
      p2.life: 19
      p1.life: 11
