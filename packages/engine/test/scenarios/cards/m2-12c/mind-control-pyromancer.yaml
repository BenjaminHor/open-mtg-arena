name: A Pyromancer stolen with Mind Control can't use its tap ability until its thief's next turn, and its owner can't use it
rules: [CR 302.6, CR 602.5a, CR 613.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island]
    hand: [Mind Control]
  p2:
    battlefield: [Prodigal Pyromancer]
steps:
  - p1 cast: Mind Control
    targets: [p2:Prodigal Pyromancer]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Prodigal Pyromancer]
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - expect error: illegalAction
  - all pass: until main1
  - expect:
      active: p2
  - p2 activate: p1:Prodigal Pyromancer
    targets: [p1]
  - expect error: illegalAction
  - p2 pass: once
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - expect error: illegalAction
  - all pass: until main1
  - expect:
      active: p1
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - all pass: once
  - expect:
      p2.life: 19
