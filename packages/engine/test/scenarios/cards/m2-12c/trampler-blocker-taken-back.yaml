name: A trampler whose only blocker is taken back by its owner deals all its damage to the defending player
rules: [CR 702.19d, CR 506.4]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Forest, Forest, { card: Mind Control, attachedTo: p2:Hill Giant }]
    hand: [Naturalize]
  p2:
    battlefield: [Hill Giant, Stampeding Rhino]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p1 block: { Hill Giant: Stampeding Rhino }
  - p2 pass: once
  - p1 cast: Naturalize
    targets: [p1:Mind Control]
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p1.life: 16
      p2:Hill Giant.damage: 0
