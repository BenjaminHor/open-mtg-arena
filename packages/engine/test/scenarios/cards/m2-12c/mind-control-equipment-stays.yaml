name: A creature stolen with Mind Control keeps its Equipment, whose controller is still its owner (its ruling)
rules: [CR 301.5d, CR 303.4e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island]
    hand: [Mind Control]
  p2:
    battlefield: [Hill Giant, { card: Gorgon Flail, attachedTo: p2:Hill Giant }]
steps:
  - p1 cast: Mind Control
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p1:Hill Giant.power: 4
      p1:Hill Giant.abilities contains: [deathtouch]
      p2.battlefield contains: [Gorgon Flail]
