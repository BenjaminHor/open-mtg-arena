name: Act of Treason after Mind Control wins until end of turn (the later timestamp), then Mind Control's controller has it again
rules: [CR 613.7, CR 613.7a, CR 613.1b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Mind Control, attachedTo: p2:Hill Giant }]
  p2:
    battlefield: [Hill Giant, Mountain, Mountain, Mountain]
    hand: [Act of Treason]
steps:
  - expect:
      p1.battlefield contains: [Hill Giant]
  - p2 cast: Act of Treason
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield contains: [Hill Giant]
  - all pass: until main1
  - expect:
      p1.battlefield contains: [Hill Giant]
