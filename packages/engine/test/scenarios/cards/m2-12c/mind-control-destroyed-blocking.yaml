name: Mind Control destroyed while its creature blocks takes it out of combat; the attacker stays blocked and deals no damage
rules: [CR 506.4, CR 509.1h, CR 510.1d]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Forest, Forest, { card: Mind Control, attachedTo: p2:Hill Giant }]
    hand: [Naturalize]
  p2:
    battlefield: [Hill Giant, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p1 block: { Hill Giant: Grizzly Bears }
  - p2 pass: once
  - p1 cast: Naturalize
    targets: [p1:Mind Control]
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield contains: [Hill Giant, Grizzly Bears]
  - all pass: until main2
  - expect:
      p1.life: 20
      p2:Hill Giant.damage: 0
      p2:Grizzly Bears.damage: 0
