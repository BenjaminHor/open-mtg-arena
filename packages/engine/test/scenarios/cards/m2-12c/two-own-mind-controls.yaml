name: Two of p1's own Mind Controls, the later destroyed, change no control, so the creature isn't summoning sick
rules: [CR 302.6, CR 613.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Mind Control, attachedTo: p2:Hill Giant }, { card: Mind Control, attachedTo: p2:Hill Giant }]
  p2:
    battlefield: [Hill Giant, Forest, Forest]
    hand: [Naturalize]
steps:
  - p1 pass: once
  - p2 cast: Naturalize
    targets: [p1:Mind Control#2]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Hill Giant, Mind Control]
      p1:Hill Giant.sick: false
