name: Stolen with Act of Treason, then enchanted with Mind Control, a creature stays when Act of Treason ends
rules: [CR 613.1b, CR 611.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Island, Island, Island, Island, Island]
    hand: [Act of Treason, Mind Control]
  p2:
    battlefield: [Hill Giant]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - p1 cast: Mind Control
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - all pass: until main1
  - expect:
      p1.battlefield contains: [Hill Giant, Mind Control]
      p2.battlefield: []
