name: Mind Control on a creature its caster already controls changes nothing, so it isn't summoning sick
rules: [CR 302.6, CR 613.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant, Island, Island, Island, Island, Island]
    hand: [Mind Control]
steps:
  - p1 cast: Mind Control
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Hill Giant, Mind Control]
      p1:Hill Giant.sick: false
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until main2
  - expect:
      p2.life: 17
