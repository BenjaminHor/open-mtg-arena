name: Lifelink on a creature stolen with Mind Control gains life for the thief, the creature's controller
rules: [CR 702.15b, CR 613.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 10
    battlefield: [{ card: Mind Control, attachedTo: p2:Hill Giant }]
  p2:
    battlefield: [Hill Giant, { card: Lifelink, attachedTo: p2:Hill Giant }]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until main2
  - expect:
      p1.life: 13
      p2.life: 17
