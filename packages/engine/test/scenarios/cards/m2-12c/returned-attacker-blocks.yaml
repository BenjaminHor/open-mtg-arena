name: A creature removed from combat when its Mind Control is destroyed can block for its owner later that combat
rules: [CR 506.4, CR 509.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, { card: Mind Control, attachedTo: p2:Serra Angel }]
  p2:
    battlefield: [Serra Angel, Forest, Forest]
    hand: [Naturalize]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Serra Angel, Grizzly Bears]
  - p1 pass: once
  - p2 cast: Naturalize
    targets: [p1:Mind Control]
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield contains: [Serra Angel]
      p2:Serra Angel.tapped: false
  - all pass: until combat.declareBlockers
  - p2 block: { Serra Angel: Grizzly Bears }
  - all pass: until main2
  - expect:
      p2.life: 20
      p1.graveyard contains: [Grizzly Bears, Mind Control]
      p2:Serra Angel.damage: 2
