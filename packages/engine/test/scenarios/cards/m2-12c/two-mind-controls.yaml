name: The later of two Mind Controls on a creature wins; destroy it, and the earlier one's controller has the creature back
rules: [CR 613.7, CR 613.7a, CR 704.5m]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Mind Control, attachedTo: p2:Hill Giant }, Forest, Forest]
    hand: [Naturalize]
  p2:
    battlefield: [Hill Giant, Island, Island, Island, Island, Island]
    hand: [Mind Control]
steps:
  - p2 cast: Mind Control
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield contains: [Hill Giant, Mind Control]
  - p2 pass: once
  - p1 cast: Naturalize
    targets: [p2:Mind Control]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Hill Giant, Mind Control]
      p2.graveyard contains: [Mind Control]
