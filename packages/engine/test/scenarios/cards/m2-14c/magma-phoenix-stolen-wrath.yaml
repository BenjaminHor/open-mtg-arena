  p1:
    battlefield: [{ card: Mind Control, attachedTo: p2:Magma Phoenix }, { card: Lifelink, attachedTo: p2:Magma Phoenix }]
  p2:
    battlefield: [Magma Phoenix, Plains, Plains, Plains, Plains, Plains, Plains]
