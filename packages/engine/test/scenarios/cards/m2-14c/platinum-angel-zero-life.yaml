name: With Platinum Angel you don't lose at 0 life, and you lose once it's gone
rules: [CR 104.3b, CR 704.5a, CR 101.2]
setup:
  turn: { active: p2, step: main1 }
  p1:
    life: 3
    battlefield: [Platinum Angel]
  p2:
    battlefield: [Mountain, Swamp, Swamp]
    hand: [Lightning Bolt, Doom Blade]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.life: 0
      winner: (game not over)
  - p2 cast: Doom Blade
    targets: [p1:Platinum Angel]
    pay: auto
  - all pass: once
  - expect:
      winner: p2
      events contains: [{ type: PLAYER_LOST, player: p1, reason: zeroLife }]
