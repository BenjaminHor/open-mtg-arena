name: Platinum Angel changes sides with Mind Control, and then protects its new controller
rules: [CR 104.3b, CR 704.5a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 3
    battlefield: [Island, Island, Island, Island, Island]
    hand: [Mind Control]
  p2:
    life: 2
    battlefield: [Platinum Angel, Mountain]
    hand: [Lightning Bolt]
steps:
  - p1 cast: Mind Control
    targets: [p2:Platinum Angel]
    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.life: 0
      winner: (game not over)
