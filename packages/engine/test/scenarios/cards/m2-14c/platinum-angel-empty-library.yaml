name: With Platinum Angel, drawing from an empty library doesn't lose, and losing the Angel later doesn't either
rules: [CR 104.3c, CR 704.5b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Platinum Angel]
    library: []
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
    library: [Swamp, Swamp, Swamp]
steps:
  - all pass: until main1
  - expect:
      active: p1
      winner: (game not over)
  # The draw was attempted before the last check; only a later draw counts against p1 (CR 704.5b).
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Platinum Angel]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Platinum Angel]
      winner: (game not over)
