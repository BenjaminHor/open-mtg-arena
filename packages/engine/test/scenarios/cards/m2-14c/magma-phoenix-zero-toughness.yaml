name: Phoenix put into the graveyard for 0 toughness dies
rules: [CR 704.5f, CR 700.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Swamp, { card: Magma Phoenix, counters: { -1/-1: 2 } }]
    hand: [Weakness]
steps:
  - p1 cast: Weakness
    targets: [p1:Magma Phoenix]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Magma Phoenix, Weakness]
      stack: [Magma Phoenix ability]
  - all pass: once
  - expect:
      p1.life: 17
