name: Two Phoenixes trade in combat; both trigger
rules: [CR 603.10a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Magma Phoenix]
  p2:
    battlefield: [Magma Phoenix]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Magma Phoenix]
  - all pass: until combat.declareBlockers
  - p2 block: { Magma Phoenix: Magma Phoenix }
  - all pass: until combat.damage
  - expect:
      stack: [Magma Phoenix ability, Magma Phoenix ability]
  - all pass: once
  - all pass: once
  - expect:
      p1.life: 14
      p2.life: 14
