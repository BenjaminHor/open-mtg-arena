name: Angel dies in the same check; its controller at 0 loses at the repeated check
rules: [CR 704.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 3
    battlefield: [Mountain, { card: Platinum Angel, damage: 1 }, Magma Phoenix]
    hand: [Lightning Bolt]
steps:
  - p1 cast: Lightning Bolt
    targets: [p1:Magma Phoenix]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      winner: p2
      events contains: [{ type: PLAYER_LOST, player: p1, reason: zeroLife }]
