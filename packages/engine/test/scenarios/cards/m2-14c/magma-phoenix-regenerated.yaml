name: A regenerated Phoenix doesn't die and doesn't trigger
rules: [CR 701.19a, CR 700.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest, Magma Phoenix]
    hand: [Regenerate]
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
steps:
  - p1 cast: Regenerate
    targets: [p1:Magma Phoenix]
    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Magma Phoenix]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Magma Phoenix]
      p1:Magma Phoenix.tapped: true
      stack: []
      p1.life: 20
