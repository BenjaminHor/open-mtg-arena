name: Platinum Angel doesn't protect its owner once someone else controls it, so they lose at 0 life
rules: [CR 104.3b, CR 704.5a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Island, Island, Island, Island, Island]
    hand: [Lightning Bolt, Mind Control]
  p2:
    life: 3
    battlefield: [Platinum Angel]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.life: 0
      winner: (game not over)
  - p1 cast: Mind Control
    targets: [p2:Platinum Angel]
    pay: auto
  - all pass: once
  - expect:
      winner: p1
      events contains: [{ type: PLAYER_LOST, player: p2, reason: zeroLife }]
