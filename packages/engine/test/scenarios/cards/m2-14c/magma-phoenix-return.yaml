name: Magma Phoenix's last ability works only from its owner's graveyard, and returns it to their hand
rules: [CR 113.6m, CR 602.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Magma Phoenix]
    graveyard: [Magma Phoenix]
  p2:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain]
steps:
  - p1 activate: p1:Magma Phoenix
    ability: 1
  - expect error: illegalAction
  - p1 activate: graveyard:p1:Magma Phoenix
    ability: 1
    pay: auto
  - all pass: once
  - expect:
      p1.hand: [Magma Phoenix]
      p1.graveyard: []
