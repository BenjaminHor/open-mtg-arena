name: Angel gone, the next draw from an empty library loses
rules: [CR 704.5b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Platinum Angel]
    library: []
  p2:
    battlefield: [Swamp, Swamp]
    hand: [Doom Blade]
    library: [Swamp, Swamp, Swamp]
steps:
  - all pass: until main1
  - p1 pass: once
  - p2 cast: Doom Blade
    targets: [p1:Platinum Angel]
    pay: auto
  - all pass: once
  - expect:
      winner: (game not over)
  - all pass: until main1
  - expect:
      winner: (game not over)
      active: p2
  - all pass: until draw
  - expect:
      winner: p2
