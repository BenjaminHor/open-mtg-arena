name: A stolen Magma Phoenix's trigger is the thief's; lifelink from LKI goes to the thief; only the owner returns it
rules: [CR 603.3a, CR 702.15c]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Mind Control, attachedTo: p2:Magma Phoenix }, { card: Lifelink, attachedTo: p2:Magma Phoenix }, Mountain, Mountain, Mountain, Mountain, Mountain]
  p2:
    battlefield: [Magma Phoenix, Swamp, Swamp, Mountain, Mountain, Mountain, Mountain, Mountain]
    hand: [Doom Blade]
steps:
  - expect:
      p1.battlefield contains: [Magma Phoenix]
  - p2 cast: Doom Blade
    targets: [p1:Magma Phoenix]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard contains: [Magma Phoenix]
      stack: [Magma Phoenix ability]
      events contains: [{ type: ABILITY_TRIGGERED, controller: p1 }]
  - all pass: once
  - expect:
      p1.life: 23
      p2.life: 17
  - p2 pass: once
  - p1 activate: graveyard:p2:Magma Phoenix
    ability: 1
  - expect error: illegalAction
  - p1 pass: once
  - p2 activate: graveyard:p2:Magma Phoenix
    ability: 1
    pay: auto
  - all pass: once
  - expect:
      p2.hand: [Magma Phoenix]
