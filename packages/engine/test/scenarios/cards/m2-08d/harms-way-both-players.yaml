name: Two players' Harm's Ways on one source; the damage goes to p2, comes back to p1, and p1's own doesn't apply again
rules: [CR 616.1f, CR 614.5, CR 614.9]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains]
    hand: [Harm's Way]
  p2:
    battlefield: [Plains, Grizzly Bears]
    hand: [Harm's Way]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 choose: Grizzly Bears
  - p2 cast: Harm's Way
    targets: [p1]
    pay: auto
  - all pass: once
  - p2 choose: Grizzly Bears
  - all pass: once
  - expect:
      p1.life: 18
      p2.life: 20
      events contains:
        - { type: DAMAGE_REDIRECTED, to: { kind: player, player: p2 } }
        - { type: DAMAGE_REDIRECTED, to: { kind: player, player: p1 } }
