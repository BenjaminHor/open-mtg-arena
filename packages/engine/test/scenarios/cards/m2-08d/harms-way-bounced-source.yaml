name: The source of an ability on the stack can be chosen even after it left the battlefield, and its damage is redirected
rules: [CR 609.7a, CR 113.7a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains, Island]
    hand: [Harm's Way, Unsummon]
  p2:
    battlefield: [Prodigal Pyromancer]
steps:
  - p2 activate: Prodigal Pyromancer
    targets: [p1]
  - p2 pass: once
  - p1 cast: Unsummon
    targets: [p2:Prodigal Pyromancer]
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 choose: Prodigal Pyromancer
  - all pass: once
  - expect:
      p2.hand: [Prodigal Pyromancer]
      p1.life: 20
      p2.life: 19
