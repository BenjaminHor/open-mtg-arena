name: If Harm's Way's target can't be dealt damage when the source would deal it, nothing is redirected
rules: [CR 614.9, CR 609.7b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains, Mountain]
    hand: [Harm's Way, Shock]
  p2:
    battlefield: [Hill Giant, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 choose: Hill Giant
  - p2 pass: once
  - p1 cast: Shock
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.life: 17
      events lacks: [{ type: DAMAGE_REDIRECTED }]
