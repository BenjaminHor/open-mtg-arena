name: Damage the source would already deal to Harm's Way's target isn't redirected; redirection deals it to another
rules: [CR 614.9]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Craw Wurm, Plains]
    hand: [Harm's Way]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p2 cast: Shock
    targets: [p1:Craw Wurm]
    pay: auto
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p1:Craw Wurm]
    pay: auto
  - all pass: once
  - p1 choose: Shock
  - all pass: once
  - expect:
      p1:Craw Wurm.damage: 2
      events lacks: [{ type: DAMAGE_REDIRECTED }]
