name: Redirected damage joins the same source's damage to the same player, and Guardian Seraph prevents 1 of it once
rules: [CR 615.10, CR 614.9]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Goblin Artillery, Plains]
    hand: [Harm's Way]
  p2:
    battlefield: [Guardian Seraph]
steps:
  - p1 cast: Harm's Way
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 choose: Goblin Artillery
  # 2 to p2 and 3 to p1; Harm's Way sends 2 of p1's 3 to p2, so p2 is dealt 4 by one source in one event.
  - p1 activate: Goblin Artillery
    targets: [p2]
  - all pass: once
  - expect:
      p1.life: 19
      p2.life: 17
