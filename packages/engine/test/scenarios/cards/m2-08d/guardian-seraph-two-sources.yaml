name: Guardian Seraph prevents 1 of each opposing source's damage, so two attackers deal 5 and 1
rules: [CR 615.10, CR 510.2]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Guardian Seraph]
  p2:
    battlefield: [Craw Wurm, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm, Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p1 block: {}
  - all pass: once
  - expect:
      p1.life: 14
      events contains: [{ type: DAMAGE_PREVENTED, amount: 1 }, { type: DAMAGE_PREVENTED, amount: 1 }]
