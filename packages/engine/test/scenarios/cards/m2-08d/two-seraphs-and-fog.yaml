name: Two Guardian Seraphs and Fog give two options, not three; each Seraph still applies once if chosen first
rules: [CR 616.1, CR 616.1f, CR 615.10]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Guardian Seraph, Guardian Seraph, Forest]
    hand: [Fog]
  p2:
    battlefield: [Craw Wurm]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p1 block: {}
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: Guardian Seraph
  # The other Seraph or Fog: a different choice now (CR 616.1f).
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: Guardian Seraph
  - expect:
      p1.life: 20
      events contains:
        - { type: DAMAGE_PREVENTED, amount: 1 }
        - { type: DAMAGE_PREVENTED, amount: 1 }
        - { type: DAMAGE_PREVENTED, amount: 4 }
