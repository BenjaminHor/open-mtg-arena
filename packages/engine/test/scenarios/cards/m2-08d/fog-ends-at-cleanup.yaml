name: Fog lasts only this turn; the next turn's combat damage is dealt
rules: [CR 514.2, CR 615.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest]
    hand: [Fog]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      active: p2
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p1.life: 18
