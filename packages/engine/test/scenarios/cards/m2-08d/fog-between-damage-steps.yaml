name: Fog cast after first-strike damage prevents only the regular combat damage step
rules: [CR 615.1a, CR 510.4]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Deadly Recluse, Forest]
    hand: [Fog]
  p2:
    battlefield: [Lightwielder Paladin, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Lightwielder Paladin, Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p1 block: { Deadly Recluse: Grizzly Bears }
  - all pass: once
  # The Paladin's trigger has no black or red permanent to target, so nothing waits.
  - expect:
      p1.life: 16
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p1.battlefield contains: [Deadly Recluse]
      p2.battlefield contains: [Grizzly Bears]
