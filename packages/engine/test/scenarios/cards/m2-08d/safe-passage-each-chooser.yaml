name: Damage to a creature is chosen for by its controller, and the active player chooses first (APNAP)
rules: [CR 616.1, CR 101.4, CR 615.1a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Hill Giant, Forest, Plains, Plains, Plains]
    hand: [Fog, Safe Passage]
  p2:
    battlefield: [Craw Wurm, Plains, Plains, Plains]
    hand: [Safe Passage]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p1 block: { Hill Giant: Craw Wurm }
  - p2 cast: Safe Passage
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 cast: Safe Passage
    pay: auto
  - all pass: once
  - all pass: once
  # The Hill Giant's damage to the Wurm: p2's Safe Passage and Fog, chosen by the Wurm's controller, the active player.
  - expect:
      pending: { player: p2, kind: chooseReplacement, for: { kind: damage, to: { kind: object } } }
  - p2 choose: Safe Passage
  # The Wurm's damage to the Giant: p1's Safe Passage and Fog, chosen by the Giant's controller.
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: Fog
  - expect:
      p1.battlefield contains: [Hill Giant]
      p2.battlefield contains: [Craw Wurm]
      events contains: [{ type: DAMAGE_PREVENTED, amount: 6 }, { type: DAMAGE_PREVENTED, amount: 3 }]
