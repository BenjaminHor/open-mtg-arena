name: Guardian Seraph, Fog and Safe Passage on one combat damage entry are applied in the order chosen; Fog, last, has nothing left
rules: [CR 616.1, CR 616.1f, CR 615.10]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Guardian Seraph, Forest, Plains, Plains, Plains]
    hand: [Fog, Safe Passage]
  p2:
    battlefield: [Craw Wurm]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p1 block: {}
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 cast: Safe Passage
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: Guardian Seraph
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: Safe Passage
  - expect:
      p1.life: 20
      events contains: [{ type: DAMAGE_PREVENTED, amount: 1 }, { type: DAMAGE_PREVENTED, amount: 5 }]
