name: Fog cast after attackers are declared prevents all combat damage; the attacker and blocker both survive
rules: [CR 615.1a, CR 615.6, CR 510.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Craw Wurm, Grizzly Bears]
  p2:
    battlefield: [Hill Giant, Forest]
    hand: [Fog]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Craw Wurm, Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Craw Wurm }
  - p1 pass: once
  - p2 cast: Fog
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p2.life: 20
      p2.battlefield contains: [Hill Giant]
      p1:Craw Wurm.damage: 0
      events contains: [{ type: DAMAGE_PREVENTED }]
