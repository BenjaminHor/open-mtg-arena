name: Redirected combat damage is still combat damage, so Fog prevents it at its new recipient
rules: [CR 614.9, CR 616.1f, CR 615.1a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains, Forest]
    hand: [Harm's Way, Fog]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 choose: Grizzly Bears
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - all pass: once
  # Fog and Harm's Way both apply to the Bears' damage to p1: Harm's Way first, then Fog sees it at p2.
  - expect:
      pending: { player: p1, kind: chooseReplacement }
  - p1 choose: Harm's Way
  - expect:
      p1.life: 20
      p2.life: 20
      events contains:
        - { type: DAMAGE_REDIRECTED, amount: 2 }
        - { type: DAMAGE_PREVENTED, amount: 2, to: { kind: player, player: p2 } }
