name: Combat damage prevented isn't dealt, so a lifelinker's controller gains no life from it
rules: [CR 615.6, CR 702.15b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Child of Night]
  p2:
    battlefield: [Forest]
    hand: [Fog]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Child of Night]
  - all pass: until combat.declareBlockers
  - p1 pass: once
  - p2 cast: Fog
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p2.life: 20
      p1.life: 20
      events lacks: [{ type: LIFE_GAINED }]
