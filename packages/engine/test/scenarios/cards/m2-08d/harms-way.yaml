name: Harm's Way redirects an attacker's 2 combat damage from its controller to its target
rules: [CR 614.9, CR 609.7a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains]
    hand: [Harm's Way]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p2]
    pay: auto
  - all pass: once
  # As it resolves, its controller chooses the source: a permanent or a spell (CR 609.7a).
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: damageSource }
  - p1 choose: Grizzly Bears
  - all pass: once
  - expect:
      p1.life: 20
      p2.life: 18
      events contains: [{ type: DAMAGE_REDIRECTED, amount: 2, to: { kind: player, player: p2 } }]
