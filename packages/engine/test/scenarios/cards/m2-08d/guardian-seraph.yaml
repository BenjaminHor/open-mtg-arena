name: Guardian Seraph prevents 1 of the damage an opponent's source would deal to its controller
rules: [CR 615.10, CR 615.1a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Guardian Seraph]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.life: 18
      events contains: [{ type: DAMAGE_PREVENTED, amount: 1 }]
