name: A Fog from each player is the same effect twice, so no one is asked which applies first
rules: [CR 616.1, CR 615.1a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Forest]
    hand: [Fog]
  p2:
    battlefield: [Craw Wurm, Forest]
    hand: [Fog]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p2 cast: Fog
    pay: auto
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - all pass: once
  - all pass: once
  - expect:
      step: combat.damage
      p1.life: 20
      events contains: [{ type: DAMAGE_PREVENTED, amount: 6 }]
