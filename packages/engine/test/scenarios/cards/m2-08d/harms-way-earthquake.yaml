name: Harm's Way on Earthquake redirects its damage to p1 and p1's creature, not its damage to p2, the target's controller
rules: [CR 614.9, CR 609.7a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains, Grizzly Bears]
    hand: [Harm's Way]
  p2:
    battlefield: [Mountain, Mountain, Hill Giant]
    hand: [Earthquake]
steps:
  - p2 cast: Earthquake
    x: 1
    pay: auto
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - p1 choose: Earthquake
  - all pass: once
  # 1 to p1 and 1 to the Bears go to the Hill Giant, with its own 1: 3 in all. p2's 1 stays.
  - expect:
      p1.life: 20
      p1:Grizzly Bears.damage: 0
      p2.life: 19
      p2.graveyard: [Earthquake, Hill Giant]
