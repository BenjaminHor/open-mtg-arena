name: Harm's Way redirects only 2 of a 3-damage source's damage; the rest is dealt to its controller
rules: [CR 614.9, CR 615.7]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains]
    hand: [Harm's Way]
  p2:
    battlefield: [Hill Giant, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 choose: Hill Giant
  - all pass: once
  - expect:
      p1.life: 19
      p2.graveyard: [Grizzly Bears]
