name: Fog prevents only combat damage; Lightning Bolt still deals its damage
rules: [CR 615.1a, CR 120.2a]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Forest]
    hand: [Fog]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p2 pass: once
  - p1 cast: Fog
    pay: auto
  - all pass: once
  - p2 cast: Lightning Bolt
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.life: 17
