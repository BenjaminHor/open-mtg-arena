name: Safe Passage protects a creature that arrives after it resolves, for the rest of the turn
rules: [CR 615.1a, CR 611.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains, Plains, Plains, Forest, Forest]
    hand: [Safe Passage, Grizzly Bears]
  p2:
    battlefield: [Mountain]
    hand: [Lightning Bolt]
steps:
  - p1 cast: Safe Passage
    pay: auto
  - all pass: once
  - p1 cast: Grizzly Bears
    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Grizzly Bears]
      p1:Grizzly Bears.damage: 0
