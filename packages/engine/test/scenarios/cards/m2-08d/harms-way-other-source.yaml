name: Harm's Way redirects only its chosen source's damage; another attacker's damage is dealt as usual
rules: [CR 609.7a, CR 614.9]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Plains]
    hand: [Harm's Way]
  p2:
    battlefield: [Grizzly Bears, Hill Giant]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears, Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 pass: once
  - p1 cast: Harm's Way
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 choose: Grizzly Bears
  - all pass: once
  - expect:
      p1.life: 17
      p2.life: 18
