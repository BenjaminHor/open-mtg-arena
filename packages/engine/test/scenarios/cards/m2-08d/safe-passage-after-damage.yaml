name: Safe Passage doesn't undo damage already dealt; it prevents only damage dealt after it resolves
rules: [CR 615.1, CR 615.3]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Craw Wurm, Plains, Plains, Plains]
    hand: [Safe Passage]
  p2:
    battlefield: [Mountain, Mountain]
    hand: [Lightning Bolt, Shock]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1:Craw Wurm]
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 cast: Safe Passage
    pay: auto
  - all pass: once
  - p2 cast: Shock
    targets: [p1:Craw Wurm]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Craw Wurm]
      p1:Craw Wurm.damage: 3
