name: Fog prevents all of Hypnotic Specter's combat damage, so its "deals damage to an opponent" ability doesn't trigger
rules: [CR 603.2g, CR 615.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hypnotic Specter]
  p2:
    battlefield: [Forest]
    hand: [Fog, Island]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hypnotic Specter]
  - all pass: until combat.declareBlockers
  - p1 pass: once
  - p2 cast: Fog
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      stack: []
      p2.life: 20
      p2.hand: [Island]
      events contains: [{ type: DAMAGE_PREVENTED }]
