name: +1/+1 counters on an awakened land stay when it stops being a creature, and give it no power or toughness
rules: [CR 122.1a, CR 208.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Ajani Goldmane]
    hand: [Awakener Druid]
    manaPool: { G: 3 }
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p1 choose: p1:Forest
  - all pass: once
  - p1 activate: Ajani Goldmane
    ability: 2
  - all pass: once
  - expect:
      p1:Forest.power: 5
      p1:Forest.counters: { +1/+1: 1 }
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Awakener Druid]
    pay: auto
  - all pass: once
  - expect:
      p1:Forest.power: null
      p1:Forest.counters: { +1/+1: 1 }
