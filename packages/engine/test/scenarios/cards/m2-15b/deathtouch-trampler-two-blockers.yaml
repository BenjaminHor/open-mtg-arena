name: A trampler with deathtouch needs to give each blocker only 1 before the rest tramples over
rules: [CR 702.19b, CR 702.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino, { card: Gorgon Flail, attachedTo: p1:Stampeding Rhino }]
  p2:
    battlefield: [Grizzly Bears, Hill Giant]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Stampeding Rhino, Hill Giant: Stampeding Rhino }
  - all pass: until combat.damage
  - expect:
      pending: { kind: assignDamage, lethal: [1, 1] }
  - p1 assign: { Grizzly Bears: 1, Hill Giant: 1, p2: 3 }
  - expect:
      p2.life: 17
      p2.graveyard contains: [Grizzly Bears, Hill Giant]
