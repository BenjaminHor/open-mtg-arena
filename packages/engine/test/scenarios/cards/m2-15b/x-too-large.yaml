name: An X too large to ever be paid is refused, rather than making the engine build a cost of billions of symbols
rules: [CR 107.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Consume Spirit]
    battlefield: [Swamp, Swamp]
steps:
  - p1 cast: Consume Spirit
  - p1 choose: 5000000000
  - expect error: illegalAction
  - p1 choose: 0
  - expect:
      pending: { player: p1, kind: chooseTarget }
