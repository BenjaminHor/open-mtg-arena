name: A trampler attacking a planeswalker that's gone, its blocker gone too, deals no damage; trample doesn't reach the player
rules: [CR 702.19f, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino, Mountain, Mountain, Mountain]
    hand: [Lightning Bolt, Shock]
  p2:
    battlefield: [Jace Beleren, Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino -> Jace Beleren]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Stampeding Rhino }
  - p1 cast: Lightning Bolt
    targets: [p2:Jace Beleren]
    pay: auto
  - all pass: once
  - p1 cast: Shock
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: until combat.end
  - expect:
      p2.life: 20
      p2.graveyard contains: [Jace Beleren, Grizzly Bears]
