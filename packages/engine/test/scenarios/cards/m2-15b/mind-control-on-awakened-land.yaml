name: Mind Control on an awakened land goes to the graveyard when the land stops being a creature, and the land goes back to its owner
rules: [CR 704.5m, CR 611.2b, CR 613.1b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island, Mountain]
    hand: [Mind Control, Shock]
  p2:
    battlefield: [Forest, Forest, Forest, Forest]
    hand: [Awakener Druid]
steps:
  - p2 cast: Awakener Druid
    pay: auto
  - all pass: once
  - p2 choose: p2:Forest#4
  - all pass: once
  - all pass: until main1
  - p1 cast: Mind Control
    targets: [p2:Forest#4]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Forest, Mind Control]
      p1:Forest.power: 4
  - p1 cast: Shock
    targets: [p2:Awakener Druid]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard contains: [Mind Control]
      p2.battlefield contains: [Forest, Forest, Forest, Forest]
      p1.battlefield: [Island, Island, Island, Island, Island, Mountain]
      p2:Forest#4.power: null
