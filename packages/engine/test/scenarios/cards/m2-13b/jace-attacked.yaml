name: A creature attacking Jace Beleren deals its combat damage to it, removing loyalty, not to its controller
rules: [CR 508.1b, CR 510.1b, CR 120.3c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    battlefield: [Jace Beleren]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears -> Jace Beleren]
  - all pass: until combat.end
  - expect:
      p2:Jace Beleren.counters: { loyalty: 1 }
      p2.life: 20
