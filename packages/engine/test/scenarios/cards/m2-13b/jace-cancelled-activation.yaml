name: A cancelled loyalty activation doesn't count, so another loyalty ability can still be activated that turn
rules: [CR 606.3, CR 734.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Jace Beleren]
steps:
  - p1 activate: Jace Beleren
    ability: 2
  - p1 choose: cancel
  - expect:
      p1:Jace Beleren.counters: { loyalty: 3 }
  - p1 activate: Jace Beleren
    ability: 1
  - expect:
      p1:Jace Beleren.counters: { loyalty: 5 }
