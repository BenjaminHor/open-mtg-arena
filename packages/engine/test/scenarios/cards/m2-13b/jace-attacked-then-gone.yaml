name: A creature attacking a planeswalker that has left attacks nothing, so unblocked it deals no combat damage
rules: [CR 506.4c, CR 510.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Mountain]
    hand: [Lightning Bolt]
  p2:
    battlefield: [Jace Beleren]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears -> Jace Beleren]
  - p1 cast: Lightning Bolt
    targets: [p2:Jace Beleren]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Jace Beleren]
  - all pass: until combat.end
  - expect:
      p2.life: 20
