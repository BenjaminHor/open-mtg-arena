name: Jace Beleren's -1 removes a loyalty counter as its cost; the target player draws a card
rules: [CR 606.4, CR 115.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Jace Beleren]
steps:
  - p1 activate: Jace Beleren
    ability: 2
    targets: [p2]
  - expect:
      p1:Jace Beleren.counters: { loyalty: 2 }
  - all pass: once
  - expect:
      p1.hand count: 0
      p2.hand count: 1
