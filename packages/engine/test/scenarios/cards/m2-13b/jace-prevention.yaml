name: Fog prevents combat damage to Jace; Safe Passage, for "you and creatures you control", doesn't protect it
rules: [CR 615.1a, CR 120.3c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Mountain]
    hand: [Shock]
  p2:
    battlefield: [Jace Beleren, Forest, Plains, Plains, Plains]
    hand: [Fog, Safe Passage]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears -> Jace Beleren]
  - p1 pass: once
  - p2 cast: Fog
    pay: auto
  - all pass: once
  - all pass: until combat.end
  - expect:
      p2:Jace Beleren.counters: { loyalty: 3 }
  - all pass: until main2
  - p1 cast: Shock
    targets: [p2:Jace Beleren]
    pay: auto
  - p1 pass: once
  - p2 cast: Safe Passage
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p2:Jace Beleren.counters: { loyalty: 1 }
