name: Only one loyalty ability of a planeswalker each turn, even a different one
rules: [CR 606.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Jace Beleren]
steps:
  - p1 activate: Jace Beleren
    ability: 1
  - all pass: once
  - p1 activate: Jace Beleren
    ability: 2
    targets: [p2]
  - expect error: illegalAction
  - expect:
      p1:Jace Beleren.counters: { loyalty: 5 }
