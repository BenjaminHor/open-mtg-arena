name: No loyalty ability during its controller's combat, and a new turn allows one again
rules: [CR 606.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Jace Beleren]
steps:
  - p1 activate: Jace Beleren
    ability: 1
  - all pass: once
  - all pass: until combat.beginning
  - p1 activate: Jace Beleren
    ability: 2
    targets: [p1]
  - expect error: illegalAction
  # p1's next turn: "that turn" is over (CR 606.3).
  - all pass: until main1
  - all pass: until main1
  - expect:
      active: p1
  - p1 activate: Jace Beleren
    ability: 1
  - expect:
      p1:Jace Beleren.counters: { loyalty: 7 }
