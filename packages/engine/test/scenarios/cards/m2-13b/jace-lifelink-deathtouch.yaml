name: Lifelink still gains life for damage to Jace; deathtouch doesn't destroy a planeswalker
rules: [CR 120.3f, CR 702.15b, CR 704.5h, CR 702.2b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Child of Night, Deadly Recluse]
  p2:
    battlefield: [{ card: Jace Beleren, counters: { loyalty: 5 } }]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Child of Night -> Jace Beleren, Deadly Recluse -> Jace Beleren]
  - all pass: until combat.end
  - expect:
      p2:Jace Beleren.counters: { loyalty: 2 }
      p1.life: 22
      p2.life: 20
