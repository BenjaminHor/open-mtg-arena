name: A second Jace Beleren is a new permanent, so its loyalty abilities can be used the turn the first one's were
rules: [CR 606.3, CR 400.7, CR 306.5b, CR 704.5j]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Jace Beleren, Island, Island, Island]
    hand: [Jace Beleren]
steps:
  - p1 activate: Jace Beleren
    ability: 2
    targets: [p1]
  - all pass: once
  - p1 cast: Jace Beleren
    pay: auto
  - all pass: once
  # The old one has 2 loyalty, the new one its printed 3; keep the new one.
  - p1 choose: Jace Beleren#2
  - expect:
      p1:Jace Beleren.counters: { loyalty: 3 }
  - p1 activate: Jace Beleren
    ability: 1
  - expect:
      p1:Jace Beleren.counters: { loyalty: 5 }
