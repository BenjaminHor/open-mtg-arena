name: When Honor of the Pure leaves, its bonus ends at once, and a creature with damage marked equal to its toughness then dies
rules: [CR 611.3b, CR 704.5g]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Honor of the Pure, Veteran Armorsmith]
  p2:
    battlefield: [Mountain, Forest, Forest]
    hand: [Lightning Bolt, Naturalize]
steps:
  - p2 cast: Lightning Bolt
    targets: [p1:Veteran Armorsmith]
    pay: auto
  - all pass: once
  - expect:
      p1:Veteran Armorsmith.damage: 3
      p1:Veteran Armorsmith.toughness: 4
  - p2 cast: Naturalize
    targets: [p1:Honor of the Pure]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Honor of the Pure, Veteran Armorsmith]
