name: Kindled Fury cast after first-strike damage doesn't let the creature deal damage twice; it deals regular damage (CR 510.4)
rules: [CR 510.4, CR 613.1f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Rhox Pikemaster, Grizzly Bears, Mountain]
    hand: [Kindled Fury]
  p2:
    battlefield: [Hill Giant]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Rhox Pikemaster, Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Grizzly Bears }
  - all pass: until combat.damage
  - p1 cast: Kindled Fury
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p2.life: 17
      p2.graveyard: [Hill Giant]
      p1.graveyard: [Kindled Fury, Grizzly Bears]
