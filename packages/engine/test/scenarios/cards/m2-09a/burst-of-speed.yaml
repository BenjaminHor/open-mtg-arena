name: Burst of Speed gives haste to the creatures its controller controls as it resolves, not one cast after
rules: [CR 611.2c, CR 302.6, CR 702.10b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Forest, Forest, Forest]
    hand: [Grizzly Bears, Burst of Speed, Llanowar Elves]
steps:
  - p1 cast: Grizzly Bears
    pay: auto
  - all pass: once
  - p1 cast: Burst of Speed
    pay: auto
  - all pass: once
  - p1 cast: Llanowar Elves
    pay: auto
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Llanowar Elves]
  - expect error: illegalAction
  - p1 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p2.life: 18
