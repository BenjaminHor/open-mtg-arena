name: Merfolk Sovereign's ability can target any Merfolk, an opponent's attacker too, which then can't be blocked
rules: [CR 115.1, CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Coral Merfolk, Grizzly Bears]
  p2:
    battlefield: [Merfolk Sovereign, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Coral Merfolk, Grizzly Bears]
  - p1 pass: once
  - p2 activate: Merfolk Sovereign
    targets: [p1:Coral Merfolk]
  - all pass: once
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Coral Merfolk }
  - expect error: illegalAction
