name: Jump's flying ends in the cleanup step; on a later turn the creature can be blocked again
rules: [CR 514.2, CR 611.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Island]
    hand: [Jump]
  p2:
    battlefield: [Runeclaw Bear]
steps:
  - p1 cast: Jump
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.abilities contains: [flying]
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Grizzly Bears }
  - all pass: until main2
  - expect:
      p1.graveyard: [Jump, Grizzly Bears]
