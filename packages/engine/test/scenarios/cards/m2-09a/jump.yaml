name: Jump gives a creature flying until end of turn, so a creature without flying or reach can't block it
rules: [CR 613.1f, CR 702.9b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Island]
    hand: [Jump]
  p2:
    battlefield: [Runeclaw Bear]
steps:
  - p1 cast: Jump
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p2.life: 18
