name: Levitation's flying stops a ground blocker; a creature with reach still blocks
rules: [CR 613.1f, CR 702.9b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Levitation, Grizzly Bears]
  p2:
    battlefield: [Runeclaw Bear, Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Grizzly Bears }
  - expect error: illegalAction
  - p2 block: { Giant Spider: Grizzly Bears }
  - all pass: until main2
  - expect:
      p1.graveyard: [Grizzly Bears]
