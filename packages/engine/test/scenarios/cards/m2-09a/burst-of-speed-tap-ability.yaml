name: Burst of Speed's haste lets a creature cast this turn use its {T} ability
rules: [CR 302.6, CR 702.10b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain]
    hand: [Prodigal Pyromancer, Burst of Speed]
  p2:
    battlefield: []
steps:
  - p1 cast: Prodigal Pyromancer
    pay: auto
  - all pass: once
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - expect error: illegalAction
  - p1 cast: Burst of Speed
    pay: auto
  - all pass: once
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - all pass: once
  - expect:
      p2.life: 19
