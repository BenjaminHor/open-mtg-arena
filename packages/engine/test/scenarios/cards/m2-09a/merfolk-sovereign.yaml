name: Merfolk Sovereign gives other Merfolk +1/+1, and its ability makes a Merfolk unblockable this turn
rules: [CR 613.4c, CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Merfolk Sovereign, Coral Merfolk, Grizzly Bears]
  p2:
    battlefield: [Runeclaw Bear]
steps:
  - expect:
      p1:Coral Merfolk.power: 3
  - p1 activate: Merfolk Sovereign
    targets: [p1:Coral Merfolk]
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Coral Merfolk, Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Coral Merfolk }
  - expect error: illegalAction
  - p2 block: { Runeclaw Bear: Grizzly Bears }
  - all pass: until main2
  - expect:
      p2.life: 17
