name: Kindled Fury gives a creature +1/+0 and first strike, so it kills its blocker first
rules: [CR 613.1f, CR 613.4c, CR 702.7b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Mountain]
    hand: [Kindled Fury]
  p2:
    battlefield: [Hill Giant]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Grizzly Bears }
  - p1 cast: Kindled Fury
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: until main2
  - expect:
      p2.graveyard: [Hill Giant]
      p1.battlefield contains: [Grizzly Bears]
