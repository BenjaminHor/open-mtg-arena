name: Rhox Pikemaster gives first strike only to its controller's Soldiers; an opponent's Soldier trades as usual
rules: [CR 613.1f, CR 109.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Rhox Pikemaster, Grizzly Bears]
  p2:
    battlefield: [Elite Vanguard]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Elite Vanguard: Grizzly Bears }
  - all pass: until main2
  - expect:
      p1.graveyard: [Grizzly Bears]
      p2.graveyard: [Elite Vanguard]
