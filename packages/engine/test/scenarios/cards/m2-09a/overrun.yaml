name: Overrun gives its controller's creatures +3/+3 and trample, so a blocked creature tramples over
rules: [CR 611.2c, CR 613.1f, CR 702.19b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Forest, Forest, Forest, Forest, Forest]
    hand: [Overrun]
  p2:
    battlefield: [Llanowar Elves]
steps:
  - p1 cast: Overrun
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.power: 5
      p1:Grizzly Bears.abilities contains: [trample]
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Llanowar Elves: Grizzly Bears }
  - all pass: until combat.damage
  - p1 assign: { Llanowar Elves: 1, p2: 4 }
  - all pass: until main2
  - expect:
      p2.life: 16
