name: Trumpet Blast gives the creatures attacking as it resolves +2/+0 until end of turn, not the others
rules: [CR 611.2c, CR 613.4c, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Elite Vanguard, Mountain, Mountain, Mountain]
    hand: [Trumpet Blast]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p1 cast: Trumpet Blast
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.power: 4
      p1:Elite Vanguard.power: 2
  - all pass: until main2
  - expect:
      p2.life: 16
      p1:Grizzly Bears.power: 4
