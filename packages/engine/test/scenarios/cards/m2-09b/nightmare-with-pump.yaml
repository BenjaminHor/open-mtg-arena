name: Nightmare's ability sets the base that a +1/+1 effect adds to, so with one it survives losing its last Swamp
rules: [CR 613.4a, CR 613.4c, CR 704.5f]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Nightmare, Swamp, Plains, Plains]
    hand: [Glorious Charge]
  p2:
    battlefield: [Forest, Forest, Forest, Forest, Forest]
    hand: [Acidic Slime]
steps:
  - p2 cast: Acidic Slime
    pay: auto
  - all pass: once
  - p2 choose: p1:Swamp
  # With the trigger on the stack, p1 answers.
  - p2 pass: once
  - p1 cast: Glorious Charge
    pay: auto
  - all pass: once
  - expect:
      p1:Nightmare.power: 2
  - all pass: once
  - expect:
      p1.graveyard contains: [Swamp]
      p1:Nightmare.power: 1
      p1:Nightmare.toughness: 1
