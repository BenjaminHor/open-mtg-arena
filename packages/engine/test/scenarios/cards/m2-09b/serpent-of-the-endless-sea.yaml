name: Serpent of the Endless Sea can't attack unless the defending player controls an Island
rules: [CR 508.1c, CR 604.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Serpent of the Endless Sea, Grizzly Bears, Island, Island]
  p2:
    battlefield: [Forest]
steps:
  - expect:
      p1:Serpent of the Endless Sea.power: 2
  - all pass: until combat.declareAttackers
  # p1's own Islands don't count: the defending player's do.
  - p1 attack: [Serpent of the Endless Sea]
  - expect error: illegalAction
  - p1 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p2.life: 18
