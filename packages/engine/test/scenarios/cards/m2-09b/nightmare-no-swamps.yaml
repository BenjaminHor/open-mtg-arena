      p1:Nightmare.toughness: 1
  - p2 cast: Acidic Slime
    pay: auto
  - all pass: once
  - p2 choose: p1:Swamp
  - all pass: once
  - expect:
      p1.graveyard contains: [Nightmare, Swamp]
