name: Coat of Arms adds to the power and toughness two Nightmares' ability sets, as they share a creature type
rules: [CR 613.4a, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Nightmare, Nightmare, Coat of Arms, Swamp, Swamp]
steps:
  - expect:
      p1:Nightmare#1.power: 3
      p1:Nightmare#1.toughness: 3
      p1:Nightmare#2.power: 3
