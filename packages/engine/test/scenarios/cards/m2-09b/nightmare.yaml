name: Nightmare's power and toughness are each the number of Swamps its controller controls, changing as they do
rules: [CR 604.3, CR 208.2a, CR 613.4a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Nightmare, Swamp, Swamp]
    hand: [Swamp]
  p2:
    battlefield: [Swamp, Swamp, Swamp]
steps:
  # Only the Swamps p1 controls.
  - expect:
      p1:Nightmare.power: 2
      p1:Nightmare.toughness: 2
  - p1 play: Swamp
  - expect:
      p1:Nightmare.power: 3
      p1:Nightmare.toughness: 3
