name: Disorient can leave power below 0, and pumping it back adds from there
rules: [CR 107.1b, CR 510.1a, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Shivan Dragon, Mountain, Mountain, Mountain]
  p2:
    hand: [Disorient]
    battlefield: [Island, Island, Island, Island]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Shivan Dragon]
  - p1 pass: once
  - p2 cast: Disorient
    targets: [p1:Shivan Dragon]
    pay: auto
  - all pass: once
  - expect:
      p1:Shivan Dragon.power: -2
  - p1 activate: Shivan Dragon
    pay: auto
  - all pass: once
  - p1 activate: Shivan Dragon
    pay: auto
  - all pass: once
  - p1 activate: Shivan Dragon
    pay: auto
  - all pass: once
  - expect:
      p1:Shivan Dragon.power: 1
  - all pass: until main2
  - expect:
      p2.life: 19
