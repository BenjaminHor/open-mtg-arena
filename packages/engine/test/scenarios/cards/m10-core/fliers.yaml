name: The fliers can't be blocked by a creature without flying or reach, but can by one with reach
rules: [CR 702.9b, CR 702.17b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Wind Drake, Snapping Drake, Stormfront Pegasus, Zephyr Sprite, Kelinore Bat, Air Elemental]
  p2:
    battlefield: [Siege Mastodon, Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Wind Drake, Snapping Drake, Stormfront Pegasus, Zephyr Sprite, Kelinore Bat, Air Elemental]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: Wind Drake }
  - expect error: illegalAction
  - p2 block: { Giant Spider: Snapping Drake }
  - all pass: until main2
  - expect:
      p2.life: 9
      p1.graveyard: [Snapping Drake]
