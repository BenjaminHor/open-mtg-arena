name: Lightning Elemental attacks the turn it's cast, having haste; Goblin Piker cast the same turn can't
rules: [CR 702.10b, CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Elemental, Goblin Piker]
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain]
steps:
  - p1 cast: Lightning Elemental
    pay: auto
  - all pass: once
  - p1 cast: Goblin Piker
    pay: auto
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Goblin Piker]
  - expect error: illegalAction
  - p1 attack: [Lightning Elemental]
  - all pass: until main2
  - expect:
      p2.life: 16
