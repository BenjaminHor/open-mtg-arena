name: Righteousness can't target a creature that's attacking rather than blocking
rules: [CR 601.2c, CR 509.1g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant]
  p2:
    hand: [Righteousness]
    battlefield: [Grizzly Bears, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Hill Giant }
  - p1 pass: once
  - p2 cast: Righteousness
    targets: [p1:Hill Giant]
    pay: auto
  - expect error: illegalAction
