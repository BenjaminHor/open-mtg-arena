name: Once combat is over, nothing is blocking, so Righteousness can't be cast
rules: [CR 511.3, CR 601.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    hand: [Righteousness]
    battlefield: [Hill Giant, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Grizzly Bears }
  - all pass: until main2
  - p1 pass: once
  - p2 cast: Righteousness
  - expect error: illegalAction
