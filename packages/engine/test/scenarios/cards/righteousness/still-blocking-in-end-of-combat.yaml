name: A creature is still a blocking creature in the end of combat step, until combat ends
rules: [CR 509.1g, CR 511.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    hand: [Righteousness]
    battlefield: [Hill Giant, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Grizzly Bears }
  - all pass: until combat.end
  - p1 pass: once
  - p2 cast: Righteousness
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p2:Hill Giant.power: 10
