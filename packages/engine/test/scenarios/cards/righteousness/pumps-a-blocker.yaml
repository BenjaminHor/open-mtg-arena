name: Righteousness gives a blocking creature +7/+7, and it wins the fight
rules: [CR 509.1g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant]
  p2:
    hand: [Righteousness]
    battlefield: [Grizzly Bears, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Hill Giant }
  - p1 pass: once
  - p2 cast: Righteousness
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2:Grizzly Bears.power: 9
      p2:Grizzly Bears.toughness: 9
  - all pass: once
  - expect:
      p1.graveyard: [Hill Giant]
      p2:Grizzly Bears.damage: 3
