name: Righteousness can't target a creature that isn't blocking, even while another one is
rules: [CR 601.2c, CR 509.1g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant]
  p2:
    hand: [Righteousness]
    battlefield: [Grizzly Bears, Elite Vanguard, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Hill Giant }
  - p1 pass: once
  - p2 cast: Righteousness
    targets: [p2:Elite Vanguard]
    pay: auto
  - expect error: illegalAction
