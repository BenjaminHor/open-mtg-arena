name: With no blocking creature on the battlefield, Righteousness has no legal target and can't be cast
rules: [CR 601.2c, CR 601.2e]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant]
  p2:
    hand: [Righteousness]
    battlefield: [Grizzly Bears, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - p1 pass: once
  # The cast itself is refused: there's nothing it could target.
  - p2 cast: Righteousness
  - expect error: illegalAction
