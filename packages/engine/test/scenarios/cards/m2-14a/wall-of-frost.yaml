name: A creature Wall of Frost blocks doesn't untap during its controller's next untap step, and untaps in the one after
rules: [CR 509.3b, CR 502.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears, Hill Giant]
  p2:
    battlefield: [Wall of Frost]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears, Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 block: { Wall of Frost: Hill Giant }
  - all pass: until main2
  - expect:
      p2.life: 18
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Hill Giant.tapped: true
      p1:Grizzly Bears.tapped: false
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Hill Giant.tapped: false
