name: A slept creature another player gains control of untaps in its new controller's untap step
rules: [CR 502.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Island, Island, Island, Island, Island]
    hand: [Sleep, Mind Control]
  p2:
    battlefield: [Grizzly Bears, Hill Giant]
steps:
  - p1 cast: Sleep
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 cast: Mind Control
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.tapped: true
  - all pass: until upkeep
  - expect:
      active: p2
      p2:Hill Giant.tapped: true
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Grizzly Bears.tapped: false
