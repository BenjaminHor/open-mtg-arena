name: Wall of Frost leaving the battlefield doesn't end its effect
rules: [CR 611.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant, Swamp, Swamp]
    hand: [Doom Blade]
  p2:
    battlefield: [Wall of Frost]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 block: { Wall of Frost: Hill Giant }
  - all pass: until main2
  - p1 cast: Doom Blade
    targets: [p2:Wall of Frost]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard contains: [Wall of Frost]
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Hill Giant.tapped: true
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Hill Giant.tapped: false
