name: A blocked creature stolen by the Wall's controller before its first controller's untap step stays tapped in the thief's next untap step
rules: [CR 502.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant]
  p2:
    battlefield: [Wall of Frost, Island, Island, Island, Island, Island]
    hand: [Mind Control]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 block: { Wall of Frost: Hill Giant }
  - all pass: until main1
  - expect:
      active: p2
  - p2 cast: Mind Control
    targets: [p1:Hill Giant]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p2
      p2:Hill Giant.tapped: true
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p2
      p2:Hill Giant.tapped: false
