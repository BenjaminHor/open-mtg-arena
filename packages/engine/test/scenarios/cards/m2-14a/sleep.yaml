name: Sleep taps all creatures the target player controls, and they stay tapped through that player's next untap step only
rules: [CR 502.3, CR 611.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island]
    hand: [Sleep]
  p2:
    battlefield: [Grizzly Bears, { card: Hill Giant, tapped: true }, { card: Forest, tapped: true }]
steps:
  - p1 cast: Sleep
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2:Grizzly Bears.tapped: true
      p2:Hill Giant.tapped: true
  # p2's untap step: the creatures stay tapped, even the Hill Giant Sleep didn't tap (its ruling); the land untaps.
  - all pass: until upkeep
  - expect:
      active: p2
      p2:Grizzly Bears.tapped: true
      p2:Hill Giant.tapped: true
      p2:Forest.tapped: false
  # p1's untap step doesn't end it early, and p2's following one untaps them.
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Island.tapped: false
      p2:Grizzly Bears.tapped: true
  - all pass: until upkeep
  - expect:
      active: p2
      p2:Grizzly Bears.tapped: false
      p2:Hill Giant.tapped: false
