name: If the creature Entangling Vines enchants becomes untapped, Vines is put into its owner's graveyard (its ruling)
rules: [CR 704.5m, CR 303.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Act of Treason]
  p2:
    battlefield: [{ card: Hill Giant, tapped: true }, { card: Entangling Vines, attachedTo: p2:Hill Giant }]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard contains: [Entangling Vines]
      p1:Hill Giant.tapped: false
