name: Wall of Frost's effect follows the creature, so a new controller's next untap step doesn't untap it (its ruling)
rules: [CR 502.3, CR 611.2c]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Wall of Frost, Island, Island, Island, Island, Island]
    hand: [Mind Control]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p1 block: { Wall of Frost: Grizzly Bears }
  - all pass: until main1
  - expect:
      active: p1
  - p1 cast: Mind Control
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Grizzly Bears]
      p1:Grizzly Bears.tapped: true
  # Its first controller's next untap step has passed under someone else; its new controller's next one keeps it tapped.
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Grizzly Bears.tapped: true
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Grizzly Bears.tapped: false
