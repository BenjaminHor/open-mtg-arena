name: A slept creature untapped and borrowed by Act of Treason still doesn't untap in its owner's next untap step
rules: [CR 701.26b, CR 514.2, CR 502.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Island, Island, Island, Island, Mountain, Mountain, Mountain]
    hand: [Sleep, Act of Treason]
  p2:
    battlefield: [Grizzly Bears, Hill Giant]
steps:
  - p1 cast: Sleep
    targets: [p2]
    pay: auto
  - all pass: once
  - p1 cast: Act of Treason
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.tapped: false
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p2.life: 18
  - all pass: until upkeep
  - expect:
      active: p2
      p2:Grizzly Bears.tapped: true
      p2:Hill Giant.tapped: true
