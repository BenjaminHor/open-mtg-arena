name: A vigilance attacker still untapped at its controller's next untap step uses the effect up
rules: [CR 502.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Captain of the Watch]
  p2:
    battlefield: [Wall of Frost, Blinding Mage, Plains]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Captain of the Watch]
  - all pass: until combat.declareBlockers
  - p2 block: { Wall of Frost: Captain of the Watch }
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Captain of the Watch.tapped: false
  - p1 pass: once
  - p2 activate: Blinding Mage
    targets: [p1:Captain of the Watch]
    pay: auto
  - all pass: once
  - expect:
      p1:Captain of the Watch.tapped: true
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p1
      p1:Captain of the Watch.tapped: false
