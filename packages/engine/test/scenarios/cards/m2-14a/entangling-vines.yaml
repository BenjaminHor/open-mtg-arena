name: Entangling Vines keeps the tapped creature it enchants from untapping during its controller's untap steps
rules: [CR 303.4a, CR 502.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest, Forest, Forest]
    hand: [Entangling Vines]
  p2:
    battlefield: [{ card: Hill Giant, tapped: true }]
steps:
  - p1 cast: Entangling Vines
    targets: [p2:Hill Giant]
    pay: auto
  - all pass: once
  - all pass: until upkeep
  - expect:
      active: p2
      p2:Hill Giant.tapped: true
  - all pass: until upkeep
  - all pass: until upkeep
  - expect:
      active: p2
      p2:Hill Giant.tapped: true
