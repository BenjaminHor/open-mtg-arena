name: A noncreature card found stays in the library whatever the player names, and the question is asked anyway, with only no possible, so the player naming can't tell (its ruling)
rules: [CR 701.23a, CR 701.23e, CR 608.2d, CR 701.24a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Sphinx Ambassador]
  p2:
    library: [Lightning Bolt, Island]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Sphinx Ambassador]
  - all pass: until combat.damage
  - all pass: once
  - p1 choose: Lightning Bolt
  - p2 choose: Grizzly Bears
  - expect:
      pending: { player: p1, kind: chooseYesNo }
  - p1 choose: yes
  - expect error: illegalAction
  - p1 choose: no
  - expect:
      p1.battlefield: [Sphinx Ambassador]
      p2.library count: 2
      stack: []
      events contains: [{ type: LIBRARY_SHUFFLED, player: p2 }]
