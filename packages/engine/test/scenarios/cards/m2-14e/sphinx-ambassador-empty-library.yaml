name: With nothing to find in an empty library, the player still names a card and still shuffles
rules: [CR 701.24a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Sphinx Ambassador]
  p2:
    library: []
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Sphinx Ambassador]
  - all pass: until combat.damage
  - all pass: once
  - expect:
      pending: { player: p2, kind: chooseName }
  - p2 choose: Grizzly Bears
  - expect:
      events contains: [{ type: LIBRARY_SHUFFLED, player: p2 }]
