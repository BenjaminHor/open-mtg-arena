name: three cards, middle permutation
rules: [CR 401.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mirror of Fate]
    library: [Forest]
    exile: [Lightning Bolt, Grizzly Bears, Shock]
steps:
  - p1 activate: Mirror of Fate
  - all pass: once
  - p1 choose: Lightning Bolt
  - p1 choose: Grizzly Bears
  - p1 choose: Shock
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: putOnTop, min: 3, max: 3 }
  - p1 choose: Shock
  - p1 choose: Lightning Bolt
  - p1 choose: Grizzly Bears
  - expect:
      p1.library: [Shock, Lightning Bolt, Grizzly Bears]
      exile: [Forest]
