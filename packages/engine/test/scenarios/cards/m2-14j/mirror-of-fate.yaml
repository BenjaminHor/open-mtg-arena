name: Mirror of Fate puts the chosen exiled cards on top of a library it has exiled, in the order its owner chooses
rules: [CR 602.2, CR 608.2d, CR 401.4, CR 406.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mirror of Fate]
    library: [Forest, Island]
    exile: [Lightning Bolt, Grizzly Bears, Shock]
steps:
  - p1 activate: Mirror of Fate
  - expect:
      p1.graveyard: [Mirror of Fate]
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: putOnTop, min: 0, max: 3 }
  - p1 choose: Lightning Bolt
  - p1 choose: Grizzly Bears
  - p1 choose: finish
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: putOnTop, min: 2, max: 2 }
  - p1 choose: Grizzly Bears
  - p1 choose: Lightning Bolt
  - expect:
      p1.library: [Grizzly Bears, Lightning Bolt]
      exile: [Shock, Island, Forest]
