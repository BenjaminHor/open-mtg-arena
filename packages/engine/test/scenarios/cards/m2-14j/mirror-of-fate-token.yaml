name: a token exiled above Mirror's ability has ceased to exist before it resolves and isn't offered
rules: [CR 111.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Cemetery Reaper }, Swamp, Swamp, Swamp, Plains, Plains, Mirror of Fate]
    library: [Forest]
    exile: [Shock]
    hand: [Celestial Purge]
  p2:
    graveyard: [Grizzly Bears]
steps:
  - p1 activate: Cemetery Reaper
    targets: [graveyard:p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Zombie Token]
      exile: [Shock, Grizzly Bears]
  - p1 activate: Mirror of Fate
  - p1 cast: Celestial Purge
    targets: [p1:Zombie Token]
    pay: auto
  - all pass: once
  - expect:
      exile: [Shock, Grizzly Bears]
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: choose, min: 0, max: 1 }
  - p1 choose: Shock
  - expect:
      p1.library: [Shock]
      exile: [Grizzly Bears, Forest]
