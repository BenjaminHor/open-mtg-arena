name: Mirror of Fate chooses at most seven of eight exiled cards
rules: [CR 608.2d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mirror of Fate]
    exile: [Shock, Shock, Shock, Shock, Shock, Shock, Shock, Lightning Bolt]
steps:
  - p1 activate: Mirror of Fate
  - all pass: once
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: putOnTop, min: 7, max: 7 }
