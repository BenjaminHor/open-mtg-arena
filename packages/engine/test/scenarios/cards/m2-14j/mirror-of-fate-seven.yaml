name: Mirror of Fate with eight exiled cards puts seven on top; the eighth stays exiled, the library joins it
rules: [CR 608.2d, CR 401.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mirror of Fate]
    library: [Forest]
    exile: [Shock, Shock, Shock, Shock, Shock, Shock, Shock, Lightning Bolt]
steps:
  - p1 activate: Mirror of Fate
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: choose, min: 0, max: 7 }
  - p1 choose: Lightning Bolt
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: putOnTop, min: 7, max: 7 }
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Lightning Bolt
  - p1 choose: Shock
  - p1 choose: Shock
  - p1 choose: Shock
  - expect:
      p1.library: [Shock, Shock, Shock, Lightning Bolt, Shock, Shock, Shock]
      exile: [Shock, Forest]
