name: two Mirrors; the one resolving second can choose what the first exiled from the library
rules: [CR 400.7, CR 608.2d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mirror of Fate, Mirror of Fate]
    library: [Forest, Island]
    exile: [Shock]
steps:
  - p1 activate: Mirror of Fate
  - p1 activate: Mirror of Fate
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: choose, min: 0, max: 1 }
  - p1 choose: Shock
  - expect:
      p1.library: [Shock]
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: choose, min: 0, max: 2 }
  - p1 choose: Island
  - p1 choose: Forest
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: putOnTop, min: 2, max: 2 }
  - p1 choose: Forest
  - p1 choose: Island
  - expect:
      p1.library: [Forest, Island]
      exile: [Shock]
