name: Mirror of Fate choosing nothing exiles its controller's library, who then loses drawing from the empty library
rules: [CR 608.2d, CR 704.5b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Mirror of Fate]
    library: [Forest, Island]
    exile: [Lightning Bolt]
steps:
  - p2 pass: once
  - p1 activate: Mirror of Fate
  - all pass: once
  - p1 choose: finish
  - expect:
      p1.library: []
      exile: [Lightning Bolt, Island, Forest]
  - all pass: until draw
  - expect:
      winner: p2
