name: the controller who didn't own the exiled card isn't offered it
rules: [CR 108.3]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Mind Control, attachedTo: p2:Magma Phoenix }, Mirror of Fate]
    library: [Forest]
  p2:
    battlefield: [Magma Phoenix, Plains, Plains]
    hand: [Celestial Purge]
steps:
  - p2 cast: Celestial Purge
    targets: [p1:Magma Phoenix]
    pay: auto
  - all pass: once
  - p2 pass: once
  - p1 activate: Mirror of Fate
  - all pass: once
  - expect:
      pending: { player: p2, kind: priority }
      p1.library: []
      exile: [Magma Phoenix, Forest]
