name: Mirror of Fate with one card chosen puts it on top with no order to choose; cards it exiles from the library weren't there to choose
rules: [CR 608.2d, CR 401.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mirror of Fate]
    library: [Forest, Island]
    exile: [Shock]
steps:
  - p1 activate: Mirror of Fate
  - all pass: once
  - expect:
      pending: { player: p1, kind: chooseCards, purpose: putOnTop, min: 0, max: 1 }
  - p1 choose: Shock
  - expect:
      pending: { player: p1, kind: priority }
      p1.library: [Shock]
      exile: [Island, Forest]
