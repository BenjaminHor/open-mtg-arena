name: Mirror of Fate offers only exiled cards its controller owns; with none, nothing is asked and the library is still exiled
rules: [CR 108.3, CR 608.2d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mirror of Fate]
    library: [Forest]
  p2:
    exile: [Doom Blade]
steps:
  - p1 activate: Mirror of Fate
  - all pass: once
  - expect:
      pending: { player: p1, kind: priority }
      p1.library: []
      exile: [Doom Blade, Forest]
