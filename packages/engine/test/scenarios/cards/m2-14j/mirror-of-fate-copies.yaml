name: Mirror of Fate putting two copies of one card on top asks no order, as no one could tell them apart
rules: [CR 401.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mirror of Fate]
    exile: [Shock, Shock]
steps:
  - p1 activate: Mirror of Fate
  - all pass: once
  - p1 choose: Shock
  - p1 choose: Shock
  - expect:
      pending: { player: p1, kind: priority }
      p1.library: [Shock, Shock]
