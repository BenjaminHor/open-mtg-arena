name: under Vampire Nocturnus, only the chosen top is revealed, never a card that was never on top
rules: [CR 401.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Vampire Nocturnus, Mirror of Fate]
    library: [Forest]
    exile: [Doom Blade, Shock]
steps:
  - p1 activate: Mirror of Fate
  - all pass: once
  - p1 choose: Doom Blade
  - p1 choose: Shock
  - p1 choose: Doom Blade
  - expect:
      p1.library: []
  - p1 choose: Shock
  - expect:
      p1.library: [Doom Blade, Shock]
      events contains: [{ type: CARDS_REVEALED, cards: [Doom Blade] }]
      events lacks: [{ type: CARDS_REVEALED, cards: [Shock] }]
