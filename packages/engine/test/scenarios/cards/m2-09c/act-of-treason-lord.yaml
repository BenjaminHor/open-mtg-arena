name: A stolen Merfolk Sovereign pumps its new controller's Merfolk and stops pumping its owner's
rules: [CR 109.5, CR 611.3a, CR 613.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Coral Merfolk]
    hand: [Act of Treason]
  p2:
    battlefield: [Merfolk Sovereign, Coral Merfolk]
steps:
  - expect:
      p1:Coral Merfolk.power: 2
      p2:Coral Merfolk.power: 3
  - p1 cast: Act of Treason
    targets: [p2:Merfolk Sovereign]
    pay: auto
  - all pass: once
  - expect:
      p1:Coral Merfolk.power: 3
      p2:Coral Merfolk.power: 2
