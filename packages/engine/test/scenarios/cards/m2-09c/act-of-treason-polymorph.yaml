name: Polymorph on a stolen creature has its controller, the thief, reveal and put a creature onto the battlefield
rules: [CR 608.2h, CR 613.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Island, Island, Island, Island]
    hand: [Act of Treason, Polymorph]
    library: [Forest, Hill Giant]
  p2:
    battlefield: [Grizzly Bears]
    library: [Craw Wurm]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 cast: Polymorph
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Hill Giant]
      p2.graveyard: [Grizzly Bears]
