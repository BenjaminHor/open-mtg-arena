name: Silence still stops spells in the end step of the turn it resolved
rules: [CR 514.2, CR 601.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains]
    hand: [Silence]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 cast: Silence
    pay: auto
  - all pass: once
  - all pass: until end
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1]
    pay: auto
  - expect error: illegalAction
