name: Silence cast by the non-active player stops the active player's spells but not their land play
rules: [CR 601.3, CR 109.5, CR 305.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain]
    hand: [Shock, Forest]
  p2:
    battlefield: [Plains, Mountain]
    hand: [Silence, Shock]
steps:
  - p1 pass: once
  - p2 cast: Silence
    pay: auto
  - all pass: once
  - p1 cast: Shock
    targets: [p2]
    pay: auto
  - expect error: illegalAction
  - p1 play: Forest
  - expect:
      p1.battlefield contains: [Forest]
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1]
    pay: auto
  - all pass: once
  - expect:
      p1.life: 18
