name: Damage on a stolen creature is removed in the same cleanup that returns it to its owner
rules: [CR 514.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Honor of the Pure]
    hand: [Act of Treason, Shock]
  p2:
    battlefield: [White Knight]
steps:
  - p1 cast: Act of Treason
    targets: [p2:White Knight]
    pay: auto
  - all pass: once
  - p1 cast: Shock
    targets: [p1:White Knight]
    pay: auto
  - all pass: once
  - expect:
      p1:White Knight.damage: 2
  - all pass: until upkeep
  - expect:
      p2:White Knight.damage: 0
      p2.battlefield: [White Knight]
