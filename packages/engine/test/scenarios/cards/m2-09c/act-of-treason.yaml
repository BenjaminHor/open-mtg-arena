name: Act of Treason gains control of an opponent's tapped creature, untaps it and gives it haste, so it attacks its owner
rules: [CR 613.1b, CR 702.10b, CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Act of Treason]
  p2:
    battlefield: [{ card: Craw Wurm, tapped: true }]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Craw Wurm]
    pay: auto
  - all pass: once
  - expect:
      p1:Craw Wurm.tapped: false
      p1:Craw Wurm.abilities contains: [haste]
  - all pass: until combat.declareAttackers
  - p1 attack: [Craw Wurm]
  - all pass: until main2
  - expect:
      p2.life: 14
