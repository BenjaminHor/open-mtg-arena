name: Control from Act of Treason lasts through the end step, so a stolen Prodigal Pyromancer can still be used then
rules: [CR 514.2, CR 513.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Act of Treason]
  p2:
    battlefield: [Prodigal Pyromancer]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Prodigal Pyromancer]
    pay: auto
  - all pass: once
  - all pass: until end
  - expect:
      p1.battlefield contains: [Prodigal Pyromancer]
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - all pass: once
  - expect:
      p2.life: 19
