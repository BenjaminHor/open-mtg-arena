name: A creature taken by Act of Treason is summoning sick for its new controller (haste aside), and free of it again on its owner's next turn
rules: [CR 302.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Act of Treason]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.sick: true
  - all pass: until end
  - expect:
      p1:Grizzly Bears.sick: true
  - all pass: until main1
  - expect:
      active: p2
      p2:Grizzly Bears.sick: false
  - all pass: until combat.declareAttackers
  - p2 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p1.life: 18
