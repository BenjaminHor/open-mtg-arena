name: An opponent's Spellbook doesn't lift the active player's maximum hand size
rules: [CR 402.2, CR 109.5]
setup:
  turn: { active: p1, step: end }
  p1:
    hand: [Forest, Forest, Forest, Forest, Forest, Forest, Forest, Shock]
  p2:
    battlefield: [Spellbook]
steps:
  - all pass: once
  - expect:
      pending: { player: p1, kind: discardToHandSize, remaining: 1 }
