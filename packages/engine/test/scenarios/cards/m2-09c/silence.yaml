name: After Silence resolves, its controller's opponents can't cast spells this turn, though they can still activate abilities
rules: [CR 101.2, CR 601.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains, Mountain]
    hand: [Silence, Shock]
  p2:
    battlefield: [Mountain, Prodigal Pyromancer]
    hand: [Shock]
steps:
  - p1 cast: Silence
    pay: auto
  - all pass: once
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1]
    pay: auto
  - expect error: illegalAction
  - p2 activate: Prodigal Pyromancer
    targets: [p1]
  - all pass: once
  - expect:
      p1.life: 19
  # Silence's controller isn't one of their own opponents.
  - p1 cast: Shock
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.life: 18
