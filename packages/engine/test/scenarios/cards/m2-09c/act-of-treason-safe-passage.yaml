name: Safe Passage cast before Act of Treason still protects the stolen creature, as it changes the rules rather than locking in creatures
rules: [CR 611.2c, CR 615.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Plains, Plains, Plains]
    hand: [Act of Treason, Shock, Safe Passage]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Safe Passage
    pay: auto
  - all pass: once
  - p1 cast: Act of Treason
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - p1 cast: Shock
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1:Grizzly Bears.damage: 0
