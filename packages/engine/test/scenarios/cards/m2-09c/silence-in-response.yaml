name: A spell an opponent casts in response to Silence, before it resolves, still resolves (its ruling)
rules: [CR 101.2, CR 608.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Plains]
    hand: [Silence]
  p2:
    battlefield: [Mountain]
    hand: [Shock]
steps:
  - p1 cast: Silence
    pay: auto
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p1.life: 18
      p1.graveyard: [Silence]
