name: A stolen Prodigal Pyromancer has haste, so its new controller can use its {T} ability at once
rules: [CR 602.5a, CR 702.10c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Act of Treason]
  p2:
    battlefield: [Prodigal Pyromancer]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Prodigal Pyromancer]
    pay: auto
  - all pass: once
  - p1 activate: Prodigal Pyromancer
    targets: [p2]
  - all pass: once
  - expect:
      p2.life: 19
