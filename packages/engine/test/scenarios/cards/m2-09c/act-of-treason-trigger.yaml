name: A stolen Lightwielder Paladin's trigger is controlled by its new controller, who chooses its target
rules: [CR 603.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Act of Treason]
  p2:
    battlefield: [Lightwielder Paladin, Prodigal Pyromancer]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Lightwielder Paladin]
    pay: auto
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Lightwielder Paladin]
  - all pass: once
  - all pass: once
  - expect:
      p2.life: 16
      pending: { player: p1, kind: chooseTarget }
  - p1 choose: p2:Prodigal Pyromancer
  - all pass: once
  - p1 choose: yes
  - expect:
      exile: [Prodigal Pyromancer]
