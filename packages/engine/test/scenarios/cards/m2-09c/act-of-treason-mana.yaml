name: A stolen Llanowar Elves adds its mana to its new controller's pool
rules: [CR 605.1a, CR 106.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Act of Treason]
  p2:
    battlefield: [Llanowar Elves]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Llanowar Elves]
    pay: auto
  - all pass: once
  - p1 activate: Llanowar Elves
  - expect:
      p1.manaPool: { G: 1 }
      p2.manaPool: {}
