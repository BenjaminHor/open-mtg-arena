name: Control from Act of Treason ends in the cleanup step, and the creature goes back to its owner
rules: [CR 514.2, CR 611.2a, CR 613.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain]
    hand: [Act of Treason]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Act of Treason
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.battlefield contains: [Grizzly Bears]
  - all pass: until end
  - expect:
      p1.battlefield contains: [Grizzly Bears]
  - all pass: until upkeep
  - expect:
      p2.battlefield contains: [Grizzly Bears]
      p1.battlefield: [Mountain, Mountain, Mountain]
