name: The creature Ice Cage enchants can't attack or block, and its activated abilities, tap ones too, can't be activated
rules: [CR 508.1c, CR 509.1b, CR 602.5]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [Grizzly Bears, { card: Ice Cage, attachedTo: p2:Prodigal Pyromancer }]
  p2:
    battlefield: [Prodigal Pyromancer, Runeclaw Bear]
steps:
  - p2 activate: Prodigal Pyromancer
    targets: [p1]
  - expect error: illegalAction
  - all pass: until combat.declareAttackers
  - p2 attack: [Prodigal Pyromancer]
  - expect error: illegalAction
  - p2 attack: []
  - all pass: until main1
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Prodigal Pyromancer: Grizzly Bears }
  - expect error: illegalAction
