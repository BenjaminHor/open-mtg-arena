name: When the caged creature becomes a target, Ice Cage's trigger goes on top and destroys it before the spell resolves (its ruling)
rules: [CR 603.3, CR 601.2c, CR 608.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain]
    hand: [Shock]
  p2:
    battlefield: [Hill Giant, { card: Ice Cage, attachedTo: p2:Hill Giant }]
steps:
  - p1 cast: Shock
    targets: [p2:Hill Giant]
    pay: auto
  - expect:
      stack: [Shock, Ice Cage ability]
  - all pass: once
  - expect:
      stack: [Shock]
      p2.graveyard: [Ice Cage]
  - all pass: once
  - expect:
      p2:Hill Giant.damage: 2
