name: A caged Llanowar Elves can't tap for mana either, by itself or while paying a cost
rules: [CR 602.5, CR 605.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Llanowar Elves, Forest, { card: Ice Cage, attachedTo: p1:Llanowar Elves }]
    hand: [Runeclaw Bear]
steps:
  - p1 activate: Llanowar Elves
  - expect error: illegalAction
  # While paying for Runeclaw Bear, the caged Elves still can't be tapped for mana.
  - p1 cast: Runeclaw Bear
  - expect:
      pending: { player: p1, kind: payMana }
  - p1 activate: Llanowar Elves
  - expect error: illegalAction
