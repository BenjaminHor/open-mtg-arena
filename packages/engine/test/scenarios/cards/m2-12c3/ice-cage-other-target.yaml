name: Ice Cage doesn't trigger when another creature, or a player, becomes a target
rules: [CR 603.2, CR 303.4m]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain]
    hand: [Shock, Shock]
  p2:
    battlefield: [Hill Giant, { card: Ice Cage, attachedTo: p2:Hill Giant }, Grizzly Bears]
steps:
  - p1 cast: Shock
    targets: [p2:Grizzly Bears]
    pay: auto
  - expect:
      stack: [Shock]
  - all pass: once
  - p1 cast: Shock
    targets: [p2]
    pay: auto
  - expect:
      stack: [Shock]
      p2.battlefield contains: [Ice Cage]
