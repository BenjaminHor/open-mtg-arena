name: Two spells targeting the caged creature trigger Ice Cage twice; the second trigger finds it gone and does nothing
rules: [CR 400.7, CR 603.3]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain]
    hand: [Shock, Shock]
  p2:
    battlefield: [Hill Giant, { card: Ice Cage, attachedTo: p2:Hill Giant }]
steps:
  - p1 cast: Shock
    targets: [p2:Hill Giant]
    pay: auto
  - p1 cast: Shock
    targets: [p2:Hill Giant]
    pay: auto
  - expect:
      stack: [Shock, Ice Cage ability, Shock, Ice Cage ability]
  - all pass: once
  - expect:
      p2.graveyard: [Ice Cage]
  - all pass: once
  - all pass: once
  - all pass: once
  - expect:
      stack: []
      p2.graveyard: [Ice Cage, Hill Giant]
