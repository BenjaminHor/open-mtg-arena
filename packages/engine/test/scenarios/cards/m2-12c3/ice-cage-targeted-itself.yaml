name: Naturalize targeting Ice Cage itself doesn't trigger it, as only the caged creature becoming a target does
rules: [CR 113.6, CR 303.4m]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Forest, Forest]
    hand: [Naturalize]
  p2:
    battlefield: [Hill Giant, { card: Ice Cage, attachedTo: p2:Hill Giant }]
steps:
  - p1 cast: Naturalize
    targets: [p2:Ice Cage]
    pay: auto
  - expect:
      stack: [Naturalize]
  - all pass: once
  - expect:
      p2.graveyard: [Ice Cage]
      stack: []
