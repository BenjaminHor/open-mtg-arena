name: Soul Bleed on a creature stolen with Mind Control drains the thief at their upkeep, its controller now
rules: [CR 303.4m, CR 613.1b, CR 603.2b]
setup:
  turn: { active: p2, step: main1 }
  p1:
    battlefield: [{ card: Mind Control, attachedTo: p2:Grizzly Bears }]
  p2:
    battlefield: [Grizzly Bears, { card: Soul Bleed, attachedTo: p2:Grizzly Bears }]
steps:
  - all pass: until upkeep
  - expect:
      stack: [Soul Bleed ability]
  - all pass: once
  - expect:
      p1.life: 19
      p2.life: 20
