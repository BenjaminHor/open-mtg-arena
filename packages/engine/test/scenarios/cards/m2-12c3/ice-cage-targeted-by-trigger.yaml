name: A triggered ability targeting the caged creature triggers Ice Cage too
rules: [CR 603.3d, CR 603.3b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain]
    hand: [Sparkmage Apprentice]
  p2:
    battlefield: [Hill Giant, { card: Ice Cage, attachedTo: p2:Hill Giant }]
steps:
  - p1 cast: Sparkmage Apprentice
    pay: auto
  - all pass: once
  - p1 choose: p2:Hill Giant
  - expect:
      stack: [Sparkmage Apprentice ability, Ice Cage ability]
  - all pass: once
  - expect:
      p2.graveyard: [Ice Cage]
  - all pass: once
  - expect:
      p2:Hill Giant.damage: 1
