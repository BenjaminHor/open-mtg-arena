name: A player at 0 life loses the next time anyone would get priority, even with a spell still on the stack
rules: [CR 117.5, CR 704.5a, CR 104.3b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    life: 2
    hand: [Lightning Bolt]
    battlefield: [Mountain]
  p2:
    life: 2
    hand: [Shock]
    battlefield: [Mountain]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1]
    pay: auto
  # Shock resolves first; before anyone gets priority again, p1 at 0 life loses, with the Bolt still waiting.
  - all pass: once
  - expect:
      winner: p2
      p1.life: 0
      stack: [Lightning Bolt]
