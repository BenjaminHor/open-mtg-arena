name: A player who drew from an empty library loses when state-based actions are next checked
rules: [CR 704.5b, CR 121.4]
setup:
  turn: { active: p1, step: upkeep }
  p1:
    library: []
steps:
  - expect:
      winner: (game not over)
  - all pass: until draw
  - expect:
      winner: p2
      events contains: [{ type: PLAYER_LOST, player: p1, reason: drewFromEmptyLibrary }]
