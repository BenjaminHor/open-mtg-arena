name: A creature with 0 toughness is put into its owner's graveyard (not destroyed)
# Nothing in the M1 pool lowers toughness during a game, so the creature starts that way and dies at the first check,
# inside game creation. The TypeScript test in test/game/state-based-actions.test.ts checks the event.
rules: [CR 704.5f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [{ card: Grizzly Bears, counters: { -1/-1: 2 } }, Hill Giant]
steps:
  - expect:
      p1.battlefield: [Hill Giant]
      p1.graveyard: [Grizzly Bears]
