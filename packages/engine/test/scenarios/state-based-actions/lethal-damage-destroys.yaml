name: A creature with damage at least its toughness is destroyed and goes to its owner's graveyard
rules: [CR 704.5g, CR 701.8a, CR 120.6]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain]
  p2:
    battlefield: [Grizzly Bears, Giant Spider]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.battlefield: [Giant Spider]
      p2.graveyard: [Grizzly Bears]
      pending: { player: p1, kind: priority }
      events contains:
        - { type: STATE_BASED_ACTIONS }
        - { type: PERMANENT_DESTROYED }
