name: A player at 0 life loses the next time a player would get priority, and the other player wins
rules: [CR 704.5a, CR 104.3b, CR 104.2a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Shock]
    battlefield: [Mountain]
  p2:
    life: 2
steps:
  - p1 cast: Shock
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.life: 0
      winner: p1
      pending: null
      events contains:
        - { type: PLAYER_LOST, player: p2, reason: zeroLife }
        - { type: GAME_ENDED, result: { winner: p1, turn: 3 } }
  - p1 pass: once
  - expect error: gameOver
