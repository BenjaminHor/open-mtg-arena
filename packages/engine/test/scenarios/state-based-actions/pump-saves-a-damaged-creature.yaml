name: Damage less than toughness doesn't destroy, so a pump in response saves the creature
rules: [CR 704.5g, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain]
  p2:
    hand: [Giant Growth]
    battlefield: [Forest, Grizzly Bears]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2:Grizzly Bears]
    pay: auto
  - p1 pass: once
  - p2 cast: Giant Growth
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: once
  - expect:
      p2.battlefield: [Forest, Grizzly Bears]
      p2:Grizzly Bears.damage: 3
      p2:Grizzly Bears.toughness: 5
