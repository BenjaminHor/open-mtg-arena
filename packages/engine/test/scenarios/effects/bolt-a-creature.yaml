name: Damage dealt to a creature is marked on it
rules: [CR 120.3e, CR 115.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain]
  p2:
    battlefield: [Giant Spider, Grizzly Bears]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2:Giant Spider]
    pay: auto
  - all pass: once
  - expect:
      p2:Giant Spider.damage: 3
      p2:Grizzly Bears.damage: 0
      p2.life: 20
      events contains: [{ type: DAMAGE_DEALT, to: { kind: object }, amount: 3 }]
