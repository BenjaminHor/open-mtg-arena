name: Damage adds to damage already marked, and stays until the cleanup step
rules: [CR 120.3e, CR 120.6, CR 514.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Shock]
    battlefield: [Mountain]
  p2:
    battlefield: [{ card: Spined Wurm, damage: 1 }]
steps:
  - p1 cast: Shock
    targets: [p2:Spined Wurm]
    pay: auto
  - all pass: once
  - expect:
      p2:Spined Wurm.damage: 3
  - all pass: until end
  - expect:
      p2:Spined Wurm.damage: 3
  - all pass: until upkeep
  - expect:
      p2:Spined Wurm.damage: 0
