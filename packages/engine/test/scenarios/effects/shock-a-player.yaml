name: Damage dealt to a player makes them lose that much life
rules: [CR 120.3a, CR 119.3, CR 608.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Shock]
    battlefield: [Mountain]
steps:
  - p1 cast: Shock
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      p2.life: 18
      p1.life: 20
      p1.graveyard: [Shock]
      events contains:
        - { type: DAMAGE_DEALT, to: { kind: player, player: p2 }, amount: 2 }
        - { type: LIFE_LOST, player: p2, amount: 2 }
