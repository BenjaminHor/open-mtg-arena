name: Giant Growth creates a +3/+3 effect on its target until end of turn
rules: [CR 611.2a, CR 611.2c, CR 613.4c, CR 613.7b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Giant Growth]
    battlefield: [Forest, Grizzly Bears]
  p2:
    battlefield: [Gray Ogre]
steps:
  - p1 cast: Giant Growth
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Giant Growth]
      p1:Grizzly Bears.damage: 0
      events contains:
        - type: EFFECT_CREATED
          effect: { controller: p1, duration: endOfTurn, change: { kind: modifyPT, power: 3, toughness: 3 } }
