name: Giant Growth can target a creature another player controls
rules: [CR 115.1, CR 109.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Giant Growth]
    battlefield: [Forest]
  p2:
    battlefield: [Gray Ogre]
steps:
  - p1 cast: Giant Growth
    targets: [p2:Gray Ogre]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Giant Growth]
      events contains: [{ type: EFFECT_CREATED, effect: { controller: p1 } }]
