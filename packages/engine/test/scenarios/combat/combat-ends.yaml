name: After combat, attackers stay tapped but are no longer attacking
rules: [CR 511.3, CR 508.1f]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until main2
  - expect:
      p1:Grizzly Bears.tapped: true
      p2.life: 18
