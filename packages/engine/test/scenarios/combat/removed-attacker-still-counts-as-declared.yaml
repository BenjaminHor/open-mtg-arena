name: If the only attacker dies before blockers, the declare blockers step still happens
rules: [CR 508.8, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    hand: [Lightning Bolt]
    battlefield: [Mountain, Gray Ogre]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p1.graveyard: [Grizzly Bears]
  - all pass: once
  - expect:
      step: combat.declareBlockers
      pending: { player: p1, kind: priority }
