name: An attacker whose only blocker is gone stays blocked and deals no combat damage
rules: [CR 509.1h, CR 510.1c, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain, Hill Giant]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Hill Giant }
  - p1 cast: Lightning Bolt
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      p2.graveyard: [Grizzly Bears]
  - all pass: until combat.damage
  - expect:
      p2.life: 20
