name: The division is free, with no damage assignment order, so all of it can go to one blocker
rules: [CR 510.1c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Craw Wurm]
  p2:
    battlefield: [Grizzly Bears, Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Craw Wurm, Giant Spider: Craw Wurm }
  - all pass: until combat.damage
  - p1 assign: { Grizzly Bears: 0, Giant Spider: 6 }
  - expect:
      p2.battlefield: [Grizzly Bears]
      p2:Grizzly Bears.damage: 0
      p2.graveyard: [Giant Spider]
