name: A blocker whose attacker has left combat deals no combat damage
rules: [CR 510.1d, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain, Grizzly Bears]
  p2:
    battlefield: [Gray Ogre]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Gray Ogre: Grizzly Bears }
  - p1 cast: Lightning Bolt
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: until combat.damage
  - expect:
      p2:Gray Ogre.damage: 0
      p2.life: 20
