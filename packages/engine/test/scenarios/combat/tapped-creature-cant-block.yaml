name: A tapped creature can't block
rules: [CR 509.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    battlefield: [{ card: Hill Giant, tapped: true }, Gray Ogre]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Grizzly Bears }
  - expect error: illegalAction
