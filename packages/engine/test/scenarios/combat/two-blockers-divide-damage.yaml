name: An attacker blocked by two creatures divides its damage among them as its controller chooses
rules: [CR 510.1c, CR 510.1e, CR 509.1h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Craw Wurm]
  p2:
    battlefield: [Grizzly Bears, Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Craw Wurm, Giant Spider: Craw Wurm }
  - all pass: until combat.damage
  - expect:
      pending: { player: p1, kind: assignDamage }
  - p1 assign: { Grizzly Bears: 2, Giant Spider: 4 }
  - expect:
      p2.graveyard: [Grizzly Bears, Giant Spider]
      p1.graveyard: [Craw Wurm]
      p2.life: 20
