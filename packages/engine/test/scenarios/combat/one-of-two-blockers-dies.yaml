name: If only one blocker is left, the attacker deals all its damage to it without dividing
rules: [CR 510.1c, CR 506.4]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Craw Wurm]
  p2:
    hand: [Lightning Bolt]
    battlefield: [Mountain, Grizzly Bears, Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Craw Wurm, Giant Spider: Craw Wurm }
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - all pass: until combat.damage
  - expect:
      pending: { player: p1, kind: priority }
      p2.graveyard: [Lightning Bolt, Grizzly Bears, Giant Spider]
