name: Declaring no attackers skips the declare blockers and combat damage steps
rules: [CR 508.8]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: []
  - expect:
      step: combat.declareAttackers
      p1:Grizzly Bears.tapped: false
  - all pass: once
  - expect:
      step: combat.end
