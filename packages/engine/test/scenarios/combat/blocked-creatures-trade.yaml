name: A blocked attacker and its blocker deal damage to each other at the same time, and both die
rules: [CR 509.1a, CR 510.1c, CR 510.1d, CR 510.2, CR 704.5g]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    battlefield: [Gray Ogre]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - expect:
      pending: { player: p2, kind: declareBlockers }
  - p2 block: { Gray Ogre: Grizzly Bears }
  - expect:
      pending: { player: p1, kind: priority }
      events contains: [{ type: BLOCKERS_DECLARED }]
  - all pass: until combat.damage
  - expect:
      p2.life: 20
      p1.graveyard: [Grizzly Bears]
      p2.graveyard: [Gray Ogre]
