name: A creature with flying can't be blocked by a creature without flying or reach
rules: [CR 702.9b, CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Furnace Whelp]
  p2:
    battlefield: [Hill Giant, Giant Spider]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Furnace Whelp]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Furnace Whelp }
  - expect error: illegalAction
  - p2 block: {}
  - all pass: until combat.damage
  - expect:
      p2.life: 18
