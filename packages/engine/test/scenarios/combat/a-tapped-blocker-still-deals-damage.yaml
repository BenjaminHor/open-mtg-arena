name: A blocker that taps for mana after blocking is still in combat and still deals its combat damage
rules: [CR 506.4b, CR 510.1c, CR 510.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Hill Giant]
  p2:
    battlefield: [Grizzly Bears, Llanowar Elves]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Hill Giant]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Hill Giant, Llanowar Elves: Hill Giant }
  - p1 pass: once
  # Tapping a blocker doesn't remove it from combat or stop its damage (CR 506.4b).
  - p2 activate: Llanowar Elves
  - expect:
      p2:Llanowar Elves.tapped: true
  - all pass: once
  - p1 assign: { Grizzly Bears: 2, Llanowar Elves: 1 }
  # Hill Giant (3/3) takes 2 from the Bears and 1 from the tapped Elves: it dies only because the Elves dealt theirs.
  - expect:
      p1.graveyard: [Hill Giant]
      p2.graveyard: [Grizzly Bears, Llanowar Elves]
