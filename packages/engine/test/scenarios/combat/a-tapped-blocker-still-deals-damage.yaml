name: A blocker that taps for mana after blocking still deals and takes combat damage, among three blockers
rules: [CR 506.4b, CR 510.1c, CR 510.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Craw Wurm]
  p2:
    battlefield: [Grizzly Bears, Grizzly Bears, Llanowar Elves]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Craw Wurm]
  - all pass: until combat.declareBlockers
  - p2 block: { Grizzly Bears: Craw Wurm, Grizzly Bears#2: Craw Wurm, Llanowar Elves: Craw Wurm }
  - p1 pass: once
  # Tapping a blocker doesn't remove it from combat (CR 506.4b).
  - p2 activate: Llanowar Elves
  - expect:
      p2:Llanowar Elves.tapped: true
  - all pass: once
  # Craw Wurm (6/4) divides its 6 damage; the three blockers deal it 2 + 2 + 1 = 5, enough to destroy it.
  - p1 assign: { Grizzly Bears: 2, Grizzly Bears#2: 3, Llanowar Elves: 1 }
  - expect:
      p1.graveyard: [Craw Wurm]
      p2.graveyard: [Grizzly Bears, Grizzly Bears, Llanowar Elves]
