name: A creature that just came under its controller's control can still block
rules: [CR 302.6, CR 509.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    battlefield: [{ card: Hill Giant, sick: true }]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - p2 block: { Hill Giant: Grizzly Bears }
  - all pass: until combat.damage
  - expect:
      p1.graveyard: [Grizzly Bears]
      p2:Hill Giant.damage: 2
