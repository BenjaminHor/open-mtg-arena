name: Unspent mana empties from every pool as a step ends
rules: [CR 500.5]
setup:
  turn: { active: p1, step: main1 }
  p1: { manaPool: { R: 2 } }
  p2: { manaPool: { G: 1 } }
steps:
  - p1 pass: once
  - expect:
      p1.manaPool: { R: 2 }
      step: main1
  - p2 pass: once
  - expect:
      step: combat.beginning
      p1.manaPool: {}
      p2.manaPool: {}
