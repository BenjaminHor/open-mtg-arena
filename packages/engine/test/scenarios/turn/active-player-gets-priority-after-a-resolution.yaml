name: After a spell resolves, the active player gets priority, whoever cast it
rules: [CR 117.3b]
setup:
  turn: { active: p1, step: upkeep }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    hand: [Shock]
    battlefield: [Mountain]
steps:
  - p1 pass: once
  - p2 cast: Shock
    targets: [p1:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      step: upkeep
      pending: { player: p1, kind: priority }
      p1.graveyard: [Grizzly Bears]
