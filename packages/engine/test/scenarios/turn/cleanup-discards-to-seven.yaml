name: In cleanup the active player chooses cards to discard down to seven, before damage is removed
rules: [CR 514.1, CR 514.2, CR 514.3, CR 402.2, CR 701.9a]
setup:
  turn: { active: p1, step: end }
  p1:
    hand: [Forest, Forest, Forest, Forest, Forest, Forest, Forest, Shock, Grizzly Bears]
    battlefield: [{ card: Grizzly Bears, damage: 1 }]
  p2:
    hand: [Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain, Mountain]
steps:
  - all pass: once
  - expect:
      step: cleanup
      pending: { player: p1, kind: discardToHandSize, remaining: 2 }
      p1:Grizzly Bears.damage: 1
  - p1 pass: once
  - expect error: illegalAction
  - p1 choose: Shock
  - expect:
      p1.hand count: 9
      pending: { player: p1, kind: discardToHandSize, remaining: 1 }
  - p1 choose: Grizzly Bears
  - expect:
      p1.hand: [Forest, Forest, Forest, Forest, Forest, Forest, Forest]
      p1.graveyard: [Shock, Grizzly Bears]
      p2.hand count: 9
      active: p2
