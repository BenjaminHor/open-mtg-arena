name: Sorceries and creatures only in your own main phase with an empty stack
rules: [CR 307.1, CR 302.1, CR 117.1a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Volcanic Hammer, Lightning Bolt, Grizzly Bears]
    battlefield: [Mountain, Mountain, Mountain, Forest, Forest]
  p2:
    hand: [Volcanic Hammer]
    battlefield: [Mountain, Mountain]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - p1 cast: Volcanic Hammer
    targets: [p2]
    pay: auto
  - expect error: illegalAction
  - p1 cast: Grizzly Bears
    pay: auto
  - expect error: illegalAction
  - p1 pass: once
  - p2 cast: Volcanic Hammer
    targets: [p1]
    pay: auto
  - expect error: illegalAction
