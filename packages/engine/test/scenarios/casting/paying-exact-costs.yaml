name: A cost is paid exactly, with colored mana for colored symbols and any mana for generic
rules: [CR 601.2h, CR 107.4a, CR 107.4b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Volcanic Hammer]
    battlefield: [Forest, Mountain, Mountain]
steps:
  - p1 activate: Forest
  - p1 activate: Mountain
  - expect:
      p1.manaPool: { G: 1, R: 1 }
  - p1 cast: Volcanic Hammer
    targets: [p2]
    pay: { G: 1, R: 1 }
  - expect:
      stack: [Volcanic Hammer]
      p1.manaPool: {}
      p1:Mountain#2.tapped: false
