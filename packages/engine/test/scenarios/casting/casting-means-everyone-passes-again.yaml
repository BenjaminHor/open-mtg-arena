name: Casting a spell is an action, so everyone must pass again; a cancelled cast isn't
rules: [CR 117.4, CR 117.3c, CR 601.2i, CR 734.1]
setup:
  turn: { active: p2, step: upkeep }
  p1:
    hand: [Lightning Bolt, Shock]
    battlefield: [Mountain]
steps:
  - p2 pass: once
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - expect:
      pending: { player: p1, kind: priority }
  - p1 pass: once
  - expect:
      stack: [Lightning Bolt]
      pending: { player: p2, kind: priority }
