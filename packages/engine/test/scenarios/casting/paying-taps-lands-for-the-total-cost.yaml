name: Paying for a spell activates mana abilities for its total cost, then pays it
rules: [CR 601.2f, CR 601.2g, CR 601.2h]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Volcanic Hammer]
    battlefield: [Mountain, Mountain, Mountain]
steps:
  # Volcanic Hammer's total cost is its mana cost, {1}{R}: two of the three Mountains are tapped for it.
  - p1 cast: Volcanic Hammer
    targets: [p2]
    pay: auto
  - expect:
      stack: [Volcanic Hammer]
      p1:Mountain.tapped: true
      p1:Mountain#2.tapped: true
      p1:Mountain#3.tapped: false
      p1.manaPool: {}
      events contains: [{ type: MANA_ADDED, mana: R }, { type: MANA_ADDED, mana: R }, { type: SPELL_CAST }]
