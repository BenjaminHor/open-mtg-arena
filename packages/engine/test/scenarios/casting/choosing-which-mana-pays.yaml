name: The player chooses which mana pays a generic cost
rules: [CR 601.2h, CR 107.4b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Volcanic Hammer]
    manaPool: { R: 2, G: 1 }
steps:
  - p1 cast: Volcanic Hammer
    targets: [p2]
    pay: { R: 2 }
  - expect:
      stack: [Volcanic Hammer]
      p1.manaPool: { G: 1 }
