name: Mana of the wrong color can't pay a colored symbol
rules: [CR 601.2h, CR 107.4a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain]
    manaPool: { G: 1 }
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: { G: 1 }
  - expect error: illegalAction
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - expect:
      stack: [Lightning Bolt]
      p1.manaPool: { G: 1 }
