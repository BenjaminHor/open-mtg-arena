name: A creature spell is cast at sorcery speed, paid for, and resolves onto the battlefield
rules: [CR 601.2, CR 601.2h, CR 302.1, CR 608.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Grizzly Bears]
    battlefield: [Forest, Forest]
steps:
  - p1 cast: Grizzly Bears
    pay: auto
  - expect:
      stack: [Grizzly Bears]
      p1.hand: []
      p1.manaPool: {}
      p1:Forest#1.tapped: true
      p1:Forest#2.tapped: true
      pending: { player: p1, kind: priority }
      events contains: [{ type: SPELL_CAST, player: p1 }]
  - all pass: once
  - expect:
      stack: []
      p1.battlefield: [Forest, Forest, Grizzly Bears]
