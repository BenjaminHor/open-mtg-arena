name: A spell whose only target died before it resolved doesn't resolve
rules: [CR 608.2b, CR 704.5g, CR 400.7]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Shock, Lightning Bolt]
    battlefield: [Mountain, Mountain]
  p2:
    battlefield: [Grizzly Bears]
steps:
  - p1 cast: Shock
    targets: [p2:Grizzly Bears]
    pay: auto
  - p1 cast: Lightning Bolt
    targets: [p2:Grizzly Bears]
    pay: auto
  - all pass: once
  - expect:
      stack: [Shock]
      p2.graveyard: [Grizzly Bears]
  - all pass: once
  - expect:
      stack: []
      p1.graveyard: [Lightning Bolt, Shock]
      events contains: [{ type: SPELL_DID_NOT_RESOLVE }]
