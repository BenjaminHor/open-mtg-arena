name: Starting to cast a spell you can't pay for is legal, but you can't finish it, so you cancel
rules: [CR 118.6, CR 601.2h, CR 107.4a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Forest]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
  - expect:
      stack: [Lightning Bolt]
      pending: { player: p1, kind: payMana }
  - p1 choose: { R: 1 }
  - expect error: illegalAction
  - p1 activate: Forest
  - p1 choose: { G: 1 }
  - expect error: illegalAction
  - expect:
      pending: { player: p1, kind: payMana }
      p1.manaPool: { G: 1 }
  - p1 choose: cancel
  - expect:
      stack: []
      p1.hand: [Lightning Bolt]
      p1.manaPool: {}
      p1:Forest.tapped: false
