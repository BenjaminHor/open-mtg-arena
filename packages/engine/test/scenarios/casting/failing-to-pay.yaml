name: A spell can't be cast without the mana to pay for it, and a payment must match the cost
rules: [CR 601.2h, CR 118.3, CR 107.4a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt, Volcanic Hammer]
    battlefield: [Forest]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - expect error: illegalAction
  - p1 activate: Forest
  - p1 cast: Volcanic Hammer
    targets: [p2]
  - expect error: illegalAction
  - expect:
      p1.hand: [Lightning Bolt, Volcanic Hammer]
      p1.manaPool: { G: 1 }
