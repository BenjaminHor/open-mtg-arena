name: A cancelled cast never happened, so the passes before it still count
rules: [CR 734.1, CR 117.4]
setup:
  turn: { active: p1, step: main1 }
  p2:
    hand: [Lightning Bolt]
    battlefield: [Forest]
steps:
  - p1 pass: once
  - p2 cast: Lightning Bolt
    targets: [p1]
  - p2 choose: cancel
  - p2 pass: once
  - expect:
      step: combat.beginning
