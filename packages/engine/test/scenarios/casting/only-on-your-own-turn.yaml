name: Sorcery-speed spells and land plays need it to be your own turn, even in a main phase with an empty stack
rules: [CR 117.1a, CR 302.1, CR 307.1, CR 305.1]
setup:
  turn: { active: p1, step: main1 }
  p2:
    hand: [Grizzly Bears, Volcanic Hammer, Forest]
    battlefield: [Forest, Forest, Mountain]
steps:
  - p1 pass: once
  - p2 cast: Grizzly Bears
  - expect error: illegalAction
  - p2 cast: Volcanic Hammer
  - expect error: illegalAction
  - p2 play: Forest
  - expect error: illegalAction
