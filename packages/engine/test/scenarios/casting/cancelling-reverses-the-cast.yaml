name: Cancelling a cast puts everything back as it was, including the card's place in hand
rules: [CR 734.1, CR 734.2, CR 605.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Shock, Lightning Bolt]
    battlefield: [Mountain, Mountain, Mountain]
steps:
  - p1 activate: Mountain
  - expect:
      p1.manaPool: { R: 1 }
  - p1 cast: Shock
    targets: [p2]
  - p1 activate: Mountain
  - expect:
      p1.manaPool: { R: 2 }
      pending: { player: p1, kind: payMana }
  - p1 choose: cancel
  - expect:
      stack: []
      p1.hand: [Shock, Lightning Bolt]
      p1.manaPool: { R: 1 }
      p1:Mountain#1.tapped: true
      p1:Mountain#2.tapped: false
      pending: { player: p1, kind: priority }
      events contains: [{ type: CAST_CANCELLED, player: p1 }]
  - p1 cast: Lightning Bolt
    targets: [p2]
  - p1 choose: cancel
  - expect:
      p1.hand: [Shock, Lightning Bolt]
