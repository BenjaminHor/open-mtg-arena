name: Fireball can't count a creature with shroud among its targets; divided among the others, it never touches it
rules: [CR 702.18a, CR 601.2c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Mountain, Mountain, Mountain, Mountain]
    hand: [Fireball]
  p2:
    battlefield: [Mist Leopard, Runeclaw Bear]
steps:
  - p1 cast: Fireball
    x: 2
    targets: [[p2:Mist Leopard, p2:Runeclaw Bear]]
    pay: auto
  - expect error: illegalAction
  - p1 cast: Fireball
    x: 2
    targets: [[p2:Runeclaw Bear, p2]]
    pay: auto
  - all pass: once
  - expect:
      p2:Mist Leopard.damage: 0
      p2:Runeclaw Bear.damage: 1
      p2.life: 19
