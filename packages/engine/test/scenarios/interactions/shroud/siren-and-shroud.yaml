name: Alluring Siren can't target a creature with shroud, so nothing makes it attack
rules: [CR 702.18a, CR 508.1d]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Alluring Siren]
  p2:
    battlefield: [Mist Leopard]
steps:
