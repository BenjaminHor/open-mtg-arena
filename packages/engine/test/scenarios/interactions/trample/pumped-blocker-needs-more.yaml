name: Pumping the blocker raises the lethal damage a trampler needs; with no excess left, nothing tramples over
rules: [CR 702.19b, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Stampeding Rhino]
  p2:
    hand: [Giant Growth]
    battlefield: [Forest, Runeclaw Bear]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Stampeding Rhino]
  - all pass: until combat.declareBlockers
  - p2 block: { Runeclaw Bear: Stampeding Rhino }
  - p1 pass: once
  - p2 cast: Giant Growth
    targets: [p2:Runeclaw Bear]
    pay: auto
  - all pass: once
  - all pass: until combat.damage
  - expect:
      pending: { kind: priority }
      p2.life: 20
      p2:Runeclaw Bear.damage: 4
      p1.graveyard: [Stampeding Rhino]
