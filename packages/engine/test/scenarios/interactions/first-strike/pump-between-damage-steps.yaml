name: Players get priority between the two combat damage steps, so a Giant Growth there saves the first striker
rules: [CR 510.3, CR 510.4, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Giant Growth]
    battlefield: [Forest, Viashino Spearhunter]
  p2:
    battlefield: [Siege Mastodon]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Viashino Spearhunter]
  - all pass: until combat.declareBlockers
  - p2 block: { Siege Mastodon: Viashino Spearhunter }
  - all pass: until combat.damage
  # The first strike step: the 2/1 dealt 2 to the 3/5 and the Mastodon hasn't dealt damage yet.
  - expect:
      p2:Siege Mastodon.damage: 2
      pending: { player: p1, kind: priority }
  - p1 cast: Giant Growth
    targets: [p1:Viashino Spearhunter]
    pay: auto
  - all pass: once
  - all pass: once
  # The second step: only the Mastodon deals damage, 3 to a 5/4.
  - expect:
      step: combat.damage
      p1:Viashino Spearhunter.damage: 3
      p2:Siege Mastodon.damage: 2
      p1.battlefield: [Forest, Viashino Spearhunter]
