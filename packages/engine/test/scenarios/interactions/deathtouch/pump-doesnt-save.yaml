name: Giant Growth doesn't save a creature from deathtouch, since any damage from it destroys
rules: [CR 702.2b, CR 704.5h, CR 613.4c]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Giant Growth]
    battlefield: [Forest, Runeclaw Bear]
  p2:
    battlefield: [Deadly Recluse]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Runeclaw Bear]
  - all pass: until combat.declareBlockers
  - p2 block: { Deadly Recluse: Runeclaw Bear }
  - p1 cast: Giant Growth
    targets: [p1:Runeclaw Bear]
    pay: auto
  - all pass: once
  - all pass: until combat.damage
  - expect:
      p1.graveyard: [Giant Growth, Runeclaw Bear]
      p2.graveyard: [Deadly Recluse]
