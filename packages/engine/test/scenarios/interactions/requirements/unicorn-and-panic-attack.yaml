name: A creature that can't block isn't able to block Prized Unicorn, so it doesn't have to
rules: [CR 509.1c, CR 509.1b]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Prized Unicorn, Mountain, Mountain, Mountain]
    hand: [Panic Attack]
  p2:
    battlefield: [Runeclaw Bear, Elite Vanguard]
steps:
  - p1 cast: Panic Attack
    targets: [[p2:Runeclaw Bear]]
    pay: auto
  - all pass: once
  - all pass: until combat.declareAttackers
  - p1 attack: [Prized Unicorn]
  - all pass: until combat.declareBlockers
  - p2 block: {}
  - expect error: illegalAction
  - p2 block: { Elite Vanguard: Prized Unicorn }
  - all pass: until main2
  - expect:
      p2.graveyard: [Elite Vanguard]
