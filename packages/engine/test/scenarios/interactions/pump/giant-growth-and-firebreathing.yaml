name: Giant Growth and firebreathing on one creature both apply, and both end in the cleanup step
rules: [CR 613.4c, CR 613.7, CR 514.2]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Giant Growth]
    battlefield: [Mountain, Forest, Furnace Whelp]
steps:
  - p1 activate: Furnace Whelp
    pay: auto
  - all pass: once
  - expect:
      p1:Furnace Whelp.power: 3
      p1:Furnace Whelp.toughness: 2
  - p1 cast: Giant Growth
    targets: [p1:Furnace Whelp]
    pay: auto
  - all pass: once
  # Both change power and toughness in layer 7c, applied in timestamp order: 2/2, +1/+0, +3/+3.
  - expect:
      p1:Furnace Whelp.power: 6
      p1:Furnace Whelp.toughness: 5
  - all pass: until upkeep
  - expect:
      p1:Furnace Whelp.power: 2
      p1:Furnace Whelp.toughness: 2
