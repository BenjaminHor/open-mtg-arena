name: Conceding in the middle of casting a spell ends the game there
rules: [CR 104.3a, CR 104.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain]
steps:
  - p1 cast: Lightning Bolt
  - expect:
      pending: { player: p1, kind: chooseTarget }
  - p1 concede: now
  - expect:
      winner: p2
      pending: null
