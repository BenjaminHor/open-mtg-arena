name: The attacking player can concede while the other player is declaring blockers
rules: [CR 104.3a]
setup:
  turn: { active: p1, step: main1 }
  p1:
    battlefield: [Grizzly Bears]
  p2:
    battlefield: [Gray Ogre]
steps:
  - all pass: until combat.declareAttackers
  - p1 attack: [Grizzly Bears]
  - all pass: until combat.declareBlockers
  - expect:
      pending: { player: p2, kind: declareBlockers }
  - p1 concede: now
  - expect:
      winner: p2
      pending: null
      p2.life: 20
