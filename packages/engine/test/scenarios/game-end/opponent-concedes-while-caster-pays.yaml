name: A player can concede while the other player is paying for a spell; the spell never becomes cast
rules: [CR 104.3a, CR 104.1]
setup:
  turn: { active: p1, step: main1 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain]
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
  - p1 activate: Mountain
  - p2 concede: now
  - expect:
      winner: p1
      stack: [Lightning Bolt]
      p2.life: 20
