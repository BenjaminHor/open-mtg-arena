name: Losing to 0 life reports the reason and the turn in the result
rules: [CR 104.3b, CR 704.5a]
setup:
  turn: { active: p1, step: main1, number: 7 }
  p1:
    hand: [Lightning Bolt]
    battlefield: [Mountain]
  p2:
    life: 3
steps:
  - p1 cast: Lightning Bolt
    targets: [p2]
    pay: auto
  - all pass: once
  - expect:
      events contains:
        - { type: GAME_ENDED, result: { winner: p1, losses: [{ player: p2, reason: zeroLife }], turn: 7 } }
