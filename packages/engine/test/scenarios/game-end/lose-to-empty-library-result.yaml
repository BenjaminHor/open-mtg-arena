name: Losing to an empty library reports that reason in the result
rules: [CR 104.3c, CR 704.5b]
setup:
  turn: { active: p1, step: upkeep, number: 4 }
  p1:
    library: []
steps:
  - all pass: until draw
  - expect:
      events contains:
        - type: GAME_ENDED
          result: { winner: p2, losses: [{ player: p1, reason: drewFromEmptyLibrary }], turn: 4 }
